
name: Release Kobel Android

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Android versionCode — must be higher than every previous release"
        required: true
        type: string
        default: "221"
      versionName:
        description: "Release version, for example 2.2.1"
        required: true
        type: string
        default: "2.2.1"
      publishRelease:
        description: "Publish a public GitHub Release after a successful build"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and optionally publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Validate release version
        shell: bash
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer."
            exit 1
          fi

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "versionName must use the format X.Y.Z, for example 2.2.1."
            exit 1
          fi

          TAG="v${VERSION_NAME}"
          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists. Choose a new version."
            exit 1
          fi

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > android/kobel-release.jks
          test -s android/kobel-release.jks

      - name: Create temporary signing configuration
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              for char in ("\\", "\t", "\n", "\r", "\f", "=", ":"):
                  value = value.replace(char, "\\" + char)
              return value.replace(" ", "\\ ")

          values = {
              "storeFile": "kobel-release.jks",
              "storePassword": os.environ["STORE_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "keyPassword": os.environ["KEY_PASSWORD"],
          }

          if not all(values.values()):
              raise SystemExit("A required signing secret is missing.")

          content = "".join(
              f"{key}={escape(value)}\n"
              for key, value in values.items()
          )

          Path("android/keystore.properties").write_text(
              content, encoding="utf-8"
          )
          PY

      - name: Build signed release APK
        shell: bash
        working-directory: android
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          chmod +x ./gradlew

          ./gradlew --no-daemon assembleRelease \
            "-PkobelApi=https://kobel-api.thehdv7.workers.dev" \
            "-PkobelRepo=Hytyei/Kobel" \
            "-PversionCode=${VERSION_CODE}" \
            "-PversionName=${VERSION_NAME}"

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets

          cp android/app/build/outputs/apk/release/app-release.apk \
            release-assets/kobel-release.apk

          cd release-assets
          sha256sum kobel-release.apk > kobel-release.apk.sha256

      - name: Publish GitHub Release
        if: ${{ inputs.publishRelease }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ inputs.versionName }}
          name: Kobel v${{ inputs.versionName }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/kobel-release.apk
            release-assets/kobel-release.apk.sha256
