org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# GitHub repo that hosts your releases (used by the in-app updater), e.g. kobelUser/kobel
kobelRepo=Hytyei/Kobel

# Compile Kotlin inside Gradle itself. Avoids "Could not connect to Kotlin compile daemon"
# (caused by firewalls, VPNs/proxies or antivirus blocking the local daemon connection).
kotlin.compiler.execution.strategy=in-process

# Your production Worker address (not a secret). New users never type it: the app connects here by default.
# Must start with https://. Leave empty only to build an app that has no default server.
kobelApi=https://kobel-api.thehdv7.workers.dev
