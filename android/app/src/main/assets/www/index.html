/* ───────── session engine ───────── */
let ses=null;
const R={};
function avail(c){
  const a=[];if(WALL().length>=4)a.push('mc1','mc2');a.push('type');
  if(c.art)a.push('art');if(pluralOf(c))a.push('plu');if(clozeOf(c))a.push('cloze');if(canSpeak())a.push('listen');if(scrOK(c))a.push('scr');if(sentenceOf(c))a.push('order');return a;
}
function pickKindOld(c,mode){
  if(isG(c))return'gcl';
  const av=avail(c);
  if(mode==='flash'||mode==='ahead')return'flash';
  const r=c.srs.reps;
  const pref=r<2?['mc1','mc2','art','plu','cloze']:r<4?['mc2','type','scr','cloze','art','plu','listen']:['type','listen','scr','order','cloze','mc2','plu'];
  const ok=pref.filter(k=>av.includes(k));const pool=ok.length?ok:av;
  let k=pool[rnd(pool.length)];if(k===ses.lastKind&&pool.length>1)k=pool[rnd(pool.length)];
  return k;
}
function gather(pool,n,newCap,extras){
  const now=Date.now();
  const due=pool.filter(c=>c.srs.seen>0&&c.srs.due<=now).sort((a,b)=>a.srs.due-b.srs.due);
  const fresh=shuffle(pool.filter(c=>c.srs.seen===0)).slice(0,newCap);
  let list=due.slice(0,n).map(c=>({c,extra:false}));
  fresh.slice(0,Math.max(0,n-list.length)).forEach(c=>list.push({c,extra:false}));
  const need=extras?Math.min(n,extras):0;
  if(list.length<need)pool.filter(c=>c.srs.seen>0&&c.srs.due>now).sort((a,b)=>a.srs.due-b.srs.due).slice(0,need-list.length).forEach(c=>list.push({c,extra:true}));
  return list;
}
function startSession(mode,lesson,opt={}){
  const gShare=S.settings.gShare;
  let vpool=poolW(lesson).filter(act),gpool=poolG(lesson).filter(act);
  if(mode==='new'){vpool=vpool.filter(c=>!c.srs.seen);gpool=[]}
  if(mode==='tricky'){vpool=tricky(vpool);gpool=gpool.filter(c=>(c.bad||0)>1);if(!vpool.length&&!gpool.length){toast('No tricky words yet. Nice!');return}}
  if(mode==='flash')gpool=[];
  if(mode==='ahead'){const now=Date.now(),lim=now+(opt.days||1)*DAY;vpool=vpool.filter(c=>c.srs.seen>0&&c.srs.due>now&&c.srs.due<=lim).sort((a,b)=>a.srs.due-b.srs.due);gpool=[];if(!vpool.length){toast('Nothing due in that window');return}}
  const MAX=mode==='new'?14:12;
  let nG=gpool.length&&gShare>0&&mode!=='new'?Math.max(1,Math.round(MAX*gShare)):0;
  let list;
  if(mode==='ahead')list=vpool.slice(0,MAX).map(c=>({c,extra:false}));
  else if(mode==='tricky')list=vpool.slice(0,MAX).map(c=>({c,extra:c.srs.seen>0&&c.srs.due>Date.now()})).concat(gpool.slice(0,nG).map(c=>({c,extra:true})));
  else{
    const gl=gather(gpool,nG,2,nG);
    const vl=gather(vpool,MAX-gl.length,mode==='new'?MAX:S.settings.newPer,6);
    list=vl.concat(gl);
  }
  if(!list.length){toast(mode==='new'?'No new words waiting':'Nothing to practise yet. Import some notes!');return}
  ses={mode,lesson,opt,items:[],i:0,correct:0,wrong:0,xp:0,combo:0,maxCombo:0,graded:new Set(),t0:Date.now(),learned:0,locked:false,lastKind:'',startLvl:lvl(S.stats.xp)};
  planItems(list,mode);
  if(mode==='mix'){
    const seen=list.filter(x=>!isG(x.c)&&x.c.srs.seen>0).map(x=>x.c.id);
    if(ses.items.length>=8&&seen.length>=4)ses.items.splice(Math.floor(ses.items.length/2),0,{kind:'match',cids:shuffle(seen).slice(0,5)});
  }
  openOverlay();next();
}
function openOverlay(rush){
  wipe();
  const el=document.createElement('div');el.className='ses'+(rush?' rush':'');el.id='ses';
  el.innerHTML=`<div class="ses-top"><button class="x" data-a="quit" aria-label="Close">✕</button><div class="track" id="trk"><i id="prog"></i></div><div class="combo" id="cmb"></div>${rush?'':'<button class="x" data-a="cardmenu" aria-label="Card options">⋯</button>'}</div><div class="sMain" id="sMain"></div><div class="foot" id="sFoot" ${rush?'style="display:none"':''}><div class="in"></div></div>`;
  document.body.appendChild(el);
}
function drawTop(){
  if(!ses)return;
  const prog=$('#prog');
  if(ses.rush){prog.style.width=Math.max(0,ses.left/ses.secs*100)+'%';$('#trk').classList.toggle('warn',ses.left<10)}
  else prog.style.width=Math.max(3,ses.i/ses.items.length*100)+'%';
  const c=$('#cmb');let t='';
  if(ses.combo>=2)t+='x'+ses.combo+' ';
  if(ses.arcade&&!ses.rush)t+=ses.exam?(ses.correct+'/'+ses.items.length):ses.score;
  c.textContent=t;
  if(ses.combo>=2){c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse')}
}
const setMain=h=>{const m=$('#sMain');m.innerHTML=h;m.scrollTop=0};
const setFoot=(h,cls='')=>{const f=$('#sFoot');f.className='foot '+cls;f.innerHTML=`<div class="in">${h}</div>`};
function nextOld(){
  if(ses.i>=ses.items.length)return ses.exam?finishExam():ses.arcade?finishArcade():ses.path?finishPath():finish();
  ses.locked=false;const it=ses.items[ses.i];ses.cur=it;ses.lastKind=it.kind;drawTop();
  stopSpeak()
  R[it.kind](it);
}
const advance=()=>{ses.i++;next()};
function requeueOld(it){ses.items.splice(Math.min(ses.items.length,ses.i+4),0,{cid:it.cid,kind:it.kind,retry:true})}
function floatXP(t){const d=document.createElement('div');d.className='xpf';d.textContent=typeof t==='number'?'+'+t:t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
const PRAISE=['Richtig!','Genau!','Super!','Wunderbar!','Stark!','Prima!','Ausgezeichnet!','Klasse!'];
function markBad(c){c.bad=(c.bad||0)+1;if(c.srs.seen>0)c.srs.due=Math.min(c.srs.due,Date.now())}
function resolve(it,res,info={}){
  if(ses.locked)return;ses.locked=true;
  const c=it.cid?byId(it.cid):null,good=res!=='bad';
  track(c,res);
  if(c){if(good)c.ok=(c.ok||0)+1;else c.bad=(c.bad||0)+1}
  if(c&&!ses.arcade&&!it.retry&&!ses.graded.has(c.id)){
    ses.graded.add(c.id);const was=c.srs.seen===0;
    grade(c,res==='ok'?2:res==='close'?1:0,it.extra);if(was&&good)ses.learned++;
  }
  if(ses.arcade&&c&&!good&&c.srs.seen>0)c.srs.due=Math.min(c.srs.due,Date.now());
  if(good){
    let pts;
    if(ses.arcade){pts=Math.max(2,(res==='ok'?10+Math.min(ses.combo,5):6)-3*(info.hints||0));ses.score+=pts}
    else{pts=res==='ok'?10+(ses.combo>=5?5:0):5;ses.xp+=pts}
    ses.correct++;ses.combo++;ses.maxCombo=Math.max(ses.maxCombo,ses.combo);floatXP(pts);sfx('ok');vib(12);
  }else{ses.wrong++;ses.combo=0;sfx('bad');vib([30,40,30]);if(c&&!it.retry&&!ses.arcade)requeue(it)}
  drawTop();save();
  const cls=res==='ok'?'good':res==='close'?'near':'bad';
  const ttl=res==='ok'?PRAISE[rnd(PRAISE.length)]:res==='close'?(info.msg&&/hint/i.test(info.msg)?'Nice, with a hint':'Almost!'):'Not quite';
  let body='';
  if(res==='close')body+=`${esc(info.msg||'Small slip.')}<br>`;
  if(res!=='ok')body+=`Answer: <b>${info.answer||''}</b>`;
  if(info.ex)body+=`<div style="margin-top:4px;font-size:15px;color:var(--mute)">${info.ex}</div>`;
  if(info.note)body+=`<div style="margin-top:4px;font-size:14px;color:var(--mute)">Tipp: ${esc(info.note)}</div>`;
  const b=$('#bl');if(b&&info.fill){b.textContent=info.fill;b.classList.add('filled')}
  setFoot(`<div class="fb">${emil(res==='ok'?'cheer':res==='close'?'think':'oops',54)}<div class="grow"><div class="h">${ttl}</div><div class="b">${body}</div></div>${info.say?`<button class="spk" data-a="say" data-t="${esc(info.say)}">${SPK}</button>`:''}</div><button class="btn ${good?'c-fern':'c-berry'}" id="cont">Continue</button>`,cls+' fb');
  $('#cont').onclick=advance;
  if(info.say&&canSpeak()&&it.kind!=='listen')speak(info.say);
}
function infoFor(c,answerHtml,extra){
  return Object.assign({answer:answerHtml,say:disDe(c),ex:c.ex?`${esc(plain(c.ex))}<br>${esc(c.exEn)}`:'',note:c.note},extra||{});
}
const norm=s=>String(s).toLowerCase().replace(/[.,!?;:"“”„'’()]/g,'').replace(/\s+/g,' ').trim();
const fold=s=>s.replace(/ä|ae/g,'a').replace(/ö|oe/g,'o').replace(/ü|ue/g,'u').replace(/ß|ss/g,'s');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]}
function judge(input,targets){
  const n=norm(input);if(!n)return{res:'bad'};
  const T=targets.map(norm);
  if(T.includes(n))return{res:'ok'};
  if(T.some(t=>fold(t)===fold(n)))return{res:'close',msg:'Watch the umlauts and ß.'};
  if(T.some(t=>t.length>4&&lev(t,n)<=(t.length>9?2:1)))return{res:'close',msg:'Tiny typo, but right idea.'};
  return{res:'bad'};
}
const tagH=(t,c)=>`<div class="tag t-${c}">${t}</div>`;
const speakBtn=t=>`<button class="spk" data-a="say" data-t="${esc(t)}">${SPK}</button>`;
function askChoice(it,cfg){
  setMain(`${tagH(cfg.tag,cfg.color)}<h2 class="q">${cfg.q}</h2>${cfg.sub?`<p class="sub">${cfg.sub}</p>`:''}<div class="opts ${cfg.cls||''}">${cfg.opts.map((o,i)=>`<button class="opt ${o.cls||''}" data-i="${i}"><span class="k">${i+1}</span><span>${o.html}</span></button>`).join('')}</div>`);
  setFoot('<button class="btn" id="chk" disabled>Check</button>');
  let sel=-1;const btns=[...document.querySelectorAll('#sMain .opt')];
  btns.forEach((b,i)=>b.onclick=()=>{if(ses.locked)return;sel=i;btns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('#chk').disabled=false;sfx('tick')});
  $('#chk').onclick=()=>{
    if(sel<0||ses.locked)return;
    const ok=cfg.opts[sel].v===cfg.correct;
    btns.forEach((b,i)=>{b.disabled=true;if(cfg.opts[i].v===cfg.correct)b.classList.add('ok');else if(i===sel)b.classList.add('no')});
    resolve(it,ok?'ok':'bad',cfg.info);
  };
}
function distract(c,fn,n=3){
  const seen=new Set([fn(c)]);const out=[];
  for(const x of shuffle(WALL())){if(x.id===c.id)continue;const v=fn(x);if(!v||seen.has(v))continue;seen.add(v);out.push(v);if(out.length>=n)break}
  return out;
}
function gDistractOld(c,ans,n=3){
  const seen=new Set([ans.toLowerCase()]);const out=[];
  const gs=GALL();
  const pools=[shuffle(gs.filter(x=>x.topic===c.topic)),shuffle(gs)];
  for(const p of pools)for(const x of p){const v=typeof x==='string'?x:(gz(x)||{}).ans;if(!v||seen.has(v.toLowerCase()))continue;seen.add(v.toLowerCase());out.push(v);if(out.length>=n)return out}
  return out;
}

/* ───────── arcade engines ───────── */
function startGame(id,lesson){
  const g=GAMES[id],req=gameReq(id,lesson);if(req){toast(req);return}
  if(g.kind==='rush')return startRush(id,lesson);
  const words=poolW(lesson);let items=[];
  if(id==='match'){const ps=shuffle(words);for(let r=0;r<2;r++){const grp=ps.slice(r*6,r*6+6);if(grp.length>=4)items.push({kind:'match',cids:grp.map(c=>c.id)})}}
  else if(id==='scramble')items=shuffle(words.filter(scrOK)).slice(0,8).map(c=>({cid:c.id,kind:'scr'}));
  else if(id==='echo')items=shuffle(words).slice(0,8).map(c=>({cid:c.id,kind:'listen'}));
  else if(id==='gap')items=shuffle(poolG(lesson)).slice(0,8).map(c=>({cid:c.id,kind:'gcl'}));
  if(!items.length){toast('Not enough material for this game');return}
  ses={game:id,arcade:true,items,i:0,correct:0,wrong:0,score:0,xp:0,combo:0,maxCombo:0,graded:new Set(),t0:Date.now(),learned:0,locked:false,lastKind:'',lesson};
  openOverlay();next();
}
function startRush(id,lesson){
  const g=GAMES[id];let pool=poolW(lesson);
  if(id==='dash')pool=pool.filter(c=>c.art);if(id==='plural')pool=pool.filter(pluralOf);
  ses={game:id,rush:true,arcade:true,secs:g.secs,left:g.secs,score:0,correct:0,wrong:0,combo:0,maxCombo:0,locked:false,t0:Date.now(),lesson,items:[],i:0,graded:new Set(),pool,recent:[]};
  openOverlay(true);drawTop();
  const my=ses;
  my.timer=setInterval(()=>{if(ses!==my||my.ended){clearInterval(my.timer);return}my.left-=.1;drawTop();if(my.left<=0){clearInterval(my.timer);my.ended=true;finishArcade()}},100);
  rushNext();
}
function rushPickOld(){
  const p=ses.pool;let c,t=0;
  do{c=p[rnd(p.length)];t++}while(ses.recent.includes(c.id)&&t<12&&p.length>4);
  ses.recent.push(c.id);if(ses.recent.length>3)ses.recent.shift();return c;
}

    if(rushDirTranslate())q={tag:'Translate',color:'lantern',prompt:fmtDe(c),opts:shuffle([c.en,...smartEn(c)]).map(v=>({v,html:esc(v)})),correct:c.en};

  else{const right=pluralOf(c);q={tag:'Plural',color:'berry',prompt:`${fmtDe(c)}`,sub:'die …',opts:shuffle([right,...pluralWrong(c,right,2)]).map(v=>({v,html:esc(v)})),correct:right}}
  setMain(`<div class="rushh">${tagH(q.tag,q.color)}<div class="sc">Score <b id="rs">${ses.score}</b></div></div><h2 class="q big">${q.prompt}</h2>${q.sub?`<p class="sub" style="text-align:center">${q.sub}</p>`:''}<div class="opts ${q.cls||''}">${q.opts.map((o,i)=>`<button class="opt ${o.cls||''}" data-i="${i}"><span class="k">${i+1}</span><span>${o.html}</span></button>`).join('')}</div>`);
  const btns=[...document.querySelectorAll('#sMain .opt')],my=ses;
  btns.forEach((b,i)=>b.onclick=()=>{
    if(my.locked||my.ended)return;my.locked=true;

    track(c,ok?'ok':'bad');
    if(ok){const pts=10+Math.min(my.combo,10);my.score+=pts;my.combo++;my.correct++;my.maxCombo=Math.max(my.maxCombo,my.combo);c.ok=(c.ok||0)+1;floatXP(pts);sfx('ok');vib(10);if(my.combo%5===0){my.left=Math.min(my.secs+10,my.left+2);floatXP('+2s')}}
    else{my.wrong++;my.combo=0;my.left-=3;markBad(c);sfx('bad');vib(30)}
    drawTop();const rs=$('#rs');if(rs)rs.textContent=my.score;
    setTimeout(()=>{if(ses===my&&!my.ended){my.locked=false;rushNext()}},ok?260:780);
  });

function finish(){

  const got=checkBadges();save();sfx('win');if(acc>=.6)confetti();vib([20,30,20,30,60]);
  const secs=Math.round((Date.now()-ses.t0)/1000),{mode,lesson,opt}=ses;

let syncStatus='Not synced yet',syncing=false;
const cardSig=c=>JSON.stringify([c.type,c.lesson,c.date,c.de,c.art,c.pl,c.forms,c.en,c.ex,c.exEn,c.note,c.sentence,c.topic,c.hint,c.srs,c.ok,c.bad,!!c.susp,c.bury||0]);
function stamp(){
  refreshPub();
  const now=Date.now();
  S.cards.forEach(c=>{const hh=cardSig(c);if(c.h!==hh){c.h=hh;c.u=now}});
  S.rules.forEach(r=>{const hh=JSON.stringify([r.topic,r.lesson,r.text]);if(r.h!==hh){r.h=hh;r.u=now}});
  const ph=JSON.stringify([S.stats,S.games,S.settings]);if(S.ph!==ph){S.ph=ph;S.pu=now}
}
const toWire=c=>({id:c.id,type:isG(c)?'g':'w',lesson:c.lesson,date:c.date,u:c.u,created:c.created||0,de:c.de||'',art:c.art||'',pl:c.pl||'',forms:c.forms||'',en:c.en||'',ex:c.ex||'',exEn:c.exEn||'',note:c.note||'',sentence:c.sentence||'',topic:c.topic||'',hint:c.hint||'',due:Math.round(c.srs.due),iv:c.srs.iv,ease:c.srs.ease,reps:c.srs.reps,lapses:c.srs.lapses,seen:c.srs.seen,ok:c.ok||0,bad:c.bad||0,susp:c.susp?1:0,bury:c.bury||0});
const fromWire=w=>{const c=mk({id:w.id,type:w.type,lesson:w.lesson,date:w.date,created:w.created,de:w.de,art:w.art,pl:w.pl,forms:w.forms,en:w.en,ex:w.ex,exEn:w.exEn,note:w.note,sentence:w.sentence,topic:w.topic,hint:w.hint,srs:{due:w.due,iv:w.iv,ease:w.ease,reps:w.reps,lapses:w.lapses,seen:w.seen},ok:w.ok,bad:w.bad,susp:!!w.susp,bury:w.bury,u:w.u});c.h=cardSig(c);c.su=w.u;return c};
async function api(method,path,body){
  const c=S.sync;let res;
  try{res=await fetch(c.url.replace(/\/+$/,'')+path,{method,headers:{'Authorization':'Bearer '+c.code,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
  catch(e){throw new Error('Cannot reach the server. Check the address and your connection.')}
  let j=null;try{j=await res.json()}catch(e){}
  if(!res.ok){const m=j&&j.error&&j.error.message;throw new Error(res.status===401?'Wrong access code':(m||'Server error '+res.status))}
  return j;
}
function applyServer(res,first){
  const tombs=new Set(S.tomb.map(t=>t.id));
  for(const w of res.cards||[]){
    if(tombs.has(w.id))continue;
    const loc=byId(w.id);
    if(!loc)S.cards.push(fromWire(w));
    else if(first){
      // first connection: keep whichever copy has more study progress, never wipe progress with a blank copy
      const mine=loc.srs.seen*1000+(loc.ok||0),theirs=(w.seen||0)*1000+(w.ok||0);
      if(mine>theirs){loc.h='';loc.u=0}else Object.assign(loc,fromWire(w));
    }
    else if(w.u>loc.u)Object.assign(loc,fromWire(w));
  }
  for(const w of res.rules||[]){
    if(tombs.has(w.id))continue;
    const loc=S.rules.find(r=>r.id===w.id);
    const n={id:w.id,idv:1,topic:w.topic,lesson:w.lesson,text:w.text,u:w.u,su:w.u,h:JSON.stringify([w.topic,w.lesson,w.text])};
    if(!loc)S.rules.push(n);else if(w.u>loc.u)Object.assign(loc,n);
  }
  for(const d of res.deleted||[]){if(d.k==='c')S.cards=S.cards.filter(c=>c.id!==d.id);else S.rules=S.rules.filter(r=>r.id!==d.id)}
  const p=res.profile;
  if(p&&p.u>(S.pu||0)&&p.data&&(!first||((p.data.stats||{}).xp||0)>=(S.stats.xp||0))){
    const mine=S.stats.days||{},theirs=(p.data.stats&&p.data.stats.days)||{},days=Object.assign({},theirs);
    for(const k in mine)days[k]={xp:Math.max((days[k]||{xp:0}).xp,mine[k].xp),n:Math.max((days[k]||{n:0}).n,mine[k].n||0)};
    const badges=Object.assign({},S.stats.badges,(p.data.stats||{}).badges);
    const keepBackup=S.stats.lastBackup;
    S.stats=Object.assign({},p.data.stats,{days,badges,lastBackup:keepBackup});
    S.games=p.data.games||S.games;
    S.settings=Object.assign({},S.settings,p.data.settings||{});
    S.ph=JSON.stringify([S.stats,S.games,S.settings]);S.pu=p.u;S.psu=p.u;
    applyTheme();
  }
}
async function syncNow(manual){
  const cfg=S.sync;
  if(!cfg||!cfg.url||!cfg.code){if(manual)toast('Add the server address and access code first');return false}
  if(syncing)return false;
  syncing=true;setSyncStatus('Syncing…');
  try{
    if(!cfg.pulled){
      const r0=await api('POST','/v1/sync',{since:0});
      applyServer(r0,true);
      cfg.pulled=Math.max(1,r0.serverTime-5000);
      cfg.pulled0=true;
    }
    stamp();
    const pend=[
      ...S.cards.filter(c=>c.u!==c.su).map(c=>({k:'c',w:toWire(c),ref:c})),
      ...S.rules.filter(r=>r.u!==r.su).map(r=>({k:'r',w:{id:r.id,topic:r.topic,lesson:r.lesson,text:r.text,u:r.u},ref:r})),
      ...S.tomb.map(t=>({k:'d',w:t,ref:t}))
    ];
    const pushProfile=(S.pu||0)!==(S.psu||0);
    const n=Math.max(1,Math.ceil(pend.length/30));
    let last=null;
    for(let i=0;i<n;i++){
      const chunk=pend.slice(i*30,i*30+30);
      last=await api('POST','/v1/sync',{since:cfg.pulled||0,cards:chunk.filter(x=>x.k==='c').map(x=>x.w),rules:chunk.filter(x=>x.k==='r').map(x=>x.w),deleted:chunk.filter(x=>x.k==='d').map(x=>({id:x.w.id,k:x.w.k,u:x.w.u})),profile:(i===0&&pushProfile)?{u:S.pu,data:{stats:S.stats,games:S.games,settings:S.settings}}:null});
      chunk.forEach(x=>{if(x.k==='c'||x.k==='r')x.ref.su=x.ref.u});
      S.tomb=S.tomb.filter(t=>!chunk.some(x=>x.ref===t));
      applyServer(last);
    }
    if(pushProfile)S.psu=S.pu;
    cfg.pulled=Math.max(0,last.serverTime-5000);
    cfg.lastAt=Date.now();save();asDirty=false;clearTimeout(asTimer);syncing=false;
    setSyncStatus('Synced '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
    if(manual||tab==='home'||tab==='library'||tab==='stats')render();
    return true;
  }catch(e){syncing=false;setSyncStatus('Sync failed: '+e.message);if(manual)toast(e.message);return false}
}

    const chs=[];
    for(let i=0;i<ws.length;i+=PATH_CH)chs.push(ws.slice(i,i+PATH_CH).map(c=>c.id));
    if(chs.length>1&&chs[chs.length-1].length<3){const t=chs.pop();chs[chs.length-1].push(...t)}

const pathNoun=c=>!!c.art&&/^[A-ZÄÖÜ][^\s.…]*$/.test(c.de.replace(/^(der|die|das)\s+/i,'').split('/')[0].trim());
function pathBuild(n){

  const items=[],spk=canSpeak(),enough=WALL().length>=4,L=n.lv;
  const A=(c,k)=>items.push({cid:c.id,kind:k});
  const nouns=ws.filter(pathNoun),pl=ws.filter(c=>pluralOf(c)),cl=ws.filter(c=>clozeOf(c)),sn=ws.filter(c=>sentenceOf(c)),sc=ws.filter(scrOK);
  if(L===1){

    shuffle(fresh).forEach(c=>A(c,'intro'));

    ws.forEach(c=>body.push({cid:c.id,kind:enough?'mc1':'tf'}));
    ws.forEach(c=>body.push({cid:c.id,kind:'tf'}));
    items.push(...pathSpread(body));
  }else if(L===2){
    const body=[];
    ws.forEach(c=>body.push({cid:c.id,kind:enough?'mc2':'tf'}));
    shuffle(ws).slice(0,5).forEach(c=>body.push({cid:c.id,kind:spk&&enough?'hear':'tf'}));
    shuffle(nouns).slice(0,4).forEach(c=>body.push({cid:c.id,kind:'art'}));
    items.push(...pathSpread(body));
  }else if(L===3){
    const body=[];
    if(ws.length>=4)body.push({kind:'dmatch',cids:shuffle(ws).slice(0,6).map(c=>c.id)});
    if(nouns.length>=3)body.push({kind:'sortart',cids:shuffle(nouns).slice(0,5).map(c=>c.id)});
    shuffle(pl).slice(0,3).forEach(c=>body.push({cid:c.id,kind:'plu'}));
    shuffle(cl).slice(0,3).forEach(c=>body.push({cid:c.id,kind:'cloze'}));
    shuffle(ws).slice(0,Math.max(3,8-body.length)).forEach(c=>body.push({cid:c.id,kind:enough?'mc2':'tf'}));
    items.push(...pathSpread(body));

    const body=[];
    shuffle(sn).slice(0,4).forEach(c=>body.push({cid:c.id,kind:'drag'}));
    shuffle(cl).slice(0,3).forEach(c=>body.push({cid:c.id,kind:'cloze'}));
    shuffle(sc).slice(0,3).forEach(c=>body.push({cid:c.id,kind:'scr'}));
    const have=new Set(body.map(b=>b.cid));
    shuffle(ws.filter(c=>!have.has(c.id))).slice(0,Math.max(3,8-body.length)).forEach(c=>body.push({cid:c.id,kind:'type'}));

    if(spk)shuffle(ws).slice(0,3).forEach(c=>body.push({cid:c.id,kind:'listen'}));
    shuffle(sn).slice(0,2).forEach(c=>body.push({cid:c.id,kind:'drag'}));
    shuffle(cl).slice(0,2).forEach(c=>body.push({cid:c.id,kind:'cloze'}));
    shuffle(nouns).slice(0,2).forEach(c=>body.push({cid:c.id,kind:'art'}));
    if(nouns.length>=3)body.push({kind:'sortart',cids:shuffle(nouns).slice(0,5).map(c=>c.id)});
    items.push(...pathSpread(body));

}
/* shuffle, but never the same word or the same exercise twice in a row if it can be avoided */
function pathSpread(a){
  const r=shuffle(a.slice());
  for(let i=1;i<r.length;i++){
    if(r[i].cid&&r[i].cid===r[i-1].cid||r[i].kind===r[i-1].kind&&r[i].kind!=='mc1'&&r[i].kind!=='mc2'){
      const j=r.findIndex((x,k)=>k>i&&x.cid!==r[i-1].cid&&x.kind!==r[i-1].kind);
      if(j>0){const t=r[i];r[i]=r[j];r[j]=t}
    }
  }
  return r;
}

/* one small drag-and-drop helper for touch and mouse: drag a .dg element onto a .dz zone, a plain tap calls onTap */
function dragKit(root,o){
  let cur=null;
  const zoneAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest('.dz'):null};
  const clearHi=()=>root.querySelectorAll('.dz.hi').forEach(z=>z.classList.remove('hi'));
  root.addEventListener('pointerdown',e=>{
    const el=e.target.closest('.dg');if(!el||el.classList.contains('lock')||!root.contains(el))return;
    cur={el,x:e.clientX,y:e.clientY,moved:false,ghost:null,id:e.pointerId};
    try{el.setPointerCapture(e.pointerId)}catch(_){}
  });
  root.addEventListener('pointermove',e=>{
    if(!cur||e.pointerId!==cur.id)return;
    const dx=e.clientX-cur.x,dy=e.clientY-cur.y;
    if(!cur.moved&&Math.hypot(dx,dy)>8){
      cur.moved=true;const r=cur.el.getBoundingClientRect();
      const g=cur.el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';
      document.body.appendChild(g);cur.ghost=g;cur.ox=cur.x-r.left;cur.oy=cur.y-r.top;cur.el.classList.add('lifted');
    }
    if(cur.moved){
      e.preventDefault();
      cur.ghost.style.transform=`translate(${e.clientX-cur.ox}px,${e.clientY-cur.oy}px)`;
      clearHi();const z=zoneAt(e.clientX,e.clientY);if(z)z.classList.add('hi');
    }
  });
  const end=e=>{
    if(!cur||e.pointerId!==cur.id)return;
    const c=cur;cur=null;clearHi();
    if(c.ghost)c.ghost.remove();c.el.classList.remove('lifted');
    if(c.moved){const z=zoneAt(e.clientX,e.clientY);o.onDrop(c.el,z,e.clientX,e.clientY)}
    else if(e.type==='pointerup')o.onTap&&o.onTap(c.el);
  };
  root.addEventListener('pointerup',end);root.addEventListener('pointercancel',end);
  root.addEventListener('contextmenu',e=>{if(e.target.closest('.dg'))e.preventDefault()});
}

const DUEL_N=9;
function buildDeck(game){
  const all=shuffle(WALL().slice()),out=[];

    for(const c of all){if(out.length>=DUEL_N)break;

  }else if(game==='dash'){
    for(const c of all.filter(c=>c.art)){if(out.length>=DUEL_N)break;out.push(dkMc(c.de,['der','die','das'],c.art,8,tx('Which article?','Welcher Artikel?')))}
  }else if(game==='plural'){
    for(const c of all.filter(pluralOf)){if(out.length>=DUEL_N)break;const r=pluralOf(c),w=pluralWrong(c,r,2);if(w.length<1)continue;out.push(dkMc(disDe(c),[r,...w],r,12,tx('Pick the plural: die …','Wähle den Plural: die …')))}
  }else if(game==='gap'){
    for(const c of shuffle(GALL().slice())){if(out.length>=DUEL_N)break;const m=(c.sentence||'').match(/\{\{(.+?)\}\}/);if(!m)continue;const ans=m[1],w=gDistract(c,ans,3);if(w.length<1)continue;
      out.push(dkMc(plain(c.sentence.replace(m[0],'____')),[ans,...w],ans,15,c.en))}
  }else if(game==='scramble'){
    for(const c of all.filter(scrOK)){if(out.length>=DUEL_N)break;const ch=[...c.de];let s=shuffle(ch.slice()),n=0;while(s.join('')===c.de&&n++<5)s=shuffle(ch.slice());

  }

}

/* playing a group round: same screen idea as a duel, against the group's endpoints */
async function gpPlay(rid){
  const run=++DL.run;
  GP.play={rid,i:0,deck:null,locked:false,typed:[],used:[],goals:0,n:9};
  gpEl().innerHTML=`<div class="dl-body"><p class="sub" style="text-align:center;margin-top:40vh">${tx('Loading…','Lädt…')}</p></div>`;
  try{
    await api('POST',`/v1/groups/${GP.id}/games/${rid}/start`);
    const j=await api('GET',`/v1/groups/${GP.id}/games/${rid}`);if(run!==DL.run)return;
    const r=j.round;if(!r.deck){await gpReload();return}
    GP.play.deck=r.deck;GP.play.i=r.mine?r.mine.count:0;GP.play.goals=r.mine?r.mine.goals:0;
    gpQuestion(run);
  }catch(e){toast(e.message);await gpReload()}
}
function gpQuestion(run){
  const P=GP.play;if(!P||run!==DL.run)return;
  const it=P.deck[P.i];if(!it){gpDone();return}
  P.locked=false;P.typed=[];P.used=[];
  const body=it.t==='mc'?`<div class="opts ${it.o.length===3&&it.o.join()==='der,die,das'?'art3':''}">${it.o.map((o,k)=>`<button class="opt ${/^(der|die|das)$/.test(o)?o:''}" data-a="gpick" data-i="${k}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`
    :`<div class="dl-build" id="dl-build"><em>${tx('Tap the letters','Tippe die Buchstaben')}</em></div><div class="dl-chars">${it.chars.map((c,k)=>`<button class="ch" data-a="gpchar" data-i="${k}">${esc(c)}</button>`).join('')}</div><div class="row2" style="margin-top:10px"><button class="btn sm ghost" data-a="gpback">⌫</button><button class="btn sm" data-a="gpsend">${tx('Check','Prüfen')}</button></div><div id="dl-ans" class="sub" style="text-align:center;margin-top:8px"></div>`;
  gpEl().innerHTML=`<div class="dl-top"><button class="tr-x" data-a="gpclose2" aria-label="Close">✕</button><div class="dl-t"><span>${esc(GP.g?GP.g.name:'')}</span><b>${tx('Goals','Tore')}: <span id="gp-g">${P.goals}</span></b></div></div>
  <div class="dl-body"><div class="dl-q">${P.i+1} / ${P.n}</div><div class="dl-tb"><i id="dl-tb"></i></div><p class="sub" style="text-align:center">${esc(it.hint||'')}</p><h2 class="q big" style="text-align:center">${esc(it.q)}</h2>${body}</div>`;
  const t0=Date.now(),lim=it.tm*1000;clearInterval(DL.timer);
  DL.timer=setInterval(()=>{if(run!==DL.run){clearInterval(DL.timer);return}const f=Math.max(0,1-(Date.now()-t0)/lim),b=$('#dl-tb');if(b)b.style.width=f*100+'%';if(f<=0){clearInterval(DL.timer);gpSend(null)}},100);
}
async function gpSend(v){
  const P=GP.play;if(!P||P.locked)return;P.locked=true;clearInterval(DL.timer);const run=DL.run,i=P.i,it=P.deck[i];
  let r;
  try{r=await api('POST',`/v1/groups/${GP.id}/games/${P.rid}/answer`,{i,v})}
  catch(e){if(run!==DL.run)return;toast(e.message);GP.play=null;await gpReload();return}
  if(run!==DL.run)return;
  P.goals=r.goals;const g=$('#gp-g');if(g)g.textContent=r.goals;
  if(it.t==='mc'){const k=it.o.indexOf(r.answer);document.querySelectorAll('#gp .opt').forEach((b,j)=>{if(j===k)b.classList.add('ok');else if(j===v&&!r.correct)b.classList.add('no')})}
  else{const a=$('#dl-ans');if(a)a.innerHTML=r.correct?`<b>✓ ${esc(r.answer)}</b>`:`<b style="color:var(--red)">✗ ${esc(r.answer)}</b>`}
  sfx(r.correct?'ok':'no');if(r.correct)vib(12);
  setTimeout(()=>{if(run!==DL.run)return;P.i++;if(P.i>=P.n){P.round=r.round;gpDone()}else gpQuestion(run)},900);
}
async function gpDone(){
  const P=GP.play;GP.play=null;clearInterval(DL.timer);
  addXP(10,0);save();
  await gpReload();soLoad(true);
  toast(tx('Round finished: ','Runde beendet: ')+(P?P.goals:'')+tx(' goals',' Tore'));
}

const ALERT_TXT={
  friend:a=>[tx('New friend','Neuer Freund'),tx(`${a.name} added you as a friend.`,`${a.name} hat dich als Freund hinzugefügt.`)],
  duel_invite:a=>[tx('Match request','Spielanfrage'),tx(`${a.name} challenges you: ${(GAMES[a.game]||{n:a.game}).n}.`,`${a.name} fordert dich heraus: ${(GAMES[a.game]||{n:a.game}).n}.`)],

};
let alBusy=false;
async function alPoll(){
  if(!soOK()||alBusy||document.hidden)return;
  alBusy=true;
  try{
    if(!S.alertsAt){S.alertsAt=Date.now();save()}
    const j=await api('GET','/v1/alerts?since='+Math.floor(S.alertsAt));
    let fresh=0;
    for(const a of (j.alerts||[]).slice().reverse()){
      const f=ALERT_TXT[a.type];if(!f)continue;const [t,b]=f(a);
      if(addNotice({id:'al:'+a.id+':'+a.ts,kind:'news',title:t,body:b,t:a.ts})){fresh++;if(fresh<=2)toast(t+': '+b)}
    }
    S.alertsAt=j.now||Date.now();save();
    if(fresh){if(tab==='friends')soLoad(true);if(tab==='home'||tab==='inbox')render()}
  }catch(e){}
  alBusy=false;
}
setInterval(alPoll,30000);setTimeout(alPoll,4000);

  gpdel:()=>gpConfirm(tx('Delete this group?','Gruppe löschen?'),tx('The table and all rounds are deleted for everybody.','Tabelle und alle Runden werden für alle gelöscht.'),tx('Delete','Löschen'),async()=>{await api('DELETE','/v1/groups/'+GP.id);gpClose()}),
  gpick:t=>{const P=GP.play;if(!P||P.locked)return;document.querySelectorAll('#gp .opt').forEach(b=>b.classList.remove('sel'));t.classList.add('sel');gpSend(+t.dataset.i)},
  gpchar:t=>{const P=GP.play;if(!P||P.locked||t.disabled)return;const i=+t.dataset.i;t.disabled=true;P.used.push(i);P.typed.push(P.deck[P.i].chars[i]);const b=$('#dl-build');if(b)b.textContent=P.typed.join('')},
  gpback:()=>{const P=GP.play;if(!P||P.locked||!P.used.length)return;const i=P.used.pop();P.typed.pop();const b=document.querySelector(`#gp .ch[data-i="${i}"]`);if(b)b.disabled=false;const e=$('#dl-build');if(e)e.textContent=P.typed.join('')||''},
  gpsend:()=>{const P=GP.play;if(P&&P.typed.length)gpSend(P.typed.join(''))},
  notify:t=>{S.settings.notify=t.dataset.v==='1';save();if(S.settings.notify)noteAsk();pushNotifyState();render()},
  notifystreak:t=>{S.settings.notifyStreak=t.dataset.v==='1';save();pushNotifyState();render()}
};

function leagueHtml(){
  const my={name:myName(),avatar:myAvatar(),points:LG.range==='week'?pointsSince(7):LG.range==='month'?pointsSince(30):S.stats.xp,streak:curStreak(),isMe:true};
  const online=LG.rows&&LG.rows.length,rows=online?LG.rows:[my];
  const body=rows.map((r,i)=>{const av=r.isMe?myAvatar():r.avatar,c=clubCol(av);return `<tr class="${r.isMe?'me':''}"><td class="n"><i class="stripe" style="background:${c}"></i>${i+1}</td><td class="tm"><div class="tmi">${badgeSvg(av,22)}<span>${esc(r.isMe?myName():r.name)}</span></div></td><td class="pts">${r.points}</td><td>${r.streak||0}</td></tr>`}).join('');
  return `<div class="seg" style="margin-bottom:10px">${[['week','Woche'],['month','Monat'],['all','Gesamt']].map(([k,n])=>`<button class="${LG.range===k?'on':''}" data-a="lrange" data-k="${k}">${n}</button>`).join('')}</div>
  <div class="card patch" style="padding:8px 10px 14px 14px"><table class="tbl bl"><thead><tr><th class="n">#</th><th>${tx('Player','Spieler')}</th><th class="pts">${tx('Pts','Pkt')}</th><th>${tx('Streak','Serie')}</th></tr></thead><tbody>${body}</tbody></table>
  <p class="sub" style="font-size:13px;margin-top:8px">${online?tx('Live standings. Everyone with an account is in the table.','Live-Tabelle. Alle mit einem Konto sind dabei.'):(S.sync&&S.sync.url?(LG.err?esc(LG.err):tx('Loading standings…','Tabelle lädt…')):tx('Connect your server in Settings to compete with friends.','Verbinde deinen Server in den Einstellungen, um mit Freunden zu spielen.'))}</p></div>`;
}

document.addEventListener('click',e=>{
  const uk=e.target.closest('.uk');
  if(uk){const i=$('#ans');if(i&&!i.disabled){const s=i.selectionStart==null?i.value.length:i.selectionStart,en=i.selectionEnd==null?s:i.selectionEnd;i.value=i.value.slice(0,s)+uk.dataset.ch+i.value.slice(en);i.setSelectionRange(s+1,s+1);i.dispatchEvent(new Event('input'));i.focus()}return}
  const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t,e);
});
document.addEventListener('pointerdown',e=>{if(e.target.closest('.uk'))e.preventDefault()});

document.addEventListener('change',e=>{if(e.target.id==='arcl'){arc.lesson=e.target.value;render()}});
document.addEventListener('keydown',e=>{
  if(!ses||$('#sheet'))return;
  const inField=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(!inField&&/^[1-4]$/.test(e.key)&&!ses.locked){const o=document.querySelectorAll('#sMain .opt')[+e.key-1];if(o){o.click();return}}
  if(!inField&&e.key==='Enter'&&!ses.rush){const b=$('#cont')||$('#chk:not([disabled])')||$('#got')||$('#show');if(b)b.click()}
  if(e.key==='Escape')quit();
});
