<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>Kobel · Deutsch Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D20515;--red-d:#9E030F;
  --bg:#0B0B0B;--bg2:#141414;--surf:#1A1A1A;--surf2:#262626;--ink:#FFFFFF;--inv:#0B0B0B;--mute:#9C9C9C;--line:rgba(255,255,255,.14);--stitch:rgba(255,255,255,.2);
  --lantern:#D20515;--lantern-d:#FF4152;--fern:#FFFFFF;--fern-d:#FFFFFF;--berry:#7B7B7B;--berry-d:#E23544;--sky:#C9C9C9;--sky-d:#BDBDBD;--lilac:#3A3A3A;--lilac-d:#8A8A8A;
  --on:#FFFFFF;--goodtxt:#FFFFFF;--badtxt:#FF5766;--neartxt:#D8D8D8;--shadow:rgba(0,0,0,.5);
  --fd:'Barlow Condensed','Roboto Condensed','sans-serif-condensed','Arial Narrow','Oswald',Impact,sans-serif;
  --fb:'Barlow','Roboto','Segoe UI',system-ui,-apple-system,sans-serif;--cut:14px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EDEDED;--bg2:#FFFFFF;--surf:#FFFFFF;--surf2:#E4E4E4;--ink:#0B0B0B;--inv:#FFFFFF;--mute:#666;--line:rgba(0,0,0,.14);--stitch:rgba(0,0,0,.2);
    --fern:#0B0B0B;--fern-d:#0B0B0B;--lantern-d:#D20515;--berry-d:#D20515;--sky:#D6D6D6;--sky-d:#8A8A8A;--lilac:#2B2B2B;
    --goodtxt:#0B0B0B;--badtxt:#D20515;--neartxt:#444;--shadow:rgba(0,0,0,.18);
  }
}
:root[data-theme="light"]{
  --bg:#EDEDED;--bg2:#FFFFFF;--surf:#FFFFFF;--surf2:#E4E4E4;--ink:#0B0B0B;--inv:#FFFFFF;--mute:#666;--line:rgba(0,0,0,.14);--stitch:rgba(0,0,0,.2);
  --fern:#0B0B0B;--fern-d:#0B0B0B;--lantern-d:#D20515;--berry-d:#D20515;--sky:#D6D6D6;--sky-d:#8A8A8A;--lilac:#2B2B2B;
  --goodtxt:#0B0B0B;--badtxt:#D20515;--neartxt:#444;--shadow:rgba(0,0,0,.18);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--fb);overflow-x:hidden;
  background-image:repeating-linear-gradient(115deg,transparent 0 46px,rgba(128,128,128,.045) 46px 48px);background-attachment:fixed}
h1,h2,h3{font-family:var(--fd);font-weight:800;margin:0;text-transform:uppercase;letter-spacing:.3px;line-height:1.02}
button{font-family:inherit;color:inherit}
.app{max-width:540px;margin:0 auto;padding:10px 16px 120px;position:relative;z-index:1}
.view>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateX(-22px) skewX(-3deg)}to{opacity:1;transform:none}}
.ffs{display:none}

/* broadcast surfaces */
.patch{position:relative;background:var(--pc,var(--surf));color:var(--pt,var(--ink));clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.patch::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red);pointer-events:none}
.patch::after{display:none}
[class*="c-"]{--pt:#fff}
.c-lantern{--pc:var(--red)}.c-lantern::before{background:#fff}
.c-fern{--pc:var(--ink);--pt:var(--inv)}.c-fern::before{background:var(--red)}
.c-berry{--pc:var(--red-d)}.c-berry::before{background:#fff}
.c-sky{--pc:#D4D4D4;--pt:#0B0B0B}.c-sky::before{background:var(--red)}
.c-lilac{--pc:#2D2D2D;--pt:#fff}
.card{padding:16px 16px 18px 20px;margin-bottom:12px}
.sub{color:var(--mute);margin:0;font-weight:500}
[class*="c-"] .sub{color:inherit;opacity:.78}
.kick{font:800 13px var(--fd);letter-spacing:1.6px;text-transform:uppercase;color:var(--lantern-d)}
[class*="c-"] .kick{color:inherit;opacity:.85}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;gap:10px}
.logo{display:flex;align-items:center;gap:9px;color:var(--ink)}
.logo .mk{width:34px;height:34px;background:var(--red);clip-path:polygon(22% 0,100% 0,78% 100%,0 100%);display:grid;place-items:center;color:#fff;font:800 22px var(--fd)}
.logo b{font:800 30px/1 var(--fd);letter-spacing:1px;text-transform:uppercase;display:block}
.logo small{font:700 11px var(--fd);letter-spacing:2px;color:var(--mute);display:block;text-transform:uppercase;margin-top:1px}
.h1{font-size:38px;padding-left:12px;position:relative}
.h1::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:5px;background:var(--red);transform:skewX(-14deg)}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:var(--surf);padding:5px 12px 5px 10px;font:800 18px var(--fd);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.iconbtn{width:40px;height:40px;border:0;background:var(--surf);display:grid;place-items:center;cursor:pointer;color:var(--ink);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:background .2s,transform .15s}
.iconbtn:active{background:var(--red);transform:scale(.92)}
.iconbtn svg{width:20px;height:20px}
.flame{display:inline-block;color:var(--lantern-d);animation:flame 1.5s ease-in-out infinite;transform-origin:50% 90%}
.flame svg,.ai svg{width:100%;height:100%;display:block}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.16) rotate(4deg)}}
.ai{width:16px;height:16px;display:inline-block;vertical-align:-3px;color:var(--lantern-d)}

/* hero scoreboard */
.hero{position:relative;overflow:hidden;background:#0B0B0B;color:#fff;margin-bottom:14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.hero .bg{position:absolute;inset:0;pointer-events:none}
.hero .bg svg{width:100%;height:100%;display:block}
.hero .stripe{animation:slide 12s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.hero-in{position:relative;padding:16px 18px 18px 22px}
.hero .live{display:inline-flex;align-items:center;gap:7px;background:var(--red);padding:3px 12px 3px 9px;font:800 13px var(--fd);letter-spacing:1.5px;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.hero .live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.hero h2{font-size:56px;margin:8px 0 2px;letter-spacing:.5px;text-shadow:3px 3px 0 var(--red)}
.hero p{margin:0;color:#cfcfcf;font-weight:600}
.hero .score{display:flex;align-items:stretch;margin:14px 0 14px}
.hero .score>div{flex:1;background:rgba(255,255,255,.08);padding:8px 10px;text-align:center;border-left:2px solid var(--red)}
.hero .score b{display:block;font:800 34px/1 var(--fd)}.hero .score span{font:700 11px var(--fd);letter-spacing:1.4px;text-transform:uppercase;color:#bdbdbd}
.hero .score>div:nth-child(2){margin:0 3px}
.sec{margin:26px 2px 10px;font-size:25px;display:flex;align-items:center;gap:10px}
.sec::after{content:'';flex:1;height:3px;background:linear-gradient(90deg,var(--red) 0 36px,var(--line) 36px);transform:skewX(-30deg)}
.bar{height:8px;background:var(--line);overflow:hidden;display:flex;margin-top:7px;transform:skewX(-20deg)}
.bar i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.stg-i{display:inline-block;flex:none}.stg-i svg{width:100%;height:100%;display:block}

/* widgets */
.wg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.w1{padding:14px 14px 16px 18px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;cursor:default}
.w1.full{grid-column:1/-1;min-height:0}
.w1 .big{font:800 48px/.95 var(--fd)}
.w1 .lab{font:800 12px var(--fd);letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
[class*="c-"].w1 .lab{color:inherit;opacity:.8}
.wk{display:flex;gap:5px;margin-top:8px}
.wk div{flex:1;text-align:center;font:800 11px var(--fd);color:var(--mute)}
.wk i{display:grid;place-items:center;height:22px;margin-top:3px;background:var(--surf2);clip-path:polygon(20% 0,100% 0,80% 100%,0 100%);font-style:normal;font-size:12px;color:#fff}
.wk .d i{background:var(--red)}.wk .t i{outline:0;box-shadow:inset 0 -3px 0 var(--ink)}
.wring{position:relative;width:78px;height:78px;margin:2px auto 0}
.wring svg{width:100%;height:100%}.wring b{position:absolute;inset:0;display:grid;place-items:center;font:800 22px var(--fd)}
.tier-bar{position:relative;height:12px;background:rgba(255,255,255,.22);margin-top:8px;transform:skewX(-20deg);overflow:hidden}
.tier-bar i{position:absolute;left:0;top:0;bottom:0;background:#fff;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.quest{display:flex;gap:10px;align-items:center;margin:10px 0}
.quest .qi{width:26px;height:26px;display:grid;place-items:center;background:var(--surf2);font:800 14px var(--fd);flex:none;clip-path:polygon(20% 0,100% 0,80% 100%,0 100%)}
.quest.done .qi{background:var(--red);color:#fff}
.quest .qt{flex:1;min-width:0;font-weight:700;font-size:15px}
.quest .bar{height:6px;margin-top:5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;padding:14px 14px 16px 18px;cursor:pointer;font:600 14px var(--fb);transition:transform .15s cubic-bezier(.3,1.6,.5,1),filter .2s}
.tile:active{transform:scale(.96);filter:brightness(1.15)}
.tile b{display:block;font:800 26px var(--fd);text-transform:uppercase;margin:4px 0 0}
.tile svg{width:26px;height:26px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:12px 14px 14px 20px;cursor:pointer;border:0;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.lrow:active{transform:scale(.975)}
.lrow .meta{flex:1;min-width:0}
.lrow .nm{font:800 20px var(--fd);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.off{opacity:.45}
.nbadge{background:var(--red);color:#fff;padding:1px 9px;font:800 12px var(--fd);letter-spacing:.8px;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%);display:inline-block}
.nbadge.alt{background:var(--ink);color:var(--inv)}
.wod .w{font:800 36px var(--fd)}

/* buttons */
.btn{position:relative;border:0;padding:14px 20px;font:800 19px var(--fd);letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:var(--pc,var(--red));transition:transform .14s cubic-bezier(.3,1.6,.5,1),filter .15s;cursor:pointer;width:100%;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28)}
.btn.c-fern,.btn.c-sky{color:var(--pt)}
.btn::before{display:none}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.btn:not([disabled]):hover::after,.btn.shine::after{animation:shine .9s}
@keyframes shine{to{transform:translateX(120%)}}
.btn:active:not([disabled]){transform:translateY(3px) scale(.985);filter:brightness(1.12)}
.btn[disabled]{background:var(--surf2);color:var(--mute);box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);padding:12px 16px;clip-path:none}
.btn.ghost::after{display:none}
.btn.sm{width:auto;padding:9px 14px;font-size:16px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0B0B0B;border-top:3px solid var(--red);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;width:100%;max-width:540px;margin:0 auto}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 7px;color:#8f8f8f;font:800 13px var(--fd);letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;position:relative;transition:color .2s}
.tab svg{width:23px;height:23px;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.tab::before{content:'';position:absolute;left:18%;right:18%;top:-3px;height:3px;background:#fff;transform:scaleX(0);transition:transform .25s}
.tab.on{color:#fff}.tab.on svg{transform:translateY(-2px) scale(1.12);color:var(--lantern-d)}.tab.on::before{transform:scaleX(1)}

/* inputs */
.inp{width:100%;border:0;border-bottom:3px solid var(--line);background:var(--surf);color:var(--ink);padding:13px 14px;font:600 18px var(--fb);outline:none;transition:border-color .2s,background .2s;border-radius:0}
.inp:focus{border-color:var(--red);background:var(--surf2)}
select.inp{appearance:none}
textarea.inp{font-size:15px;min-height:160px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;scrollbar-width:none}.fchips::-webkit-scrollbar{display:none}
.fc{flex:none;border:0;background:var(--surf);padding:7px 16px;font:800 15px var(--fd);letter-spacing:.8px;text-transform:uppercase;cursor:pointer;color:var(--ink);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:background .2s}
.fc.on{background:var(--red);color:#fff}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surf);border:0;padding:11px 14px 11px 16px;margin-bottom:6px;cursor:pointer;position:relative;transition:transform .12s}
.crow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line);transition:background .2s}
.crow:active{transform:scale(.985)}.crow:active::before{background:var(--red)}
.crow .t{font:800 20px var(--fd);text-transform:none;letter-spacing:.2px}.crow .s{font-size:14px;color:var(--mute)}
.crow .l{margin-left:auto;font:700 12px var(--fd);letter-spacing:.8px;text-transform:uppercase;color:var(--mute);background:var(--surf2);padding:2px 9px;white-space:nowrap;max-width:32%;overflow:hidden;text-overflow:ellipsis}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));height:54px;padding:0 24px 0 20px;border:0;background:var(--red);color:#fff;font:800 19px var(--fd);letter-spacing:1px;text-transform:uppercase;z-index:15;cursor:pointer;display:flex;align-items:center;gap:8px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
.fab:active{transform:translateY(3px)}
.art{font-weight:800}.art.der{color:var(--ink)}.art.die{color:var(--lantern-d)}.art.das{color:var(--sky-d)}
[class*="c-"] .art{color:inherit;text-decoration:underline}

/* sheet */
.sheetw{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheetw .bk{position:absolute;inset:0;background:rgba(0,0,0,.72);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:540px;max-height:90%;overflow:auto;background:var(--bg);border-top:4px solid var(--red);padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:sheetup .34s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h3{font-size:30px;margin-bottom:8px}
.sheet label{display:block;font:800 13px var(--fd);letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin:12px 2px 4px}
details{margin:10px 0;color:var(--mute);font-size:14px}
details pre{white-space:pre-wrap;background:var(--surf);padding:12px;font-size:13px;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace}

/* training list */
.glist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.gc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px 14px 20px;border:0;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.gc:active{transform:scale(.975)}
.gc[data-lock]{opacity:.5;filter:grayscale(1)}
.gi{width:52px;height:52px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.gi svg{width:28px;height:28px}
.gc:nth-child(odd) .gi{background:var(--ink);color:var(--inv)}
.gm{flex:1;min-width:0}.gn{font:800 24px var(--fd);text-transform:uppercase;letter-spacing:.4px}.gt{font-size:14px;line-height:1.25;color:var(--mute)}
.gs{text-align:right;flex:none;font:800 14px var(--fd);letter-spacing:.8px;text-transform:uppercase}
.x2{background:var(--red);color:#fff;padding:0 7px;font:800 13px var(--fd);vertical-align:3px;margin-left:4px;clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.stars{display:inline-flex;gap:1px;font-size:17px}
.stars .on{color:var(--lantern-d)}.stars .off{opacity:.25}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.sb{background:var(--surf);padding:10px 4px;text-align:center;border-top:3px solid var(--red)}
.sb b{display:block;font:800 26px var(--fd)}.sb span{font:700 11px var(--fd);letter-spacing:1.2px;text-transform:uppercase;color:var(--mute)}
.spark{width:100%;height:54px;display:block}

/* stats */
.stg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font:800 40px var(--fd);line-height:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;background:var(--line);display:block}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{text-align:center;padding:12px 4px;background:var(--surf);font:700 13px/1.1 var(--fd);letter-spacing:.8px;text-transform:uppercase;border-bottom:3px solid var(--red)}
.bdg .e{display:grid;place-items:center;width:44px;height:36px;margin:0 auto 6px;background:var(--red);color:#fff;font:800 20px var(--fd);clip-path:polygon(16% 0,100% 0,84% 100%,0 100%);letter-spacing:0}
.bdg.lock{opacity:.4;filter:grayscale(1);border-bottom-color:var(--line)}
.fc7{display:flex;align-items:flex-end;gap:8px;height:100px}
.fc7 div{flex:1;text-align:center;font:700 12px var(--fd);color:var(--mute)}
.fc7 b{display:block;background:var(--red);min-height:4px;margin-bottom:4px;transition:height .8s;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.stage4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stage4 b{display:block;font:800 30px var(--fd)}.stage4 span{font:700 11px var(--fd);letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.stage4 .stg-i{margin-bottom:2px}

/* league table */
.tbl{width:100%;border-collapse:collapse;font:700 16px var(--fb)}
.tbl th{font:800 12px var(--fd);letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 6px;border-bottom:3px solid var(--red)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}.tbl .n{width:34px;font:800 20px var(--fd);text-align:center}
.tbl tr.me td{background:rgba(210,5,21,.16)}.tbl tr.me .n{color:var(--lantern-d)}
.tbl tr.up .n::after{content:'';display:block;height:3px;width:14px;margin:2px auto 0;background:var(--red)}
.zone{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:var(--surf);margin-bottom:6px;position:relative}
.zone::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.zone.cur{background:var(--red);color:#fff}.zone.cur::before{background:#fff}
.zone.done::before{background:var(--ink)}
.zone .nm{font:800 20px var(--fd);text-transform:uppercase;flex:1;letter-spacing:.4px}.zone .lv{font:800 13px var(--fd);letter-spacing:1px;opacity:.75}

/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.seg{display:flex;gap:4px}
.seg button{border:0;background:var(--surf2);padding:7px 12px;font:800 15px var(--fd);letter-spacing:.6px;text-transform:uppercase;cursor:pointer;color:var(--ink);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.seg button.on{background:var(--red);color:#fff}
.sw{width:54px;height:30px;border:0;background:var(--surf2);position:relative;cursor:pointer;transition:background .2s;flex:none;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.sw::after{content:'';position:absolute;top:4px;left:8px;width:22px;height:22px;background:#fff;transition:transform .3s cubic-bezier(.3,1.6,.5,1);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.sw.on{background:var(--red)}.sw.on::after{transform:translateX(14px)}

/* scope sheet */
.scrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surf);padding:12px 14px 12px 18px;margin-bottom:6px;cursor:pointer;text-align:left;position:relative;transition:background .2s}
.scrow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line);transition:background .2s}
.scrow.on::before{background:var(--red)}
.scrow .ck{width:26px;height:26px;border:2px solid var(--mute);display:grid;place-items:center;flex:none;font:800 16px var(--fd);color:transparent;clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);transition:all .2s}
.scrow.on .ck{background:var(--red);border-color:var(--red);color:#fff}
.scrow .nm{font:800 19px var(--fd);text-transform:uppercase;flex:1;min-width:0}
.scrow .ct{font:700 13px var(--fd);letter-spacing:.8px;color:var(--mute);text-transform:uppercase}
.scopebtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:var(--surf);padding:11px 14px 11px 18px;cursor:pointer;text-align:left;position:relative;margin:10px 0}
.scopebtn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}
.scopebtn b{font:800 19px var(--fd);text-transform:uppercase;letter-spacing:.4px}

/* session */
.ses{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:sesin .4s cubic-bezier(.2,.9,.3,1);padding-top:env(safe-area-inset-top,0px)}
@keyframes sesin{from{clip-path:polygon(0 0,0 0,-20% 100%,-20% 100%)}to{clip-path:polygon(0 0,130% 0,110% 100%,-20% 100%)}}
.ses-top{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;margin:0 auto;background:#0B0B0B;color:#fff;border-bottom:3px solid var(--red)}
.ses-top>*{max-width:none}
.x{border:0;background:none;font-size:22px;color:#bbb;cursor:pointer;padding:0 4px;line-height:1}
.track{flex:1;height:14px;background:#2c2c2c;position:relative;transform:skewX(-20deg)}
.track i{display:block;height:100%;width:0;background:var(--red);transition:width .5s cubic-bezier(.2,.9,.3,1);position:relative}
.track i::after{content:'';position:absolute;right:0;top:0;bottom:0;width:10px;background:#fff}
.track.warn i{background:#fff}.track.warn i::after{background:var(--red)}
.combo{font:800 20px var(--fd);color:#fff;min-width:58px;text-align:right;letter-spacing:.5px}
.combo.pulse{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.35);color:var(--lantern-d)}}
.sMain{flex:1;overflow:auto;padding:14px 20px 20px;max-width:600px;width:100%;margin:0 auto;position:relative}
.sMain>*{animation:qin .3s cubic-bezier(.2,.9,.3,1) both}
.rush .sMain>*{animation-duration:.14s}
@keyframes qin{from{opacity:0;transform:translateX(34px) skewX(-4deg)}to{opacity:1;transform:none}}
.tag{display:inline-block;background:var(--red);color:#fff;font:800 15px var(--fd);letter-spacing:1.4px;text-transform:uppercase;padding:3px 16px 3px 12px;margin-bottom:12px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.tag.t-fern,.tag.t-sky{background:var(--ink);color:var(--inv)}
.tag.t-berry,.tag.t-lilac{background:#3A3A3A;color:#fff}
.q{font-size:38px;line-height:1.05;margin-bottom:6px;text-transform:none;letter-spacing:.2px}
.q.big{font-size:52px;text-align:center;margin:20px 0 6px}
.spk{border:0;background:var(--ink);color:var(--inv);width:42px;height:42px;font-size:18px;cursor:pointer;flex:none;vertical-align:middle;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);display:inline-grid;place-items:center}
.spk svg{width:20px;height:20px}
.spk:active{background:var(--red);color:#fff}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border:0;background:var(--surf);font:600 19px var(--fb);color:var(--ink);cursor:pointer;position:relative;transition:transform .1s,background .15s;animation:pop .34s cubic-bezier(.3,1.5,.5,1) both;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
.opt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line);transition:background .15s}
.opt:nth-child(2){animation-delay:.04s}.opt:nth-child(3){animation-delay:.08s}.opt:nth-child(4){animation-delay:.12s}
@keyframes pop{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.opt .k{width:28px;height:26px;background:var(--surf2);display:grid;place-items:center;font:800 15px var(--fd);color:var(--mute);flex:none;clip-path:polygon(20% 0,100% 0,80% 100%,0 100%)}
.opt:active:not(:disabled){transform:translateX(4px)}
.opt.sel{background:var(--surf2)}.opt.sel::before{background:var(--ink)}
.opt.ok{background:var(--ink);color:var(--inv)}.opt.ok::before{background:var(--red)}.opt.ok .k{background:var(--inv);color:var(--ink)}
.opt.no{background:var(--red);color:#fff;animation:shake .4s}.opt.no::before{background:#fff}.opt.no .k{background:#fff;color:var(--red)}
.opts.art3{flex-direction:row}
.opts.art3 .opt{justify-content:center;font:800 36px var(--fd);padding:22px 0;text-transform:uppercase}
.opts.art3 .opt .k{display:none}
.opt.der{--ac:var(--ink)}.opt.die{--ac:var(--lantern-d)}.opt.das{--ac:var(--sky-d)}
.opts.art3 .opt{color:var(--ac)}.opts.art3 .opt.sel{background:var(--surf2)}.opts.art3 .opt.sel::before{background:var(--ac)}
.opts.art3 .opt.ok,.opts.art3 .opt.no{color:inherit}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.blank{display:inline-block;min-width:90px;border-bottom:5px solid var(--red);text-align:center;color:var(--lantern-d);font-weight:800;padding:0 6px}
.blank.filled{animation:pop .3s}
.uml{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.uk{border:0;background:var(--surf);width:44px;height:42px;font:800 22px var(--fd);cursor:pointer;color:var(--ink);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.uk:active{background:var(--red);color:#fff}
.ansline{min-height:64px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin:18px 0 14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.wt{border:0;background:var(--surf);padding:9px 16px;font:800 24px var(--fd);cursor:pointer;color:var(--ink);animation:pop .22s both;min-width:42px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:background .15s}
.wt:active{background:var(--red);color:#fff}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mcols .col{display:flex;flex-direction:column;gap:9px}
.mt{border:0;background:var(--surf);padding:14px 10px;font:700 16px var(--fb);cursor:pointer;color:var(--ink);min-height:58px;position:relative;transition:background .15s}
.mt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.mt.sel{background:var(--surf2)}.mt.sel::before{background:var(--red)}
.mt.done{background:var(--ink);color:var(--inv);opacity:.4;pointer-events:none;transition:opacity .6s}
.mt.no{animation:shake .4s;background:var(--red);color:#fff}
.flipw{perspective:1200px;margin-top:8px}
.flipin{position:relative;height:310px;transition:transform .6s cubic-bezier(.3,1.25,.4,1);transform-style:preserve-3d;cursor:pointer}
.flipin.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:8px;border-top:5px solid var(--red);clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.face.back{transform:rotateY(180deg);background:var(--red);color:#fff;border-top-color:#fff}
.face .w{font:800 46px/1.05 var(--fd)}.face .hint{color:var(--mute);font-size:14px;font-weight:600}
.face.back .hint,.face.back .sub{color:rgba(255,255,255,.85)}
.intro{background:var(--surf);padding:20px 18px 22px;text-align:center;margin-top:6px;position:relative;border-top:5px solid var(--red);clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.intro .badge{display:flex;justify-content:center;margin-bottom:4px}
.intro .w{font:800 54px/1.02 var(--fd);margin:4px 0}
.intro .forms{color:var(--mute);font-size:15px;margin-top:2px}
.intro .ex{margin-top:14px;padding:12px;background:var(--surf2);text-align:left;border-left:4px solid var(--red)}
.intro mark,.ex b{background:none;color:var(--lantern-d);font-weight:800}
.foot{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));transition:background .25s;border-top:1px solid var(--line)}
.foot .in{max-width:600px;margin:0 auto}
.foot.good{background:#0B0B0B;color:#fff;--fc:#fff;border-top:4px solid #fff}
.foot.near{background:var(--surf2);--fc:var(--ink);border-top:4px solid var(--sky-d)}
.foot.bad{background:var(--red-d);color:#fff;--fc:#fff;border-top:4px solid var(--red)}
.foot.fb .in{animation:sheetup .3s cubic-bezier(.2,.9,.3,1)}
.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;color:var(--fc)}
.fb .h{font:800 30px var(--fd);text-transform:uppercase}.fb .b{font-size:16px;color:inherit}.fb .b b{color:inherit;text-decoration:underline}.fb .grow{flex:1}
.fb .mk{flex:none;margin-top:-2px;animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
.foot.good .btn,.foot.bad .btn{--pc:#fff;color:#0B0B0B}
.foot.good .spk,.foot.bad .spk{background:#fff;color:#0B0B0B}
@keyframes hop{from{transform:translateY(24px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.rushh{display:flex;justify-content:space-between;align-items:center;margin:2px 0 0}
.rushh .sc{font:800 14px var(--fd);letter-spacing:1.4px;text-transform:uppercase;color:var(--mute)}.rushh .sc b{color:var(--ink);font-size:28px}
.xpf{position:fixed;left:50%;top:36%;font:800 40px var(--fd);color:var(--lantern-d);pointer-events:none;animation:xpf 1s ease-out forwards;z-index:70;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
@keyframes xpf{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-90px) scale(1.3)}}
.fin{padding:6px 0;text-align:center}
.fin h1{font-size:52px;margin:6px 0;text-shadow:3px 3px 0 var(--red)}
.fin .mk{display:flex;justify-content:center}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.sg{padding:12px 6px 14px;text-align:center}
.sg::before{display:none}
.sg b{display:block;font:800 38px/1 var(--fd)}.sg span{font:800 12px var(--fd);letter-spacing:1.4px;text-transform:uppercase;opacity:.85}
.bigstars{font-size:44px;letter-spacing:4px;margin:4px 0;color:var(--lantern-d)}
.bigstars span{display:inline-block;animation:starin .6s cubic-bezier(.3,1.8,.5,1) both}
.bigstars .off{opacity:.2;filter:grayscale(1)}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.note-card{display:flex;gap:12px;align-items:center;margin-bottom:8px;padding:12px 14px 14px 20px;text-align:left}
.note-card .nc{width:36px;height:32px;background:var(--red);color:#fff;display:grid;place-items:center;font:800 18px var(--fd);flex:none;clip-path:polygon(16% 0,100% 0,84% 100%,0 100%)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:99}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0B0B0B;color:#fff;border-left:5px solid var(--red);padding:10px 18px;font:700 16px var(--fb);z-index:120;animation:toast 2.6s forwards;max-width:90%;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,14px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}

/* broadcast wipe */
.wipe{position:fixed;top:0;bottom:0;left:-40%;width:60%;z-index:150;pointer-events:none;background:var(--red);transform:skewX(-20deg) translateX(-100%);animation:wipe .52s cubic-bezier(.7,0,.3,1) forwards}
.wipe::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:14%;background:#fff}
.wipe::before{content:'';position:absolute;top:0;bottom:0;right:100%;width:10%;background:#0B0B0B}
@keyframes wipe{to{transform:skewX(-20deg) translateX(330%)}}
.upd{display:flex;gap:10px;align-items:center}
.upd .bar{flex:1;height:10px;margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.tiles>*,.wg>*,.row2>*{min-width:0}
.tile b{font-size:22px;overflow-wrap:anywhere}
html,body{max-width:100vw;overflow-x:hidden}
.intro .w,.face .w{font-size:clamp(30px,10.2vw,54px);overflow-wrap:anywhere}
.q.big{font-size:clamp(32px,11vw,52px);overflow-wrap:anywhere}
.q{overflow-wrap:anywhere}
.bdg{font-size:12px;overflow-wrap:anywhere;hyphens:auto}

/* league / form / cabinet */
.form{display:inline-flex;gap:4px}
.fm{display:inline-grid;place-items:center;width:24px;height:22px;font:800 13px var(--fd);background:var(--surf2);color:var(--ink);clip-path:polygon(22% 0,100% 0,78% 100%,0 100%)}
.fm.f-W{background:var(--ink);color:var(--inv)}.fm.f-D{background:#6b6b6b;color:#fff}.fm.f-L{background:var(--red);color:#fff}.fm.f-X{background:var(--red-d);color:#fff}.fm.f-E{opacity:.4}
[class*="c-"] .fm.f-W{background:#fff;color:#0B0B0B}
.mdbars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.mdbars .lab{margin-bottom:2px}
.cabinet{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.troph{background:var(--surf);padding:12px 8px 14px;text-align:center;border-bottom:4px solid var(--red);animation:rise .4s both}
.troph .tsv{display:grid;place-items:center;height:76px}
.troph b{display:block;font:800 18px/1.05 var(--fd);text-transform:uppercase;margin-top:6px}
.troph span{font:600 12px var(--fb);color:var(--mute)}
.troph.gold{border-bottom-color:#D9A71E}.troph.silver{border-bottom-color:#AEB3BA}.troph.bronze{border-bottom-color:#B06A34}
.troph.ghost{opacity:.35;filter:grayscale(1);border-bottom-color:var(--line)}
.sb .sbs{display:block;font:500 10px var(--fb);color:var(--mute);font-style:normal;margin-top:2px;letter-spacing:.2px}
.tbl .lt{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.dim{opacity:.45}
.note-card svg{flex:none}

/* ───────── v2.10 welcome + about ───────── */
#welcome{position:fixed;inset:0;z-index:100;background:#0B0B0B;color:#fff;transition:opacity .4s,transform .4s;overflow:hidden}
#welcome.out{opacity:0;transform:scale(1.04);pointer-events:none}
.wl-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wl-in{position:relative;height:100%;max-width:540px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between}
.wl-lang{display:flex;gap:8px;justify-content:flex-end}
.wl-lang button{border:0;background:rgba(255,255,255,.12);color:#fff;padding:7px 14px;font:800 15px var(--fd);letter-spacing:.8px;text-transform:uppercase;cursor:pointer}
.wl-lang button.on{background:var(--red)}
.wl-mid{text-align:center}
.wl-mk{display:inline-grid;place-items:center;width:96px;height:96px;background:var(--red);color:#fff;font:800 64px var(--fd);clip-path:polygon(22% 0,100% 0,78% 100%,0 100%)}
.wl-logo{width:120px;height:120px;object-fit:contain}
.wl-mid h1{font-size:72px;margin:14px 0 6px}.wl-sub{color:rgba(255,255,255,.75);font-size:18px;margin:0}
.ab{margin-bottom:12px}.ab h3{font-size:24px;margin:14px 0 8px}.ab p{margin:0 0 10px;line-height:1.5}
.ab-logo{display:flex;gap:14px;align-items:center}.ab-logo .wl-mk{width:60px;height:60px;font-size:40px}.ab-logo img{width:60px;height:60px;object-fit:contain}
.ab-logo b{display:block;font:800 34px var(--fd);text-transform:uppercase}.ab-logo span:not(.wl-mk){color:var(--mute);font-weight:700}
.ab-cr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:6px 0}.ab-cr span{color:var(--mute);font:800 14px var(--fd);letter-spacing:1px;text-transform:uppercase;min-width:84px}.ab-cr b{font:800 30px var(--fd);text-transform:uppercase}.ab-cr small{color:var(--mute)}

/* ───────── v2.10 CLEAN skin: calm, rounded, no diagonal cuts ───────── */
html[data-skin="clean"] *{clip-path:none!important}
html[data-skin="clean"]{--bg:#101012;--surf:#1A1A1D;--surf2:#26262A;--line:rgba(255,255,255,.1);--cut:0px}
html[data-skin="clean"][data-theme="light"],html[data-skin="clean"]:not([data-theme="dark"]) .x{--bg:#F4F4F6}
@media (prefers-color-scheme:light){html[data-skin="clean"]:not([data-theme="dark"]){--bg:#F4F4F6;--surf:#fff;--surf2:#ECECEF}}
html[data-skin="clean"][data-theme="light"]{--bg:#F4F4F6;--surf:#fff;--surf2:#ECECEF}
html[data-skin="clean"] body{background-image:none}
html[data-skin="clean"] .patch,html[data-skin="clean"] .card,html[data-skin="clean"] .hero,html[data-skin="clean"] .face,html[data-skin="clean"] .intro,html[data-skin="clean"] .opt{border-radius:16px}
html[data-skin="clean"] .patch::before,html[data-skin="clean"] .h1::before,html[data-skin="clean"] .sec::after{display:none}
html[data-skin="clean"] .btn{border-radius:14px;box-shadow:none}
html[data-skin="clean"] .btn.ghost{box-shadow:inset 0 0 0 1.5px var(--line)}
html[data-skin="clean"] h1,html[data-skin="clean"] h2,html[data-skin="clean"] h3{text-transform:none;letter-spacing:0}
html[data-skin="clean"] .sec{font-size:22px;margin:22px 0 10px;color:var(--mute)}
html[data-skin="clean"] .view>*{animation:none}
html[data-skin="clean"] .hero .bg,html[data-skin="clean"] .wipe{display:none}
html[data-skin="clean"] .logo .mk,html[data-skin="clean"] .seg button,html[data-skin="clean"] .sw,html[data-skin="clean"] .sw::after,html[data-skin="clean"] .tab,html[data-skin="clean"] .chip,html[data-skin="clean"] .iconbtn{border-radius:10px}
.cl-hero{background:var(--surf);border-radius:20px;padding:22px 20px 20px;margin-bottom:14px}
.cl-nums{display:flex;gap:34px;margin-bottom:18px}.cl-nums b{display:block;font:800 56px/1 var(--fd)}.cl-nums span{color:var(--mute);font-weight:700;font-size:14px}
.cl-card{display:block;width:100%;text-align:left;background:var(--surf);border:0;border-radius:16px;padding:14px 16px;margin-bottom:12px;color:var(--ink);font:inherit}
.cl-line{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;padding:6px 0;color:var(--ink);font:inherit;text-align:left}
.cl-line span{color:var(--mute)}.cl-line b{font:800 22px var(--fd)}.cl-link{margin-top:6px;border-top:1px solid var(--line);padding-top:12px;cursor:pointer}.cl-link span{color:var(--ink);font-weight:700}

/* ───────── notes format: parse / import ───────── */
function splitArt(de){const m=String(de).trim().match(/^(der|die|das)\s+(.+)$/i);return m?{art:m[1].toLowerCase(),de:m[2].trim()}:{art:'',de:String(de).trim()}}
function parseNotes(txt){
  const out={words:[],gram:[],rules:[]};let lesson='Notes',date=dkey(),topic=null;
  for(const raw of String(txt).split(/\r?\n/)){
    const line=raw.trim();if(!line||line.startsWith('//'))continue;
    let m;
    if((m=line.match(/^@lesson\s+(.+)$/i))||(m=line.match(/^#+\s*(.+)$/))){lesson=m[1].trim();topic=null;date=dkey();continue}
    if((m=line.match(/^@date\s+(\d{4}-\d{2}-\d{2})/i))){date=m[1];continue}
    if((m=line.match(/^@grammar\s*(.*)$/i))){topic=(m[1]||'Grammar').trim();continue}
    if(/^@(words|vocab)/i.test(line)){topic=null;continue}
    if(line[0]==='!'){out.rules.push({topic:topic||'General',lesson,text:line.replace(/^!+\s*/,'')});continue}
    if(topic!==null){
      const p=line.split('|').map(s=>s.trim());
      if(!/\{\{.+?\}\}/.test(p[0]))continue;
      out.gram.push({type:'g',sentence:p[0],en:p[1]||'',hint:p[2]||'',topic,lesson,date});continue;
    }
    let de,en,ex='',exEn='',note='';
    if(line.includes('\t')){const f=line.split('\t').map(s=>s.trim());de=f[0];en=f[1];ex=f[2]||'';exEn=f[3]||''}
    else{
      const p=line.split('|').map(s=>s.trim());
      const mm=p[0].match(/^(.+?)\s*(?:=|→|->)\s*(.+)$/);if(!mm)continue;
      de=mm[1];en=mm[2];ex=p[1]||'';exEn=p[2]||'';note=p[3]||'';
    }
    if(!de||!en)continue;
    let pl='',forms='';
    const pm=de.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if(pm&&pm[1]){de=pm[1].trim();const inner=pm[2].trim();const pp=inner.match(/^pl\.?\s*:?\s*(.*)$/i);if(pp)pl=pp[1].trim();else forms=inner}
    const a=splitArt(de);
    out.words.push({de:a.de,art:a.art,pl,forms,en,ex,exEn,note,lesson,date});
  }
  return out;
}
function addParsed(p){
  let a=0,u=0,ga=0,gu=0,ra=0;
  for(const o of p.words){
    const key=((o.art?o.art+' ':'')+o.de).toLowerCase();
    const ex=WA().find(c=>((c.art?c.art+' ':'')+c.de).toLowerCase()===key);

/* ───────── leagues, seasons, form, trophies ───────── */
/* League = the level you are working at. Entry thresholds are "word equivalents" (WE), loosely based on how many
   words the Goethe-Institut word lists / common CEFR estimates expect: A1 ≈ 650, A2 ≈ 1300, B1 ≈ 2400, B2 ≈ 3500, C1 ≈ 6500. */
const TIERS=[
  {n:'3. Liga',lv:'A1',min:0,cup:'Aufstiegspokal'},
  {n:'DFB-Pokal',lv:'A2',min:650,cup:'DFB-Pokal'},
  {n:'2. Bundesliga',lv:'B1',min:1300,cup:'Zweitliga-Pokal'},
  {n:'Bundesliga',lv:'B2',min:2400,cup:'Meisterschale'},
  {n:'Europa League',lv:'C1',min:3500,cup:'Europa-League-Pokal'},
  {n:'Champions League',lv:'C2',min:6500,cup:'Champions-League-Pokal'}
];
const MW={new:0,learning:.3,young:.7,mastered:1};   // how much of a word you "own" at each stage
const GRAM_WE=2.5;                                  // one grammar item is worth 2.5 words
const MD_SEASON=4,F_MIN=-150,F_MAX=300;
const knowledge=()=>{let k=0;WALL().forEach(c=>{k+=MW[stateOf(c)]});GALL().forEach(c=>{k+=GRAM_WE*MW[stateOf(c)]});return Math.round(k)};
const lpTier=lp=>{let i=0;TIERS.forEach((t,k)=>{if(lp>=t.min)i=k});return i};
const weekStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
function LS(){
  const st=S.stats;
  if(!st.L){st.L={i:0,season:1,md:0,mdStart:weekStart(Date.now()),first:true,form:0,bonus:0,res:[],seasons:[],exams:{},news:[],tr:[]};st.L.i=lpTier(knowledge())}
  return st.L;
}
const lpNow=()=>knowledge()+LS().form+LS().bonus;
const buf=i=>Math.max(25,Math.round(((TIERS[i+1]?TIERS[i+1].min:TIERS[i].min+1500)-TIERS[i].min)*.05));
function tierInfo(){
  const L=LS(),i=L.i,t=TIERS[i],nx=TIERS[i+1],lp=lpNow();
  const zone=nx&&lp>=nx.min?'up':(i>0&&lp<t.min-buf(i))?'down':(i>0&&lp<t.min)?'warn':'safe';
  return{i,t,nx,lp,zone,pct:nx?Math.max(0,Math.min(1,(lp-t.min)/(nx.min-t.min))):1,left:nx?Math.max(0,nx.min-lp):0};
}
const tierIdx=()=>LS().i;
const weekTarget=()=>S.settings.goal*5;
function mdProgress(){
  const L=LS(),a=L.mdStart;let tore=0,days=0;
  for(let i=0;i<7;i++){const d=S.stats.days[dkey(a+i*DAY+12*36e5)];if(d){tore+=d.xp;if(d.xp>=10)days++}}
  return{tore,days,target:weekTarget(),need:4,left:Math.max(0,Math.ceil((a+7*DAY-Date.now())/DAY))};
}
function closeMatchday(){
  const L=LS(),a=L.mdStart;let tore=0,days=0;
  for(let i=0;i<7;i++){const d=S.stats.days[dkey(a+i*DAY+12*36e5)];if(d){tore+=d.xp;if(d.xp>=10)days++}}
  const target=weekTarget();let res,delta;
  if(L.first){res='D';delta=0;L.first=false}                                  // opening week: no penalty
  else if(days===0){res='X';delta=-50}                                         // no-show
  else if(tore<target*.5){res='L';delta=-25}
  else if(tore<target||days<4){res='D';delta=0}
  else if(days>=7){res='W+';delta=40}
  else{res='W';delta=30}
  L.form=Math.max(F_MIN,Math.min(F_MAX,L.form+delta));
  L.res.push({s:L.season,m:L.md+1,tore,days,res,d:delta,t:a});if(L.res.length>60)L.res.shift();
  L.md++;L.mdStart=weekStart(a+7*DAY+6*36e5);
  if(L.md>=MD_SEASON)endSeason();
}
function endSeason(){
  const L=LS(),lp=lpNow(),cur=L.i,n=L.season;let ni=cur,out='stay';
  if(cur<TIERS.length-1&&lp>=TIERS[cur+1].min){ni=cur+1;out='up'}
  else if(cur>0&&lp<TIERS[cur].min-buf(cur)){ni=cur-1;out='down'}
  const rs=L.res.filter(r=>r.s===n),w=rs.filter(r=>r.res[0]==='W').length,d=rs.filter(r=>r.res==='D').length,l=rs.length-w-d;
  L.seasons.push({n,lg:cur,lp,out,w,d,l});
  if(out==='up')addTrophy({k:'promo',lg:ni,s:n});
  if(w>=3&&l===0)addTrophy({k:'title',lg:cur,s:n});
  L.exams[n]={lg:cur,best:0,tries:0,grade:''};
  L.news.push({n,from:cur,to:ni,out,lp,w,d,l});
  L.i=ni;L.season=n+1;L.md=0;
}
function settle(){
  const L=LS();let g=0,ch=false;
  while(Date.now()>=L.mdStart+7*DAY&&g++<80){closeMatchday();ch=true}
  if(ch)save();
  return ch;
}
function addTrophy(o){const L=LS();L.tr.push(Object.assign({id:nid(),t:Date.now()},o))}
const GRADES=[['gold',.9,60],['silver',.8,40],['bronze',.7,20]];
function openExam(){
  const L=LS();let best=null;
  Object.keys(L.exams).forEach(k=>{const e=L.exams[k];if(!e.grade&&+k>=L.season-2&&(!best||+k>best.n))best={n:+k,e}});
  return best;
}
const trophyCount=()=>{const c={gold:0,silver:0,bronze:0,total:0};LS().tr.forEach(t=>{c.total++;if(t.g)c[t.g]++});return c};
const trophyName=t=>t.k==='exam'?TIERS[t.lg].cup:t.k==='promo'?'Aufstieg: '+TIERS[t.lg].n:'Saisonmeister';

/* ───────── football statistics ───────── */
function track(c,res){
  const m=S.stats.m||(S.stats.m={sh:0,g:0,ot:0,ga:0,xg:0,cs:0,sec:0});
  const p=c?((c.ok||0)+1)/((c.ok||0)+(c.bad||0)+2):.5;   // chance you would get it right, from your history with this card
  m.sh++;m.xg+=p;
  if(res==='ok')m.g++;else if(res==='close')m.ot++;else m.ga++;
}
function matchStats(){
  const m=Object.assign({sh:0,g:0,ot:0,ga:0,xg:0,cs:0,sec:0},S.stats.m||{});
  const acc=m.sh?m.g/m.sh:0,ontarget=m.sh?(m.g+m.ot)/m.sh:0;
  let days28=0;for(let i=0;i<28;i++){const d=S.stats.days[dkey(Date.now()-i*DAY)];if(d&&d.xp>0)days28++}
  const gm=id=>{const s=S.games[id];return s&&s.all?s.ok/s.all:null};
  const lapses=S.cards.reduce((a,c)=>a+(c.srs?c.srs.lapses:0),0);
  const top=WA().filter(c=>(c.ok||0)>0).sort((a,b)=>(b.ok||0)-(a.ok||0))[0];
  return Object.assign(m,{acc,ontarget,poss:days28/28,pass:gm('match'),pen:gm('dash'),reds:lapses,top,diff:m.g-m.xg});
}
const pctf=v=>v==null?'–':Math.round(v*100)+'%';
function lessonTable(){
  return lessonList().map(l=>{
    const cs=S.cards.filter(c=>c.lesson===l.name&&!c.susp);let ok=0,bad=0;
    cs.forEach(c=>{ok+=c.ok||0;bad+=c.bad||0});
    return{name:l.name,off:l.off,w:l.w,ok,bad,acc:ok+bad?ok/(ok+bad):null,mast:l.cnt.mastered};
  });
}

/* ───────── trophies: art ───────── */
const MET={gold:['#D9A71E','#F6DE7A','#8A6A10'],silver:['#AEB3BA','#EEF0F2','#666B72'],bronze:['#B06A34','#E3A266','#6A3C1C']};
function trophySvg(kind,grade,size=64){
  const [a,b,c]=MET[grade||'gold'];

  if(kind==='promo')g=`<path d="M21 3h9l4 15h-9zM34 3h9l-4 15h-9z" fill="#D20515"/><circle cx="32" cy="38" r="20" fill="${a}"/><circle cx="32" cy="38" r="15" fill="${b}"/><path d="M32 27l9 11h-6v9h-6v-9h-6z" fill="${c}"/>`;
  else if(kind==='title')g=`<ellipse cx="32" cy="20" rx="27" ry="9" fill="${b}"/><path d="M5 20c0 17 12 27 27 27s27-10 27-27c-8 6-18 8-27 8S13 26 5 20z" fill="${a}"/><rect x="28" y="46" width="8" height="8" fill="${c}"/><rect x="15" y="54" width="34" height="7" rx="1.5" fill="${c}"/><path d="M32 27l2 4.4 4.8.6-3.5 3.3.9 4.7-4.2-2.3-4.2 2.3.9-4.7-3.5-3.3 4.8-.6z" fill="#fff" opacity=".9"/>`;
  else g=`<path d="M17 6h30v17a15 15 0 0 1-30 0z" fill="${a}"/><path d="M17 11H6c0 11 4.5 16 12 17.5M47 11h11c0 11-4.5 16-12 17.5" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/><path d="M23 11h7v19a11 11 0 0 1-7-10z" fill="${b}" opacity=".85"/><rect x="29" y="38" width="6" height="11" fill="${c}"/><rect x="19" y="49" width="26" height="8" rx="1.5" fill="${a}"/><rect x="19" y="57" width="26" height="4" fill="${c}"/>`;
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true">${g}</svg>`;
}
const gradeLabel=g=>({gold:'Gold',silver:'Silber',bronze:'Bronze'}[g]||'');
const RL=()=>({W:'W',D:'D',L:'L',X:'R','W+':'W+'});
function formChips(n=5){
  const rs=LS().res.slice(-n);
  const chips=rs.map(r=>`<span class="fm nt f-${r.res==='W+'?'W':r.res}" title="${r.tore}">${RL()[r.res]}</span>`);
  while(chips.length<n)chips.unshift('<span class="fm nt f-E">·</span>');
  return `<span class="form">${chips.join('')}</span>`;
}

/* ───────── season exam ("Saisonfinale") ───────── */
function startExam(){
  const ex=openExam();if(!ex){toast('No exam available right now');return}
  closeSheet();
  const wp=W().filter(c=>act(c)),gp=G().filter(c=>act(c));
  const seen=shuffle(wp.filter(c=>c.srs.seen>0)),rest=shuffle(wp.filter(c=>!c.srs.seen));
  const pool=seen.concat(rest);
  if(pool.length<10){toast('Needs at least 10 words in your training scope');return}
  const nG=gp.length>=3?4:0,nW=Math.min(20-nG,pool.length);
  const kinds=c=>{const k=['mc2','type','mc1'];if(c.art)k.push('art');if(pluralOf(c))k.push('plu');if(clozeOf(c))k.push('cloze');return k};
  const items=pool.slice(0,nW).map(c=>{const k=kinds(c);return{cid:c.id,kind:k[rnd(k.length)]}}).concat(shuffle(gp).slice(0,nG).map(c=>({cid:c.id,kind:'gcl'})));
  ses={game:'exam',exam:true,examSeason:ex.n,arcade:true,items:shuffle(items),i:0,correct:0,wrong:0,score:0,xp:0,combo:0,maxCombo:0,graded:new Set(),t0:Date.now(),learned:0,locked:false,lastKind:''};
  openOverlay();next();
}
function finishExam(){
  const n=ses.items.length,pct=ses.correct/n,L=LS(),e=L.exams[ses.examSeason],secs=Math.round((Date.now()-ses.t0)/1000);
  stopSpeak();
  const gr=GRADES.find(g=>pct>=g[1]);let note='';
  if(e){e.tries++;e.best=Math.max(e.best,pct)}
  if(gr&&e&&!e.grade){
    e.grade=gr[0];L.bonus+=gr[2];
    addTrophy({k:'exam',lg:e.lg,s:ses.examSeason,g:gr[0],p:Math.round(pct*100)});
    note=`<div class="card patch c-lantern note-card"><span>${trophySvg('cup',gr[0],54)}</span><div><div class="kick">Neue Trophäe</div><div style="font:800 22px var(--fd);text-transform:uppercase">${esc(TIERS[e.lg].cup)} · ${gradeLabel(gr[0])}</div><div class="sub">+${gr[2]} Liga-Punkte</div></div></div>`;
  }
  const xp=Math.round(20+pct*40),before=lvl(S.stats.xp),res=addXP(xp,n);
  S.stats.m=S.stats.m||{sh:0,g:0,ot:0,ga:0,xg:0,cs:0,sec:0};S.stats.m.sec+=secs;if(!ses.wrong){S.stats.m.cs++;S.stats.perfect++}
  const got=checkBadges();save();sfx('win');if(gr)confetti();vib([20,30,20,30,60]);
  const retry=!gr&&e&&!e.grade;
  resultScreen({mood:gr?'cheer':'oops',title:gr?(gr[0]==='gold'?'Meister!':'Bestanden!'):'Nicht bestanden',sub:gr?'Season exam passed.':'You need 70% to win silverware. Review and try again.',stars:gr?3-GRADES.indexOf(gr):0,
    rows:[{v:Math.round(pct*100)+'%',l:'score',c:'lantern'},{v:ses.correct+'/'+n,l:'correct',c:'fern'},{v:'+'+xp,l:'points',c:'sky'}],extra:note+extrasFor(res,got,lvl(S.stats.xp)>before),
    againLabel:retry?'Try again':'Back to the table',again:()=>{closeSes();if(retry)startExam();else{tab='stats';statTab='cabinet';render()}}});
}

/* ───────── season news + cabinet ───────── */
function newsSheet(){
  const L=LS();if(!L.news.length)return;
  const n=L.news.shift();save();
  const T=TIERS,icon=n.out==='up'?'↑':n.out==='down'?'↓':'=';
  const de=LANG==='de',nm=T[n.to].n,msg=n.out==='up'?(de?`Aufstieg: ${nm}!`:`Promoted to the ${nm}!`):n.out==='down'?(de?`Abstieg: ${nm}.`:`Relegated to the ${nm}.`):(de?`Klassenerhalt: ${nm}.`:`Safe in the ${nm}.`);
  const hint=n.out==='down'?'Hit your weekly target and keep your words fresh to climb back.':n.out==='up'?'New league, new vocabulary. Keep the streak alive.':'Keep going: the next promotion is closer than you think.';
  sheet(`<div class="kick">Saison ${n.n} · Abpfiff</div><h3 style="font-size:42px;margin:4px 0 8px">${icon} ${esc(msg)}</h3>
  <div class="sgrid" style="margin:10px 0"><div class="sg patch c-fern"><b>${n.w}</b><span>Siege</span></div><div class="sg patch c-sky"><b>${n.d}</b><span>Remis</span></div><div class="sg patch c-berry"><b>${n.l}</b><span>Niederlagen</span></div></div>
  <p class="sub">${n.lp} Liga-Punkte. ${esc(hint)}</p>
  ${openExam()?`<button class="btn c-lantern" id="nw-ex" style="margin-top:14px">Saisonfinale spielen</button>`:''}
  <button class="btn ghost" id="nw-ok" style="margin-top:10px">${L.news.length?'Weiter':'Schließen'}</button>`,sh=>{
    const ex=$('#nw-ex',sh);if(ex)ex.onclick=startExam;
    $('#nw-ok',sh).onclick=()=>{closeSheet();render();if(L.news.length)setTimeout(newsSheet,300)};
  });
}
function cabinetHtml(){
  const L=LS(),tr=L.tr.slice().reverse(),c=trophyCount(),ex=openExam();
  const slot=t=>`<div class="troph ${t.g||''}"><div class="tsv">${trophySvg(t.k==='exam'?'cup':t.k,t.g||'gold',72)}</div><b>${esc(trophyName(t))}</b><span>Saison ${t.s}${t.g?' · '+gradeLabel(t.g)+' · '+t.p+'%':''}</span></div>`;
  const ghost=Array.from({length:Math.max(0,6-tr.length)},()=>`<div class="troph ghost"><div class="tsv">${trophySvg('cup','silver',72)}</div><b>–</b><span>Noch frei</span></div>`).join('');
  return `<div class="card patch c-fern"><div class="stage4"><div><b>${c.total}</b><span>Trophäen</span></div><div><b>${c.gold}</b><span>Gold</span></div><div><b>${c.silver}</b><span>Silber</span></div><div><b>${c.bronze}</b><span>Bronze</span></div></div></div>
  ${ex?`<div class="card patch c-lantern" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div class="kick">Saison ${ex.n} · Saisonfinale</div><h3 style="font-size:26px">${esc(TIERS[ex.e.lg].cup)}</h3><p class="sub">20 questions · 70% wins Bronze, 80% Silver, 90% Gold</p></div><button class="btn sm c-fern" style="width:auto" data-a="exam">Play</button></div>`:`<p class="sub" style="margin:0 2px 10px">Every season ends with an exam. Pass it to win silverware.</p>`}
  <div class="cabinet">${tr.map(slot).join('')}${ghost}</div>`;
}

const starsFor=(id,sc)=>GAMES[id].stars.filter(t=>sc>=t).length;
const starsHtml=n=>`<span class="stars">${[0,1,2].map(i=>`<span class="${i<n?'on':'off'}">★</span>`).join('')}</span>`;
function featuredId(){const ids=Object.keys(GAMES).filter(id=>!gameReq(id,''));if(!ids.length)return'';let h=0;for(const ch of dkey())h=(h*31+ch.charCodeAt(0))>>>0;return ids[h%ids.length]}
function gameReq(id,lesson){
  const w=poolW(lesson);
  switch(id){
    case'sprint':case'match':return w.length>=4?null:'Needs 4+ words';
    case'dash':return w.filter(c=>c.art).length>=3?null:'Needs 3+ nouns (with der/die/das)';
    case'plural':return w.filter(pluralOf).length>=3?null:'Needs 3+ nouns with (Pl. …)';
    case'scramble':return w.filter(scrOK).length>=3?null:'Needs 3+ single words';
    case'echo':return !canSpeak()?(S.settings.tts?'Needs a German voice on this device':'Turn on speech in Settings'):w.length>=3?null:'Needs 3+ words';
    case'gap':return poolG(lesson).length>=3?null:'Needs 3+ grammar items';
  }
  return'Unavailable';
}
const totalPlays=()=>Object.values(S.games).reduce((a,g)=>a+g.plays,0);
function checkBadges(){const got=[];BADGES.forEach(b=>{if(!S.stats.badges[b.id]&&b.t()){S.stats.badges[b.id]=Date.now();got.push(b)}});return got}
function recordGame(id,s){
  const gs=S.games[id]||(S.games[id]={plays:0,best:0,ok:0,all:0,bestCombo:0,secs:0,hist:[],stars:0});
  const prev=gs.best,prevStars=gs.stars;
  gs.plays++;gs.ok+=s.correct;gs.all+=s.all;gs.secs+=s.secs;gs.bestCombo=Math.max(gs.bestCombo,s.combo);gs.hist.push(s.score);if(gs.hist.length>12)gs.hist.shift();
  const isBest=s.score>prev;if(isBest)gs.best=s.score;
  gs.stars=Math.max(gs.stars,starsFor(id,gs.best));
  let xp=Math.round(s.score/5)+(isBest&&prev>0?10:0);const feat=featuredId()===id;if(feat)xp*=2;
  const before=lvl(S.stats.xp);
  const res=addXP(xp,s.all);
  S.stats.maxCombo=Math.max(S.stats.maxCombo,s.combo);
  const h=new Date().getHours();if(h>=22||h<5)S.stats.night=true;
  bump('ans',s.all);bump('games',id);bump('combo',s.combo);bump('score',s.score);
  const got=checkBadges();save();
  return{isBest:isBest&&prev>0,first:prev===0,stars:starsFor(id,s.score),xp,feat,res,got,best:gs.best,newStar:gs.stars>prevStars,lvlUp:lvl(S.stats.xp)>before};
}

function spark(h,max){
  if(!h||h.length<2)return'<p class="sub" style="text-align:center;font-size:13px">Play a few rounds to see your trend.</p>';
  const w=300,hh=50,m=Math.max(max,...h,1),step=w/(h.length-1);
  const pts=h.map((v,i)=>`${(i*step).toFixed(1)},${(hh-4-v/m*(hh-10)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--lantern-d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${h.map((v,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${(hh-4-v/m*(hh-10)).toFixed(1)}" r="3" fill="var(--bg)" stroke="var(--lantern-d)" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`;
}
function gameSheet(id){

  sheet(`<div style="display:flex;gap:12px;align-items:center"><div class="gi patch c-${g.col}" style="width:58px;height:58px;font-size:32px;border-radius:20px">${g.ic}</div><div><h3>${g.n}</h3><p class="sub">${esc(arc.lesson||'All lessons')}</p></div></div>

const AI_PROMPT=`Convert my German class notes into the Kobel import format. One entry per line.

@lesson <title>      e.g. @lesson Session 4 · Family
@date YYYY-MM-DD     the class date

Vocabulary line:  german (details) = english | example sentence | example translation | short note
- nouns start with der/die/das, put the plural in details: (Pl. -e)  (Pl. -"e)  (Pl. -n)  (Pl. -er)  (Pl. -s)  (Pl. -)  or the full word (Pl. Kinder)
- verbs: put the forms in details: (geht, ging, ist gegangen)
- in the example, wrap the exact word form in {{ }} when it is conjugated or declined
Example:
der Job (Pl. -s) = job | Ich habe zwei {{Jobs}}. | I have two jobs.
gehen (geht, ging, ist gegangen) = to go | Wohin {{gehst}} du? | Where are you going?

Grammar (only about 20% of the content): a line "@grammar Topic name", optional rule lines starting with "! ", then practice lines:
sentence with {{gap}} | translation | short hint
Example:
@grammar Verb haben
! ich habe · du hast · er/sie/es hat
Ich {{habe}} zwei Jobs. | I have two jobs. | ich → habe

Rules: use ONLY what is in my notes (do not add extra words), keep meanings short, leave the example empty if my notes have none, and output only the formatted lines.

My notes:
`;
async function copyText(t){

}
const summary=r=>{const p=[];if(r.a)p.push(r.a+' new word'+(r.a>1?'s':''));if(r.u)p.push(r.u+' updated');if(r.ga)p.push(r.ga+' grammar');if(r.ra)p.push(r.ra+' rule'+(r.ra>1?'s':''));return p.join(', ')||'Nothing new found'};
function importSheet(){

  <details><summary>The Kobel notes format</summary><pre>@lesson Session 4 · Topic
@date 2026-10-08

german (details) = english | example | example translation | note

der Job (Pl. -s) = job | Ich habe zwei {{Jobs}}. | I have two jobs.
arbeiten = to work | Ich {{arbeite}} bei HotSped. | I work at HotSped.
ledig = single | | | Also: Single

@grammar Verb haben
! ich habe · du hast · er/sie/es hat
Ich {{habe}} zwei Jobs. | I have two jobs. | ich → habe

Plural codes: -e  -"e  -n  -en  -er  -"er  -s  -  (or full word)
{{ }} marks the gap word for fill-in games.
Only the first two columns are required.</pre></details>
  <button class="btn c-sky" id="i-ai" style="margin-bottom:6px">Copy prompt for Claude</button>

/* ───────── session engine ───────── */
let ses=null;
const R={};
function avail(c){
  const a=[];if(WALL().length>=4)a.push('mc1','mc2');a.push('type');
  if(c.art)a.push('art');if(pluralOf(c))a.push('plu');if(clozeOf(c))a.push('cloze');if(canSpeak())a.push('listen');if(scrOK(c))a.push('scr');if(sentenceOf(c))a.push('order');return a;
}
function pickKind(c,mode){
  if(isG(c))return'gcl';
  const av=avail(c);
  if(mode==='flash'||mode==='ahead')return'flash';
  const r=c.srs.reps;
  const pref=r<2?['mc1','mc2','art','plu','cloze']:r<4?['mc2','type','scr','cloze','art','plu','listen']:['type','listen','scr','order','cloze','mc2','plu'];
  const ok=pref.filter(k=>av.includes(k));const pool=ok.length?ok:av;
  let k=pool[rnd(pool.length)];if(k===ses.lastKind&&pool.length>1)k=pool[rnd(pool.length)];
  return k;
}
function gather(pool,n,newCap,extras){
  const now=Date.now();
  const due=pool.filter(c=>c.srs.seen>0&&c.srs.due<=now).sort((a,b)=>a.srs.due-b.srs.due);
  const fresh=shuffle(pool.filter(c=>c.srs.seen===0)).slice(0,newCap);
  let list=due.slice(0,n).map(c=>({c,extra:false}));
  fresh.slice(0,Math.max(0,n-list.length)).forEach(c=>list.push({c,extra:false}));
  const need=extras?Math.min(n,extras):0;
  if(list.length<need)pool.filter(c=>c.srs.seen>0&&c.srs.due>now).sort((a,b)=>a.srs.due-b.srs.due).slice(0,need-list.length).forEach(c=>list.push({c,extra:true}));
  return list;
}
function startSession(mode,lesson,opt={}){
  const gShare=S.settings.gShare;
  let vpool=poolW(lesson).filter(act),gpool=poolG(lesson).filter(act);
  if(mode==='new'){vpool=vpool.filter(c=>!c.srs.seen);gpool=[]}
  if(mode==='tricky'){vpool=tricky(vpool);gpool=gpool.filter(c=>(c.bad||0)>1);if(!vpool.length&&!gpool.length){toast('No tricky words yet. Nice!');return}}
  if(mode==='flash')gpool=[];
  if(mode==='ahead'){const now=Date.now(),lim=now+(opt.days||1)*DAY;vpool=vpool.filter(c=>c.srs.seen>0&&c.srs.due>now&&c.srs.due<=lim).sort((a,b)=>a.srs.due-b.srs.due);gpool=[];if(!vpool.length){toast('Nothing due in that window');return}}
  const MAX=mode==='new'?14:12;
  let nG=gpool.length&&gShare>0&&mode!=='new'?Math.max(1,Math.round(MAX*gShare)):0;
  let list;
  if(mode==='ahead')list=vpool.slice(0,MAX).map(c=>({c,extra:false}));
  else if(mode==='tricky')list=vpool.slice(0,MAX).map(c=>({c,extra:c.srs.seen>0&&c.srs.due>Date.now()})).concat(gpool.slice(0,nG).map(c=>({c,extra:true})));
  else{
    const gl=gather(gpool,nG,2,nG);
    const vl=gather(vpool,MAX-gl.length,mode==='new'?MAX:S.settings.newPer,6);
    list=vl.concat(gl);
  }
  if(!list.length){toast(mode==='new'?'No new words waiting':'Nothing to practise yet. Import some notes!');return}

function distract(c,fn,n=3){

function gDistract(c,ans,n=3){

R.match=it=>{
  const cs=it.cids.map(byId).filter(Boolean);
  let sel=null,done=0,missAll=0;const miss={},t0=Date.now();
  const L=shuffle(cs),Rr=shuffle(cs);
  setMain(`${tagH('Match the pairs','fern')}<h2 class="q" style="font-size:22px">Tap a German word, then its meaning</h2><div class="mcols"><div class="col">${L.map(c=>`<button class="mt" data-s="l" data-id="${c.id}">${fmtDe(c)}</button>`).join('')}</div><div class="col">${Rr.map(c=>`<button class="mt" data-s="r" data-id="${c.id}">${esc(c.en)}</button>`).join('')}</div></div>`);
  setFoot('<button class="btn" disabled>Match all pairs</button>');
  const all=[...document.querySelectorAll('#sMain .mt')];
  all.forEach(b=>b.onclick=()=>{
    if(ses.locked)return;
    if(b.dataset.s==='l'){all.filter(x=>x.dataset.s==='l').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;sfx('tick');if(canSpeak())speak(disDe(byId(b.dataset.id)),1);return}
    if(!sel)return;
    if(sel.dataset.id===b.dataset.id){
      sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;done++;sfx('ok');
      if(done===cs.length){
        ses.locked=true;
        cs.forEach(c=>{track(c,miss[c.id]?'close':'ok');c.ok=(c.ok||0)+1;if(!ses.arcade&&!ses.graded.has(c.id)){ses.graded.add(c.id);const was=c.srs.seen===0;grade(c,miss[c.id]?1:2,false);if(was)ses.learned++}});
        ses.correct+=cs.length;ses.combo+=1;ses.maxCombo=Math.max(ses.maxCombo,ses.combo);
        let pts;
        if(ses.arcade){const secs=(Date.now()-t0)/1000;pts=Math.max(20,Math.round(60+Math.max(0,40-secs)-missAll*8));ses.score+=pts}
        else{pts=cs.length*3;ses.xp+=pts}
        floatXP(pts);save();drawTop();
        setFoot(`<div class="fb">${emil('cheer',54)}<div class="grow"><div class="h">${PRAISE[rnd(PRAISE.length)]}</div><div class="b">All pairs matched${ses.arcade?` · +${pts} points`:''}.</div></div></div><button class="btn c-fern" id="cont">Continue</button>`,'good fb');
        $('#cont').onclick=advance;
      }
    }else{
      const idl=sel.dataset.id;miss[idl]=(miss[idl]||0)+1;missAll++;ses.wrong++;ses.combo=0;
      const lc=byId(idl);if(lc){track(lc,'bad');lc.bad=(lc.bad||0)+1}
      [sel,b].forEach(x=>{x.classList.add('no');setTimeout(()=>x.classList.remove('no'),450)});sel.classList.remove('sel');sel=null;sfx('bad');vib(30);drawTop();
    }
  });
};

/* ───────── arcade engines ───────── */
function startGame(id,lesson){
  const g=GAMES[id],req=gameReq(id,lesson);if(req){toast(req);return}
  if(g.kind==='rush')return startRush(id,lesson);
  const words=poolW(lesson);let items=[];
  if(id==='match'){const ps=shuffle(words);for(let r=0;r<2;r++){const grp=ps.slice(r*6,r*6+6);if(grp.length>=4)items.push({kind:'match',cids:grp.map(c=>c.id)})}}
  else if(id==='scramble')items=shuffle(words.filter(scrOK)).slice(0,8).map(c=>({cid:c.id,kind:'scr'}));
  else if(id==='echo')items=shuffle(words).slice(0,8).map(c=>({cid:c.id,kind:'listen'}));
  else if(id==='gap')items=shuffle(poolG(lesson)).slice(0,8).map(c=>({cid:c.id,kind:'gcl'}));
  if(!items.length){toast('Not enough material for this game');return}
  ses={game:id,arcade:true,items,i:0,correct:0,wrong:0,score:0,xp:0,combo:0,maxCombo:0,graded:new Set(),t0:Date.now(),learned:0,locked:false,lastKind:'',lesson};
  openOverlay();next();
}
function startRush(id,lesson){
  const g=GAMES[id];let pool=poolW(lesson);
  if(id==='dash')pool=pool.filter(c=>c.art);if(id==='plural')pool=pool.filter(pluralOf);
  ses={game:id,rush:true,arcade:true,secs:g.secs,left:g.secs,score:0,correct:0,wrong:0,combo:0,maxCombo:0,locked:false,t0:Date.now(),lesson,items:[],i:0,graded:new Set(),pool,recent:[]};
  openOverlay(true);drawTop();
  const my=ses;
  my.timer=setInterval(()=>{if(ses!==my||my.ended){clearInterval(my.timer);return}my.left-=.1;drawTop();if(my.left<=0){clearInterval(my.timer);my.ended=true;finishArcade()}},100);
  rushNext();
}
function rushPick(){
  const p=ses.pool;let c,t=0;
  do{c=p[rnd(p.length)];t++}while(ses.recent.includes(c.id)&&t<12&&p.length>4);
  ses.recent.push(c.id);if(ses.recent.length>3)ses.recent.shift();return c;
}
function rushNext(){
  if(!ses||ses.ended)return;
  const c=rushPick(),id=ses.game;let q;
  if(id==='sprint'){
    if(Math.random()<.5)q={tag:'Translate',color:'lantern',prompt:fmtDe(c),opts:shuffle([c.en,...distract(c,x=>x.en)]).map(v=>({v,html:esc(v)})),correct:c.en};
    else q={tag:'Pick the German',color:'lantern',prompt:esc(c.en),opts:shuffle([c,...shuffle(WALL().filter(x=>x.id!==c.id&&disDe(x)!==disDe(c))).slice(0,3)]).map(x=>({v:x.id,html:fmtDe(x)})),correct:c.id};
  }else if(id==='dash')q={tag:'Which article?',color:'sky',prompt:esc(c.de),cls:'art3',opts:['der','die','das'].map(a=>({v:a,cls:a,html:a})),correct:c.art};
  else{const right=pluralOf(c);q={tag:'Plural',color:'berry',prompt:`${fmtDe(c)}`,sub:'die …',opts:shuffle([right,...pluralWrong(c,right,2)]).map(v=>({v,html:esc(v)})),correct:right}}
  setMain(`<div class="rushh">${tagH(q.tag,q.color)}<div class="sc">Score <b id="rs">${ses.score}</b></div></div><h2 class="q big">${q.prompt}</h2>${q.sub?`<p class="sub" style="text-align:center">${q.sub}</p>`:''}<div class="opts ${q.cls||''}">${q.opts.map((o,i)=>`<button class="opt ${o.cls||''}" data-i="${i}"><span class="k">${i+1}</span><span>${o.html}</span></button>`).join('')}</div>`);
  const btns=[...document.querySelectorAll('#sMain .opt')],my=ses;
  btns.forEach((b,i)=>b.onclick=()=>{
    if(my.locked||my.ended)return;my.locked=true;
    const ok=q.opts[i].v===q.correct;
    btns.forEach((x,k)=>{x.disabled=true;if(q.opts[k].v===q.correct)x.classList.add('ok');else if(k===i)x.classList.add('no')});
    track(c,ok?'ok':'bad');
    if(ok){const pts=10+Math.min(my.combo,10);my.score+=pts;my.combo++;my.correct++;my.maxCombo=Math.max(my.maxCombo,my.combo);c.ok=(c.ok||0)+1;floatXP(pts);sfx('ok');vib(10);if(my.combo%5===0){my.left=Math.min(my.secs+10,my.left+2);floatXP('+2s')}}
    else{my.wrong++;my.combo=0;my.left-=3;markBad(c);sfx('bad');vib(30)}
    drawTop();const rs=$('#rs');if(rs)rs.textContent=my.score;
    setTimeout(()=>{if(ses===my&&!my.ended){my.locked=false;rushNext()}},ok?260:780);
  });
}

const fromWire=w=>{const c=mk({id:w.id,type:w.type,lesson:w.lesson,date:w.date,created:w.created,de:w.de,art:w.art,pl:w.pl,forms:w.forms,en:w.en,ex:w.ex,exEn:w.exEn,note:w.note,sentence:w.sentence,topic:w.topic,hint:w.hint,srs:{due:w.due,iv:w.iv,ease:w.ease,reps:w.reps,lapses:w.lapses,seen:w.seen},ok:w.ok,bad:w.bad,susp:!!w.susp,bury:w.bury,u:w.u});c.h=cardSig(c);c.su=w.u;return c};
async function api(method,path,body){
  const c=S.sync;let res;
  try{res=await fetch(c.url.replace(/\/+$/,'')+path,{method,headers:{'Authorization':'Bearer '+c.code,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
  catch(e){throw new Error('Cannot reach the server. Check the address and your connection.')}

function applyServer(res,first){
  const tombs=new Set(S.tomb.map(t=>t.id));
  for(const w of res.cards||[]){
    if(tombs.has(w.id))continue;
    const loc=byId(w.id);
    if(!loc)S.cards.push(fromWire(w));
    else if(first){
      // first connection: keep whichever copy has more study progress, never wipe progress with a blank copy
      const mine=loc.srs.seen*1000+(loc.ok||0),theirs=(w.seen||0)*1000+(w.ok||0);
      if(mine>theirs){loc.h='';loc.u=0}else Object.assign(loc,fromWire(w));
    }
    else if(w.u>loc.u)Object.assign(loc,fromWire(w));
  }
  for(const w of res.rules||[]){
    if(tombs.has(w.id))continue;
    const loc=S.rules.find(r=>r.id===w.id);
    const n={id:w.id,idv:1,topic:w.topic,lesson:w.lesson,text:w.text,u:w.u,su:w.u,h:JSON.stringify([w.topic,w.lesson,w.text])};
    if(!loc)S.rules.push(n);else if(w.u>loc.u)Object.assign(loc,n);
  }
  for(const d of res.deleted||[]){if(d.k==='c')S.cards=S.cards.filter(c=>c.id!==d.id);else S.rules=S.rules.filter(r=>r.id!==d.id)}
  const p=res.profile;
  if(p&&p.u>(S.pu||0)&&p.data&&(!first||((p.data.stats||{}).xp||0)>=(S.stats.xp||0))){
    const mine=S.stats.days||{},theirs=(p.data.stats&&p.data.stats.days)||{},days=Object.assign({},theirs);
    for(const k in mine)days[k]={xp:Math.max((days[k]||{xp:0}).xp,mine[k].xp),n:Math.max((days[k]||{n:0}).n,mine[k].n||0)};
    const badges=Object.assign({},S.stats.badges,(p.data.stats||{}).badges);
    const keepBackup=S.stats.lastBackup;
    S.stats=Object.assign({},p.data.stats,{days,badges,lastBackup:keepBackup});
    S.games=p.data.games||S.games;
    S.settings=Object.assign({},S.settings,p.data.settings||{});
    S.ph=JSON.stringify([S.stats,S.games,S.settings]);S.pu=p.u;S.psu=p.u;
    applyTheme();
  }
}

    stamp();
    const pend=[
      ...S.cards.filter(c=>c.u!==c.su).map(c=>({k:'c',w:toWire(c),ref:c})),
      ...S.rules.filter(r=>r.u!==r.su).map(r=>({k:'r',w:{id:r.id,topic:r.topic,lesson:r.lesson,text:r.text,u:r.u},ref:r})),
      ...S.tomb.map(t=>({k:'d',w:t,ref:t}))
    ];
    const pushProfile=(S.pu||0)!==(S.psu||0);
    const n=Math.max(1,Math.ceil(pend.length/30));
    let last=null;
    for(let i=0;i<n;i++){
      const chunk=pend.slice(i*30,i*30+30);
      last=await api('POST','/v1/sync',{since:cfg.pulled||0,cards:chunk.filter(x=>x.k==='c').map(x=>x.w),rules:chunk.filter(x=>x.k==='r').map(x=>x.w),deleted:chunk.filter(x=>x.k==='d').map(x=>({id:x.w.id,k:x.w.k,u:x.w.u})),profile:(i===0&&pushProfile)?{u:S.pu,data:{stats:S.stats,games:S.games,settings:S.settings}}:null});
      chunk.forEach(x=>{if(x.k==='c'||x.k==='r')x.ref.su=x.ref.u});
      S.tomb=S.tomb.filter(t=>!chunk.some(x=>x.ref===t));
      applyServer(last);
    }
    if(pushProfile)S.psu=S.pu;
    cfg.pulled=Math.max(0,last.serverTime-5000);
    save();syncing=false;
    setSyncStatus('Synced '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
    if(manual||tab==='home'||tab==='library'||tab==='stats')render();
    return true;
  }catch(e){syncing=false;setSyncStatus('Sync failed: '+e.message);if(manual)toast(e.message);return false}
}
function setSyncStatus(t){syncStatus=t;const el=$('#sync-st');if(el)el.textContent=t}
function syncCard(){
  const c=S.sync;
  const body=c&&c.url
    ?`<p class="sub" style="margin-bottom:10px;word-break:break-all">${esc(c.url)}<br><span id="sync-st">${esc(syncStatus)}</span></p><div class="row2"><button class="btn c-sky" data-a="syncnow">Sync now</button><button class="btn ghost" data-a="syncoff">Disconnect</button></div>`
    :`<p class="sub" style="margin-bottom:10px">Optional. Keeps your words and progress in your own free Cloudflare database and shares them between your devices. It works in the Android app. The access code is stored only on this device.</p><input class="inp" id="sy-u" placeholder="https://kobel-api.yourname.workers.dev" autocomplete="off" autocapitalize="none" style="margin-bottom:8px"><input class="inp" id="sy-c" type="password" placeholder="Access code" autocomplete="off" style="margin-bottom:10px"><button class="btn c-fern" data-a="syncon">Connect and sync</button>`;
  return `<h2 class="sec">Cloud sync</h2><div class="card patch">${body}</div>`;
}

let LANG='en';
const NT='.opt,.mt,.wt,.q,.intro,.face,.crow,.nm,.blank,.nt,.fb .b b,.troph,textarea,pre,input,script,style,.w,.ex,.ct,.lt,.nc';
function trKey(s){const nums=[];const k=s.replace(/\d+(?:[.,]\d+)?/g,m=>{nums.push(m);return'#'});return{k:k.replace(/\s+/g,' ').trim(),nums}}
function trText(s){
  const lead=s.match(/^\s*/)[0],trail=s.match(/\s*$/)[0],{k,nums}=trKey(s);
  if(!k)return s;
  const e=I18N[k];if(!e)return s;
  let out=e[LANG==='de'?1:0],i=0;
  out=out.replace(/#/g,()=>nums[i++]??'#');
  return lead+out+trail;
}
function trNode(n){
  if(n.nodeType===3){
    const p=n.parentElement;if(!p||p.closest(NT))return;
    const v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;
  }else if(n.nodeType===1){
    if(n.closest&&n.closest(NT)&&n.tagName!=='BUTTON')return;
    ['placeholder','aria-label'].forEach(a=>{if(n.hasAttribute&&n.hasAttribute(a)){const v=trText(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v)}});
    const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;const list=[];while(t=w.nextNode())list.push(t);list.forEach(trNode);
    if(n.querySelectorAll)n.querySelectorAll('[placeholder],[aria-label]').forEach(trNode2);
  }
}
function trNode2(n){['placeholder','aria-label'].forEach(a=>{if(n.hasAttribute(a)){const v=trText(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v)}})}
function setLang(l){LANG=l==='de'?'de':'en';document.documentElement.lang=LANG}
let trBusy=false;
const trObs=new MutationObserver(ms=>{
  if(trBusy)return;trBusy=true;
  try{ms.forEach(m=>{if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)})}finally{trBusy=false}
});
function startI18n(){setLang(S.settings.lang);trObs.observe(document.body,{childList:true,subtree:true,characterData:true});trNode(document.body)}

  set:t=>{const k=t.dataset.k;let v=t.dataset.v;if(['goal','newPer','gShare'].includes(k))v=+v;S.settings[k]=v;save();if(k==='theme'||k==='skin')applyTheme();if(k==='lang')setLang(v);render()},
  tog:t=>{const k=t.dataset.k;S.settings[k]=!S.settings[k];save();render();if(k==='sound'&&S.settings.sound)sfx('ok')},
  reset:t=>{if(!t.dataset.s){t.dataset.s=1;t.textContent='Tap again to reset points, streak and word progress';return}
    S.cards.forEach(c=>{c.srs=newSrs();c.ok=0;c.bad=0});S.stats={};S.games={};defaults();save();render();toast('Progress reset')},
  wipe:t=>{if(!t.dataset.s){t.dataset.s=1;t.textContent='Tap again to erase everything';return}
    const tomb=S.sync&&S.sync.url?S.cards.map(c=>({id:c.id,k:'c',u:Date.now()})).concat(S.rules.map(r=>({id:r.id,k:'r',u:Date.now()}))):[];
    S={cards:[],rules:[],games:{},stats:{},settings:S.settings,sync:S.sync,tomb,batch:BATCHES.length};defaults();save();render();toast('Library erased')},
  classnotes:()=>{let a=0,ga=0;BATCHES.forEach(b=>{const r=addParsed(parseNotes(b));a+=r.a;ga+=r.ga});save();render();toast(a||ga?`${a} words, ${ga} grammar items re-added`:'Everything from your notes is already there')}
};

  const uk=e.target.closest('.uk');
  if(uk){const i=$('#ans');if(i&&!i.disabled){const s=i.selectionStart==null?i.value.length:i.selectionStart,en=i.selectionEnd==null?s:i.selectionEnd;i.value=i.value.slice(0,s)+uk.dataset.ch+i.value.slice(en);i.setSelectionRange(s+1,s+1);i.dispatchEvent(new Event('input'));i.focus()}return}
  const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t,e);
});

document.addEventListener('keydown',e=>{
  if(!ses||$('#sheet'))return;
  const inField=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(!inField&&/^[1-4]$/.test(e.key)&&!ses.locked){const o=document.querySelectorAll('#sMain .opt')[+e.key-1];if(o){o.click();return}}
  if(!inField&&e.key==='Enter'&&!ses.rush){const b=$('#cont')||$('#chk:not([disabled])')||$('#got')||$('#show');if(b)b.click()}
  if(e.key==='Escape')quit();
});
