.track.perfect i{background:linear-gradient(90deg,#2fd27a,#9dffc6)}

/* ---- combo chip + milestone banner ---- */
.combo{display:flex;align-items:center;justify-content:flex-end;gap:5px;min-width:58px;transition:color .3s}
.combo .cf{display:inline-flex;width:18px;height:18px;transform-origin:50% 90%;animation:qxFlame 1s ease-in-out infinite alternate}
.combo .cf svg{width:100%;height:100%}
.combo b{font:800 22px var(--fd);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.combo.t1{color:#ffd23f}.combo.t2{color:#ff9d2e}.combo.t3{color:#ff5a36}.combo.t4{color:#fff;text-shadow:0 0 14px #ff5a36,0 0 28px #ffd23f}
.combo.t2 .cf,.combo.t3 .cf,.combo.t4 .cf{width:22px;height:22px}
.combo.pulse{animation:qxCombo .5s var(--qx-ease)}
.combo.lost{animation:qxLost .6s ease-in both}
@keyframes qxCombo{0%{transform:scale(1)}35%{transform:scale(1.5) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes qxLost{0%{opacity:1}100%{opacity:0;transform:translateY(16px) scale(.6) rotate(8deg)}}
@keyframes qxFlame{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.14) rotate(3deg)}}
.qx-ms{position:absolute;left:0;right:0;top:20%;z-index:8;text-align:center;pointer-events:none;animation:qxMs 1.5s var(--qx-ease) both}
.qx-ms b{display:inline-block;font:800 clamp(38px,12vw,64px)/1 var(--fd);letter-spacing:-.02em;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 var(--red),0 10px 40px rgba(0,0,0,.6);padding:0 .2em}
.qx-ms i{display:block;font:700 14px var(--fb);font-style:normal;letter-spacing:.28em;text-transform:uppercase;color:#ffd23f;margin-top:8px}
.qx-ms::before{content:'';position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:3px solid #ffd23f;opacity:0;animation:qxRing 1s .05s ease-out both}
@keyframes qxMs{0%{opacity:0;transform:scale(.4) rotate(-4deg)}16%{opacity:1;transform:scale(1.12) rotate(1deg)}28%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.04)}}
@keyframes qxRing{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.6)}}

/* ---- letter tiles (spelling game and sentence builder) ---- */
.qx-b{--ts:52px;display:flex;flex-direction:column;gap:0}
.qx-slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 6px;min-height:calc(var(--ts) + 8px)}
.qx-slot{width:var(--ts);height:calc(var(--ts) * 1.1);border-bottom:4px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;position:relative;transition:background .2s,border-color .2s}
.qx-slot.nx{border-color:var(--club,var(--red));background:rgba(255,255,255,.09);animation:qxNext 1.4s ease-in-out infinite}
@keyframes qxNext{50%{background:rgba(255,255,255,.16)}}
.qx-b.word .qx-slots{justify-content:flex-start}
.qx-b.word .qx-slot{width:auto;min-width:64px;height:54px}
.qx-meter{text-align:center;font:700 12px var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:2px 0 4px;min-height:18px}
.qx-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px;padding:16px 8px 10px;background:rgba(0,0,0,.22);border-top:1px solid var(--line)}
.qx-cell{width:var(--ts);height:calc(var(--ts) * 1.1);background:rgba(255,255,255,.05);display:grid;place-items:center}
.qx-b.word .qx-cell{width:auto;min-width:56px;height:54px}
.qx-t{width:100%;height:100%;min-width:var(--ts);border:0;cursor:pointer;background:var(--ink);color:var(--inv);font:800 calc(var(--ts) * .56)/1 var(--fd);text-transform:none;padding:0 10px;display:grid;place-items:center;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.45),0 10px 20px rgba(0,0,0,.3);transition:filter .2s,background .2s,color .2s,box-shadow .15s;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.qx-b.word .qx-t{font-size:20px;white-space:nowrap;font-family:var(--fb);font-weight:700;padding:0 14px;min-height:54px}
.qx-t:active{box-shadow:0 1px 0 rgba(0,0,0,.45);transform:translateY(4px)}
.qx-slot .qx-t{box-shadow:0 3px 0 rgba(0,0,0,.4)}
.qx-t.lock{background:#2fd27a;color:#04210f;cursor:default}
.qx-t.hit{background:#2fd27a;color:#04210f;animation:qxWave .5s var(--qx-ease) both;animation-delay:calc(var(--i,0)*.06s)}
.qx-t.miss{background:var(--red);color:#fff;animation:shake .45s}
.qx-t.keep{background:#2fd27a;color:#04210f}
.qx-cell.used{background:transparent;outline:2px dashed rgba(255,255,255,.1);outline-offset:-2px}
@keyframes qxWave{0%{transform:none}40%{transform:translateY(-14px) scale(1.12)}100%{transform:none}}
.qx-acts{display:flex;gap:10px;justify-content:center;margin-top:16px}
.qx-acts button{border:0;background:var(--surf);color:var(--ink);font:700 14px var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:11px 16px;cursor:pointer;display:flex;gap:8px;align-items:center}
.qx-acts button svg{width:18px;height:18px}
.qx-acts button:active{transform:scale(.95)}
.qx-acts button:disabled{opacity:.35}
.qx-msg{min-height:22px;text-align:center;font:600 15px var(--fb);color:#f5b82e;margin-top:10px}
#chk.ready{animation:qxReady 1.1s ease-in-out infinite}
@keyframes qxReady{50%{box-shadow:0 0 0 8px rgba(47,210,122,.28)}}
/* duel / group letter game gets the same slots */
.dl-build.qx-slots{display:flex;border:0;padding:0;min-height:0;margin:14px 0}
.dl-build .qx-slot{--ts:42px;width:42px;height:46px;font:800 24px var(--fd);color:var(--ink)}
.dl-build .qx-slot.f{background:var(--ink);color:var(--inv);animation:qxTile .3s var(--qx-ease)}
.dl-chars .ch{width:54px!important;height:58px!important;font-size:26px!important;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .15s,opacity .2s}
.dl-chars .ch:active{transform:translateY(3px)}

/* ---- find the mistake, register, odd-one-out ---- */
.qx-toks{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}
.qx-tok{border:0;background:var(--surf);color:var(--ink);font:700 22px var(--fb);padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .15s}
.qx-tok:active{transform:translateY(3px)}
.qx-tok.bad{background:var(--red);color:#fff;animation:shake .45s}
.qx-tok.right{background:#2fd27a;color:#04210f;animation:qxWave .6s var(--qx-ease)}
.qx-tok.fix{text-decoration:line-through;opacity:.8}
.qx-who{display:flex;gap:10px;margin:22px 0 6px}
.qx-who .opt{flex-direction:column;align-items:flex-start;gap:2px}
.qx-reg{display:inline-block;font:800 12px var(--fb);letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;margin-left:6px;vertical-align:middle;background:rgba(255,255,255,.14)}
.qx-reg.sie{background:#1c5fd6;color:#fff}.qx-reg.du{background:#2fd27a;color:#04210f}.qx-reg.ihr{background:#f5b82e;color:#2b1a00}
.qx-say{font:800 30px/1.15 var(--fd);margin:16px 0 4px}

/* ---- logo motion: splash ---- */
.qxs{position:fixed;inset:0;z-index:9999;background:#0B141B;display:grid;place-items:center;overflow:hidden;animation:qxsOut .55s 1.85s cubic-bezier(.7,0,.2,1) forwards}
@keyframes qxsOut{to{opacity:0;transform:scale(1.08);visibility:hidden}}
.qxs-pitch{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;opacity:.5}
.qxs-pitch circle{fill:none;stroke:rgba(255,255,255,.1);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:qxsDraw 1.3s .1s var(--qx-ease) forwards}
@keyframes qxsDraw{to{stroke-dashoffset:0}}
.qxs-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px}
.qxs-mark{position:relative;width:116px;height:116px;overflow:hidden;transform:scale(.9);animation:qxsMark 1.2s .1s var(--qx-ease) forwards}
@keyframes qxsMark{to{transform:scale(1)}}
.qxs-bg{position:absolute;inset:0;background:var(--qx-red);transform:scale(0,.03);animation:qxsBg .75s .12s var(--qx-ease) forwards}
@keyframes qxsBg{0%{transform:scale(0,.03)}45%{transform:scale(1,.03)}100%{transform:scale(1,1)}}
.qxs-eg{position:absolute;inset:0;background:url(brand/eagle.png) center/88% no-repeat;clip-path:inset(100% 0 0 0);opacity:0;animation:qxsEg .7s .6s var(--qx-ease) forwards}
@keyframes qxsEg{0%{clip-path:inset(100% 0 0 0);opacity:1;transform:translateY(14px)}100%{clip-path:inset(0 0 0 0);opacity:1;transform:none}}
.qxs-sh{position:absolute;inset:-10%;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);transform:translateX(-130%);animation:qxsSh .8s 1.2s ease-in-out forwards}
@keyframes qxsSh{to{transform:translateX(130%)}}
.qxs-ring{position:absolute;left:50%;top:58px;width:116px;height:116px;margin:-58px 0 0 -58px;border:2px solid var(--qx-red);opacity:0;animation:qxsRing 1.3s .75s ease-out}
.qxs-ring.r2{animation-delay:.95s;border-color:rgba(255,255,255,.5)}
@keyframes qxsRing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.qxs-word{display:flex;gap:.22em;font:800 30px var(--fd);letter-spacing:.3em;color:#fff;padding-left:.3em}
.qxs-word span{opacity:0;transform:translateY(16px);animation:qxUp .5s var(--qx-ease) forwards}
.qxs-tag{font:600 12px var(--fb);letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.55);opacity:0;animation:qxUp .6s 1.4s both;margin-top:-14px}

/* ---- logo motion: kick-off wipe when a session starts ---- */
.qx-kick{position:fixed;inset:0;z-index:300;pointer-events:none;background:var(--club,var(--qx-red));display:grid;place-items:center;animation:qxKick .7s ease-out both}
.qx-kick i{width:150px;height:150px;background:url(brand/eagle.png) center/contain no-repeat;filter:drop-shadow(0 10px 30px rgba(0,0,0,.3));animation:qxKickEg .7s var(--qx-ease) both}
@keyframes qxKick{0%{opacity:0}22%{opacity:1}60%{opacity:1}100%{opacity:0}}
@keyframes qxKickEg{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.04);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(.96);opacity:0}}

/* ---- logo motion: stamp on the result screen, shine on the header logo ---- */
.qx-stamp{position:relative;width:76px;height:76px;margin:0 auto 6px;background:var(--qx-red);overflow:hidden;animation:qxStamp .8s .1s var(--qx-ease) both}
.qx-stamp::before{content:'';position:absolute;inset:0;background:url(brand/eagle.png) center/84% no-repeat}
.qx-stamp::after{content:'';position:absolute;inset:-10%;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);transform:translateX(-130%);animation:qxsSh .9s .9s ease-in-out forwards}
@keyframes qxStamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}55%{transform:scale(.92) rotate(2deg);opacity:1}100%{transform:none}}
.fin .qx-stamp+.mk,.fin .qx-stamp~.mk{margin-top:6px}
.b3-logo img{position:relative}
.b3-logo.qx-shine::after{content:'';position:absolute;left:0;top:0;width:30px;height:30px;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.7) 50%,transparent 62%);transform:translateX(-130%);animation:qxsSh .8s ease-in-out forwards;pointer-events:none}
.ab-logo img{animation:qxStamp .9s var(--qx-ease) both}

@media (prefers-reduced-motion:reduce){
  .qx-bg i,.combo .cf,.qx-slot.nx,#chk.ready{animation:none!important}
  .qxs,.qx-kick{display:none!important}
  .sMain.qx-in>*,.sMain.qx-in .opt,.sMain.qx-in .qx-t.in{animation:none!important}
}
.qx-b:not(.word) .qx-slots,.qx-b:not(.word) .qx-bank{gap:calc(var(--ts) * .11)}
.qx-t{padding:0!important}
.qx-t.ser{font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-weight:700}
.qx-b:not(.word) .qx-bank{padding:16px 2px 10px}
.qxs-in{gap:0}
.qxs-word{margin-top:48px}
.qxs-tag{margin-top:14px}
.qx-ms{top:auto;bottom:22%}
/*@@end css-qx*/
/*@@css-games*/
/* ───────── word games ───────── */
.gm-pat{display:flex;justify-content:center;gap:8px;margin:18px 0 4px;font:800 34px/1 var(--fd);letter-spacing:.04em;color:var(--ink);text-transform:none}
.gm-bl{display:inline-block;width:.8em;height:1.1em;border-bottom:4px solid var(--qx-red);background:rgba(255,255,255,.05);vertical-align:bottom}
.ws-g{display:grid;gap:4px;justify-content:center;margin:16px auto 6px;touch-action:none;user-select:none;-webkit-user-select:none}
.ws-c{width:var(--cs);height:var(--cs);display:grid;place-items:center;font:800 calc(var(--cs) * .48)/1 var(--fd);color:var(--ink);background:rgba(255,255,255,.06);cursor:pointer;transition:background .12s,color .12s,transform .12s;text-transform:uppercase}
.ws-c.sel{background:var(--ink);color:var(--inv);transform:scale(1.06)}
.ws-c.anch{background:var(--qx-red);color:#fff}
.ws-c.no{background:#8a0f19;color:#fff;animation:gmShake .3s}
.ws-c.fd{color:#06110b;animation:gmPop .4s var(--qx-ease)}
.ws-c.f0{background:#2fd27a}.ws-c.f1{background:#ffd23f}.ws-c.f2{background:#6ec1ff}.ws-c.f3{background:#ff8fa3}
.ws-c.hnt{animation:gmHint .5s ease-in-out 3;background:var(--qx-red);color:#fff}
@keyframes gmPop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:none}}
@keyframes gmShake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes gmHint{50%{transform:scale(1.18)}}
.ws-l{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px}
.ws-l li{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,.05);border-left:4px solid var(--line);font:600 15px var(--fb);color:var(--ink)}
.ws-l li b{font:800 13px var(--fd);opacity:.6}
.ws-l li.on{border-left-color:#2fd27a;color:#2fd27a;text-decoration:line-through;text-decoration-thickness:2px;opacity:.9}
.sn-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;row-gap:12px;margin:26px 0 0}
.sn-l{width:var(--cs);height:calc(var(--cs) * 1.3);display:grid;place-items:center;background:var(--ink);color:var(--inv);font:800 calc(var(--cs) * .62)/1 var(--fd);text-transform:uppercase}
.sn-g{width:14px;height:calc(var(--cs) * 1.3);border:0;padding:0;background:transparent;position:relative;cursor:pointer;margin:0 1px}
.sn-g::after{content:'';position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:transparent;border-radius:2px;transition:background .15s,width .15s,margin .15s}
.sn-g:active::after{background:rgba(255,255,255,.35)}
.sn-g.cut{width:24px}
.sn-g.cut::after{background:var(--qx-red);width:4px;margin-left:-2px;top:-10px;bottom:-10px;box-shadow:0 0 12px var(--qx-red)}
.sn-g.good::after{background:#2fd27a;box-shadow:0 0 12px #2fd27a}
.sn-g.bad::after{background:#ff4d5a;animation:gmShake .3s}
@media (prefers-reduced-motion:reduce){.ws-c,.ws-c.fd,.ws-c.hnt,.ws-c.no,.sn-g.bad::after{animation:none!important;transition:none!important}}

/* play-off board */
.po-art{display:flex;gap:8px;margin-top:20px}
.po-art button{flex:1;padding:14px 0;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:800 20px var(--fd);text-transform:lowercase;cursor:pointer}
.po-art button.on{background:#fff;color:#0B141B;border-color:#fff}
.po-slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;min-height:56px}
.po-slot{min-width:40px;height:50px;border-bottom:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.po-slot.w{min-width:64px;padding:0 4px}
.po-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
.po-cell{min-width:40px;height:50px;background:rgba(255,255,255,.06);display:grid;place-items:center}
.po-cell.w{min-width:60px}
.po-t2{border:0;background:#fff;color:#0B141B;font:800 24px/1 var(--fd);min-width:40px;height:50px;padding:0 10px;cursor:pointer;text-transform:none;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.po-slot.w .po-t2,.po-cell.w .po-t2{font:700 18px var(--fb)}
.po-act{margin-top:12px;display:flex;justify-content:center}

/* memory */
.mm-g{display:grid;gap:8px;margin:14px 0 6px}
.mm-c{position:relative;height:70px;background:none;border:0;padding:0;perspective:700px;cursor:pointer}
.mm-in{position:absolute;inset:0;display:block;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mm-c.up .mm-in,.mm-c.ok .mm-in{transform:rotateY(180deg)}
.mm-f,.mm-b{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-style:normal;text-align:center;padding:4px 8px}
.mm-f{background:var(--surf2);color:var(--mute);font:800 26px var(--fd);border-bottom:4px solid var(--club)}
.mm-b{transform:rotateY(180deg);background:var(--ink);color:var(--inv);font:800 15px/1.15 var(--fd);hyphens:auto;overflow-wrap:break-word}
.mm-c.en .mm-b{background:#fff;color:#0B141B}
.mm-c.ok .mm-b{background:#1c8f55;color:#fff;animation:mmOk .4s}
.mm-c.no .mm-b{background:#b3101e;color:#fff;animation:gmShake .3s}
@keyframes mmOk{50%{transform:rotateY(180deg) scale(1.08)}}
/* bubbles */
.bb-sky{position:relative;height:min(52vh,420px);margin:10px -4px 0;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 70%)}
.bb{position:absolute;bottom:6px;will-change:transform;width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.38),rgba(255,255,255,.08) 60%,rgba(43,163,224,.18));color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:6px;animation:bbRise 10s linear both;box-shadow:inset 0 -8px 14px rgba(43,163,224,.18),0 0 18px rgba(255,255,255,.05)}
.bb span{font:800 14px/1.1 var(--fd);text-align:center;overflow-wrap:anywhere;pointer-events:none}
@keyframes bbRise{0%{transform:translate(0,0)}25%{transform:translate(10px,-110px)}50%{transform:translate(-10px,-230px)}75%{transform:translate(8px,-340px)}100%{transform:translate(0,-470px)}}
.bb.pop{animation:bbPop .45s ease-out forwards!important;pointer-events:none}
.bb.pop.bad{border-color:#ff4455;background:rgba(210,5,21,.35)}
.bb.away{animation:bbAway .5s ease-in forwards!important;pointer-events:none}
@keyframes bbPop{0%{transform:scale(1)}40%{transform:scale(1.3);opacity:1}100%{transform:scale(1.7);opacity:0}}
@keyframes bbAway{to{opacity:0;transform:translateY(-60px) scale(.6)}}
@media (prefers-reduced-motion:reduce){.bb{animation-duration:30s!important}}
/*@@end css-games*/
/*@@css-settings*/
/* ═════════ Profile and Settings (3.2.0) ═════════ */
.st-me{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surf);border:0;border-left:4px solid var(--club);padding:14px 16px;margin:6px 0 14px;color:var(--ink);cursor:pointer}
.st-me span{flex:1;display:flex;flex-direction:column;min-width:0}.st-me b{font:800 20px var(--fd);text-transform:uppercase;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-me small{font:600 12px var(--fb);color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}.st-me i{font:300 28px var(--fd);font-style:normal;color:var(--mute)}
.st-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:2px 16px 8px;scroll-snap-type:x proximity}
.st-tabs::-webkit-scrollbar{display:none}
.st-tabs button{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;padding:10px 14px;background:var(--surf);border:0;color:var(--ink);font:800 12px var(--fd);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;opacity:.78;transition:background .2s,opacity .2s,transform .15s}
.st-tabs button.on{background:var(--ink);color:var(--inv);opacity:1}
.st-tabs button:active{transform:scale(.96)}
.st-body{animation:stIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes stIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.st-g{margin:0 0 20px}

@grammar Reading big numbers and prices
! Numbers are written as one long word: vier + hundert + ein + und + fünfzig = vierhunderteinundfünfzig. The units come before the tens (ein-und-fünfzig).
! 1 as the last digit loses its -s: ein (not eins) in the middle of a number.

function splitArt(de){const m=String(de).trim().match(/^(der|die|das)\s+(.+)$/i);return m?{art:m[1].toLowerCase(),de:m[2].trim()}:{art:'',de:String(de).trim()}}
function parseNotes(txt){
  const out={words:[],gram:[],rules:[]};let lesson='Notes',date=dkey(),topic=null,subj=null;
  for(const raw of String(txt).split(/\r?\n/)){
    const line=raw.trim();if(!line||line.startsWith('//'))continue;
    let m;
    if((m=line.match(/^@lesson\s+(.+)$/i))||(m=line.match(/^#+\s*(.+)$/))){lesson=m[1].trim();topic=null;subj=null;date=dkey();continue}
    if((m=line.match(/^@subject\s+(.+)$/i))){subj=m[1].trim();topic=null;continue}
    if((m=line.match(/^@date\s+(\d{4}-\d{2}-\d{2})/i))){date=m[1];continue}
    if((m=line.match(/^@grammar\s*(.*)$/i))){topic=(m[1]||'Grammar').trim();continue}
    if(/^@(words|vocab)/i.test(line)){topic=null;continue}
    if(line[0]==='!'){out.rules.push({topic:topic||'General',lesson:subj||lesson,sub:!!subj,text:line.replace(/^!+\s*/,'')});continue}
    if(topic!==null){
      const p=line.split('|').map(s=>s.trim());
      if(!/\{\{.+?\}\}/.test(p[0]))continue;
      out.gram.push({type:'g',sentence:p[0],en:p[1]||'',hint:p[2]||'',topic,lesson:subj||lesson,sub:!!subj,date});continue;
    }
    let de,en,ex='',exEn='',note='';
    if(line.includes('\t')){const f=line.split('\t').map(s=>s.trim());de=f[0];en=f[1];ex=f[2]||'';exEn=f[3]||''}
    else{
      const p=line.split('|').map(s=>s.trim());
      const mm=p[0].match(/^(.+?)\s*(?:=|→|->)\s*(.+)$/);if(!mm)continue;
      de=mm[1];en=mm[2];ex=p[1]||'';exEn=p[2]||'';note=p[3]||'';
    }
    if(!de||!en)continue;
    let pl='',forms='';
    const pm=de.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if(pm&&pm[1]){de=pm[1].trim();const inner=pm[2].trim();const pp=inner.match(/^pl\.?\s*:?\s*(.*)$/i);if(pp)pl=pp[1].trim();else forms=inner}
    const a=splitArt(de);
    out.words.push({de:a.de,art:a.art,pl,forms,en,ex,exEn,note,lesson:subj||lesson,sub:!!subj,date});
  }
  return out;
}
function addParsed(p,lo){const r=addParsed0(p,lo);try{S.cards.forEach(regFix)}catch(e){}return r}
function addParsed0(p,lo){
  let a=0,u=0,ga=0,gu=0,ra=0;
  for(const o of p.words){
    const key=((o.art?o.art+' ':'')+o.de).toLowerCase();
    const ex=WA().find(c=>((c.art?c.art+' ':'')+c.de).toLowerCase()===key);
    if(lo){if(ex&&o.sub)ex.lesson=o.lesson;continue}
    if(ex){if(o.sub)ex.lesson=o.lesson;ex.en=o.en||ex.en;if(o.pl)ex.pl=o.pl;if(o.forms)ex.forms=o.forms;if(o.ex)ex.ex=o.ex;if(o.exEn)ex.exEn=o.exEn;if(o.note)ex.note=o.note;u++}
    else{S.cards.push(mk(o));a++}
  }
  for(const o of p.gram){
    const ex=GA().find(c=>c.sentence.toLowerCase()===o.sentence.toLowerCase());
    if(lo){if(ex&&o.sub)ex.lesson=o.lesson;continue}
    if(ex){if(o.sub)ex.lesson=o.lesson;ex.en=o.en||ex.en;if(o.hint)ex.hint=o.hint;ex.topic=o.topic;gu++}else{S.cards.push(mk(o));ga++}
  }
  for(const r of p.rules){const xr=S.rules.find(x=>x.topic===r.topic&&x.text===r.text);if(xr&&r.sub)xr.lesson=r.lesson;if(lo)continue;if(!xr){S.rules.push({id:'r'+h53((r.topic+'|'+r.text).toLowerCase()),idv:1,topic:r.topic,lesson:r.lesson,text:r.text});ra++}}
  return{a,u,ga,gu,ra};
}

  {id:'first',e:'1',n:'Anstoß',t:()=>S.stats.sessions+totalPlays()>=1},

/* ───────── leagues, seasons, form, trophies ───────── */
/* League = the level you hold. To sit in a league your known words must reach the usual vocabulary size of that level
   (cumulative word counts: Goethe-Institut word lists give about 650 for A1, 1,300 for A2 and 2,400 for B1; B2 to C2 are
   the common estimates ~4,000 / ~7,000 / ~10,000). A1 is the starting league (everyone begins there), so its "std" is
   the size of the A1 standard and its entry is 0. */
const TIERS=[
  {n:'3. Liga',lv:'A1',min:0,std:650,cup:'Aufstiegspokal'},
  {n:'DFB-Pokal',lv:'A2',min:1300,std:1300,cup:'DFB-Pokal'},
  {n:'2. Bundesliga',lv:'B1',min:2400,std:2400,cup:'Zweitliga-Pokal'},
  {n:'Bundesliga',lv:'B2',min:4000,std:4000,cup:'Meisterschale'},
  {n:'Europa League',lv:'C1',min:7000,std:7000,cup:'Europa-League-Pokal'},
  {n:'Champions League',lv:'C2',min:10000,std:10000,cup:'Champions-League-Pokal'}
];
const MW={new:0,learning:.3,young:.7,mastered:1};   // how much of a word you "own" at each stage
const GRAM_WE=2;                                    // one grammar item is worth 2 words
const MD_SEASON=4,F_MIN=-100,F_MAX=150;
const knowledge=()=>{let k=0;WALL().forEach(c=>{k+=MW[stateOf(c)]});GALL().forEach(c=>{k+=GRAM_WE*MW[stateOf(c)]});return Math.round(k)};
const lpTier=lp=>{let i=0;TIERS.forEach((t,k)=>{if(lp>=t.min)i=k});return i};
const weekStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
function LS(){
  const st=S.stats;
  if(!st.L){st.L={i:0,season:1,md:0,mdStart:weekStart(Date.now()),first:true,form:0,bonus:0,res:[],seasons:[],exams:{},news:[],tr:[]};st.L.i=lpTier(knowledge())}
  if(!st.L.v2){st.L.v2=1;st.L.i=lpTier(knowledge());st.L.form=Math.max(F_MIN,Math.min(F_MAX,st.L.form||0))}
  return st.L;
}
const lpNow=()=>knowledge()+LS().form+LS().bonus;
const buf=i=>Math.max(25,Math.round(((TIERS[i+1]?TIERS[i+1].min:TIERS[i].min+1500)-TIERS[i].min)*.05));
function tierInfo(){
  const L=LS(),i=L.i,t=TIERS[i],nx=TIERS[i+1],lp=lpNow();
  const zone=nx&&lp>=nx.min?'up':(i>0&&lp<t.min-buf(i))?'down':(i>0&&lp<t.min)?'warn':'safe';
  return{i,t,nx,lp,zone,pct:nx?Math.max(0,Math.min(1,(lp-t.min)/(nx.min-t.min))):1,left:nx?Math.max(0,nx.min-lp):0};
}
const tierIdx=()=>LS().i;
const weekTarget=()=>S.settings.goal*5;
function mdProgress(){
  const L=LS(),a=L.mdStart;let tore=0,days=0;
  for(let i=0;i<7;i++){const d=S.stats.days[dkey(a+i*DAY+12*36e5)];if(d){tore+=d.xp;if(d.xp>=10)days++}}
  return{tore,days,target:weekTarget(),need:4,left:Math.max(0,Math.ceil((a+7*DAY-Date.now())/DAY))};
}
function closeMatchday(){
  const L=LS(),a=L.mdStart;let tore=0,days=0;
  for(let i=0;i<7;i++){const d=S.stats.days[dkey(a+i*DAY+12*36e5)];if(d){tore+=d.xp;if(d.xp>=10)days++}}
  const target=weekTarget();let res,delta;
  if(L.first){res='D';delta=0;L.first=false}                                  // opening week: no penalty
  else if(days===0){res='X';delta=-30}                                         // no-show
  else if(tore<target*.5){res='L';delta=-15}
  else if(tore<target||days<4){res='D';delta=0}
  else if(days>=7){res='W+';delta=30}
  else{res='W';delta=20}
  L.form=Math.max(F_MIN,Math.min(F_MAX,L.form+delta));
  L.res.push({s:L.season,m:L.md+1,tore,days,res,d:delta,t:a});if(L.res.length>60)L.res.shift();
  celebrate({k:'md',n:L.md+1,res,tore,days,d:delta},1200);
  L.md++;L.mdStart=weekStart(a+7*DAY+6*36e5);
  if(L.md>=MD_SEASON)endSeason();
}
function endSeason(){
  const L=LS(),lp=lpNow(),cur=L.i,n=L.season;let ni=cur,out='stay';
  if(cur<TIERS.length-1&&lp>=TIERS[cur+1].min){ni=cur+1;out='up'}
  else if(cur>0&&lp<TIERS[cur].min-buf(cur)){ni=cur-1;out='down'}
  const rs=L.res.filter(r=>r.s===n),w=rs.filter(r=>r.res[0]==='W').length,d=rs.filter(r=>r.res==='D').length,l=rs.length-w-d;
  L.seasons.push({n,lg:cur,lp,out,w,d,l});
  if(out==='up')addTrophy({k:'promo',lg:ni,s:n});
  if(w>=3&&l===0)addTrophy({k:'title',lg:cur,s:n});
  L.exams[n]={lg:cur,best:0,tries:0,grade:''};
  L.news.push({n,from:cur,to:ni,out,lp,w,d,l});
  L.i=ni;L.season=n+1;L.md=0;
}
function settle(){
  const L=LS();let g=0,ch=false;
  while(Date.now()>=L.mdStart+7*DAY&&g++<80){closeMatchday();ch=true}
  if(ch)save();
  return ch;
}
function addTrophy(o){const L=LS();L.tr.push(Object.assign({id:nid(),t:Date.now()},o))}
const GRADES=[['gold',.9,40],['silver',.8,25],['bronze',.7,10]];
function openExam(){
  const L=LS();let best=null;
  Object.keys(L.exams).forEach(k=>{const e=L.exams[k];if(!e.grade&&+k>=L.season-2&&(!best||+k>best.n))best={n:+k,e}});
  return best;
}
const trophyCount=()=>{const c={gold:0,silver:0,bronze:0,total:0};LS().tr.forEach(t=>{c.total++;if(t.g)c[t.g]++});return c};
const trophyName=t=>t.k==='exam'?TIERS[t.lg].cup:t.k==='promo'?'Aufstieg: '+TIERS[t.lg].n:'Saisonmeister';

/* ───────── football statistics ───────── */
function track(c,res){
  const m=S.stats.m||(S.stats.m={sh:0,g:0,ot:0,ga:0,xg:0,cs:0,sec:0});
  const p=c?((c.ok||0)+1)/((c.ok||0)+(c.bad||0)+2):.5;   // chance you would get it right, from your history with this card
  m.sh++;m.xg+=p;
  if(res==='ok')m.g++;else if(res==='close')m.ot++;else m.ga++;
}
function matchStats(){
  const m=Object.assign({sh:0,g:0,ot:0,ga:0,xg:0,cs:0,sec:0},S.stats.m||{});
  const acc=m.sh?m.g/m.sh:0,ontarget=m.sh?(m.g+m.ot)/m.sh:0;
  let days28=0;for(let i=0;i<28;i++){const d=S.stats.days[dkey(Date.now()-i*DAY)];if(d&&d.xp>0)days28++}
  const gm=id=>{const s=S.games[id];return s&&s.all?s.ok/s.all:null};
  const lapses=S.cards.reduce((a,c)=>a+(c.srs?c.srs.lapses:0),0);
  const top=WA().filter(c=>(c.ok||0)>0).sort((a,b)=>(b.ok||0)-(a.ok||0))[0];
  return Object.assign(m,{acc,ontarget,poss:days28/28,pass:gm('match'),pen:gm('dash'),reds:lapses,top,diff:m.g-m.xg});
}
const pctf=v=>v==null?'–':Math.round(v*100)+'%';
function lessonTable(){
  return lessonList().map(l=>{
    const cs=S.cards.filter(c=>c.lesson===l.name&&!c.susp);let ok=0,bad=0;
    cs.forEach(c=>{ok+=c.ok||0;bad+=c.bad||0});

/* ───────── season exam ("Saisonfinale") ───────── */
function startExam(){
  const ex=openExam();if(!ex){toast('No exam available right now');return}
  closeSheet();
  const wp=W().filter(c=>act(c)),gp=G().filter(c=>act(c));
  const seen=shuffle(wp.filter(c=>c.srs.seen>0)),rest=shuffle(wp.filter(c=>!c.srs.seen));
  const pool=seen.concat(rest);
  if(pool.length<10){toast('Needs at least 10 words in your training scope');return}
  const nG=gp.length>=3?4:0,nW=Math.min(20-nG,pool.length);
  const kinds=c=>{const k=['mc2','type','mc1'];if(c.art)k.push('art');if(pluralOf(c))k.push('plu');if(clozeOf(c))k.push('cloze');return k};
  const items=pool.slice(0,nW).map(c=>{const k=kinds(c);return{cid:c.id,kind:k[rnd(k.length)]}}).concat(shuffle(gp).slice(0,nG).map(c=>({cid:c.id,kind:'gcl'})));
  ses={game:'exam',exam:true,examSeason:ex.n,arcade:true,items:shuffle(items),i:0,correct:0,wrong:0,score:0,xp:0,combo:0,maxCombo:0,graded:new Set(),t0:Date.now(),learned:0,locked:false,lastKind:''};
  openOverlay();next();
}
function finishExam(){
  const n=ses.items.length,pct=ses.correct/n,L=LS(),e=L.exams[ses.examSeason],secs=Math.round((Date.now()-ses.t0)/1000);
  stopSpeak();
  const gr=GRADES.find(g=>pct>=g[1]);let note='';
  if(e){e.tries++;e.best=Math.max(e.best,pct)}
  if(gr&&e&&!e.grade){
    e.grade=gr[0];L.bonus+=gr[2];
    addTrophy({k:'exam',lg:e.lg,s:ses.examSeason,g:gr[0],p:Math.round(pct*100)});
    note=`<div class="card patch c-lantern note-card"><span>${trophySvg('cup',gr[0],54)}</span><div><div class="kick">Neue Trophäe</div><div style="font:800 22px var(--fd);text-transform:uppercase">${esc(TIERS[e.lg].cup)} · ${gradeLabel(gr[0])}</div><div class="sub">+${gr[2]} Liga-Punkte</div></div></div>`;
  }
  const xp=Math.round(20+pct*40),before=lvl(S.stats.xp),res=addXP(xp,n);
  S.stats.m=S.stats.m||{sh:0,g:0,ot:0,ga:0,xg:0,cs:0,sec:0};S.stats.m.sec+=secs;if(!ses.wrong){S.stats.m.cs++;S.stats.perfect++}
  const got=checkBadges();save();sfx('win');if(gr)confetti();vib([20,30,20,30,60]);
  const retry=!gr&&e&&!e.grade;
  resultScreen({mood:gr?'cheer':'oops',title:gr?(gr[0]==='gold'?'Meister!':'Bestanden!'):'Nicht bestanden',sub:gr?'Season exam passed.':'You need 70% to win silverware. Review and try again.',stars:gr?3-GRADES.indexOf(gr):0,
    rows:[{v:Math.round(pct*100)+'%',l:'score',c:'lantern'},{v:ses.correct+'/'+n,l:'correct',c:'fern'},{v:'+'+xp,l:'points',c:'sky'}],extra:note+extrasFor(res,got,lvl(S.stats.xp)>before),
    againLabel:retry?'Try again':'Back to the table',again:()=>{closeSes();if(retry)startExam();else{tab='stats';statTab='cabinet';render()}}});
}

  ib.push({id:n.id,kind:n.kind||'news',title:String(n.title||'').slice(0,80),body:String(n.body||'').slice(0,1000),t:n.t||Date.now(),read:false});
  ib.sort((a,b)=>b.t-a.t);S.inbox=ib.slice(0,40);return true;
}

const ID_OK=x=>/^KB-[A-Z0-9]{5}(-[A-Z0-9]{5}){4}$/.test(x)||/^kb_[A-Za-z0-9_-]{20,125}$/.test(x);

function copyText(t){

function fallbackCopy(t){

/* ───────── automatic private account (works offline first) ─────────
   New installs never type a server address or code: the app creates an anonymous account on the default server
   (POST /v1/register) as soon as the phone is online, stores the returned Kobel ID, and then syncs as before.
   Until then everything works offline, and nothing is lost: the first sync uploads what is already on the phone. */
const acct=()=>S.acct||(S.acct={next:0,fails:0,auto:false,noAuto:false,asked:false,idShown:false,visible:false,err:''});
let regBusy=false;
const hasProgress=()=>(S.stats&&S.stats.xp>0)||S.cards.some(c=>c.srs&&c.srs.seen>0);
const hasAccount=()=>!!(S.sync&&S.sync.url&&S.sync.code);

async function autoRegister(manual){
  const base=defaultApi(),a=acct();
  if(!base||hasAccount()||regBusy)return false;
  if(!manual&&(a.noAuto||Date.now()<a.next||navigator.onLine===false))return false;
  regBusy=true;
  try{
    let res;
    try{res=await fetch(base+'/v1/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S.settings.username?{name:S.settings.username}:{})})}
    catch(e){const er=new Error(tx('No internet connection. Kobel keeps working and will try again.','Keine Internetverbindung. Kobel funktioniert weiter und versucht es später erneut.'));er.retry=120000;throw er}
    let j=null;try{j=await res.json()}catch(e){}
    if(res.status!==201||!j||!j.id){
      const er=new Error(res.status===429?tx('Too many new accounts from this connection today. Kobel will try again later.','Heute wurden von dieser Verbindung zu viele Konten erstellt. Kobel versucht es später erneut.')
        :res.status===403?tx('New accounts are paused right now.','Neue Konten sind gerade pausiert.')
        :tx('The server could not create an account yet. Kobel will try again later.','Der Server konnte noch kein Konto erstellen. Kobel versucht es später erneut.'));
      er.retry=res.status===429?6*3600000:res.status===403||res.status===404||res.status===405?12*3600000:600000;throw er;
    }
    S.sync={url:base,code:j.id,pulled:0};
    if(j.user&&j.user.name)S.settings.username=j.user.name;
    a.fails=0;a.next=0;a.err='';a.visible=!!(j.user&&j.user.visible);a.noAuto=false;
    save();
    syncNow(false).then(()=>{loadNotices();if(!a.idShown)idSheet();render()});
    return true;
  }catch(e){
    a.fails=(a.fails||0)+1;a.err=e.message;a.next=Date.now()+Math.min(6*3600000,(e.retry||600000)*Math.pow(2,Math.min(a.fails-1,4)));
    save();if(manual)toast(e.message);if(tab==='settings'||tab==='profile')render();
    return false;
  }finally{regBusy=false}
}

/* ───────── harder wrong answers + no repeated questions ─────────
   Wrong options are chosen to look like the right one: same kind of word, same subject, similar spelling or length,

zig", "54"], ["fünfundsechzig", "65"]]}, {"k": "drill", "h": "Quick check", "q": "What is 28?", "opts": ["zweiundachtzig", "achtundzwanzig", "achtzehn"], "a": 1, "why": "Unit first: acht + und + zwanzig = 28.", "de": "achtundzwanzig"}, {"k": "drill", "h": "Quick check", "q": "Which number is 16?", "opts": ["sechzig", "sechzehn", "sechs"], "a": 1, "why": "sechzehn = sechs without the s + zehn. Sechzig is 60."}, {"k": "recap", "h": "Full time", "say": "You can read any scoreboard now. Train the numbers to get fast.", "subject": "Numbers"}]}, {"id": "verbs", "md": 5, "tag": "Training ground", "title": "Everyday verbs", "de": "Verben", "sub": "Make regular verbs work with every player, plus haben.", "subject": "Everyday verbs", "boards": [{"k": "talk", "h": "The training ground", "say": "Verbs are your players. They change their ending depending on who is playing. Learn one pattern and most verbs follow it.", "pts": ["Take the stem (komm-)", "Add the ending", "Learn haben separately"]}, {"k": "words", "h": "Five everyday verbs", "say": "These will work in almost every conversation.", "items": [["kommen", "to come"], ["wohnen", "to live (reside)"], ["lernen", "to learn"], ["gehen", "to go"], ["leben", "to live"], ["sagen", "to say"]]}, {"k": "table", "h": "Regular endings", "say": "Take the stem, add the ending. kommen → komm- + ending.", "rows": [["ich", "komme (-e)"], ["du", "kommst (-st)"], ["er/sie/es", "kommt (-t)"], ["wir", "kommen (-en)"], ["ihr", "kommt (-t)"], ["sie/Sie", "kommen (-en)"]], "hi": [0, 1], "sp": "v"}, {"k": "words", "h": "In real sentences", "say": "See the endings at work.", "items": [["Ich komme aus Deutschland.", "I come from Germany."], ["Wo wohnst du?", "Where do you live?"], ["Warum lernst du Deutsch?", "Why are you learning German?"], ["Wohin gehst du?", "Where are you going?"], ["Ich lebe allein.", "I live alone."]]}, {"k": "table", "h": "haben = to have", "say": "haben is irregular. Careful: er/sie/es is hat, not habt.", "rows": [["ich", "habe"], ["du", "hast"], ["er/sie/es", "hat"], ["wir", "haben"], ["ihr", "habt"], ["sie/Sie", "haben"]], "hi": [1, 2], "sp": "v"}, {"k": "table", "h": "Stems ending in -t", "say": "When the stem ends in t, add an extra e so you can say it. arbeiten = to work.", "rows": [["ich", "arbeite"], ["du", "arbeitest"], ["er/sie/es", "arbeitet"], ["wir", "arbeiten"], ["ihr", "arbeitet"], ["sie/Sie", "arbeiten"]], "hi": [1, 2], "sp": "v"}, {"k": "dlg", "h": "Match tape: getting to know you", "say": "A short chat using the new verbs.", "lines": [["A", "Woher kommst du?", "Where are you from?"], ["B", "Ich komme aus Österreich.", "I come from Austria."], ["A", "Wo wohnst du?", "Where do you live?"], ["B", "Ich wohne in Berlin.", "I live in Berlin."], ["A", "Warum lernst du Deutsch?", "Why are you learning German?"]]}, {"k": "drill", "h": "Quick check", "q": "Complete: Du ___ eine Frage.", "opts": ["habe", "hast", "hat"], "a": 1, "why": "du hast. Ich habe, du hast, er hat.", "de": "Du hast eine Frage."}, {"k": "drill", "h": "Quick check", "q": "Complete: Woher ___ du?", "opts": ["komme", "kommst", "kommt"], "a": 1, "why": "With du the ending is -st: du kommst."}, {"k": "recap", "h": "Full time", "say": "Now you can talk about what people do. Train the verbs next.", "subject": "Everyday verbs"}]}, {"id": "questions", "md": 6, "tag": "Set pieces", "title": "Questions", "de": "Fragen", "sub": "Ask anything with W-questions and yes/no questions.", "subject": "Questions & answers", "boards": [{"k": "talk", "h": "Set pieces", "say": "A question is a set piece. There are only two types, and each has a fixed shape. Learn the shape and you can ask anything.", "pts": ["W-Frage: starts with a question word", "Ja/Nein-Frage: starts with the verb"]}, {"k": "words", "h": "The W-words", "say": "All W-questions start with W. Learn them as a group.", "items": [["was", "what"], ["wer", "who"], ["wann", "when"], ["wo", "where"], ["woher", "where from"], ["wohin", "where to"], ["warum", "why"], ["wie", "how"], ["welche", "which"], ["wie viel", "how much"], ["wie viele", "how many"]]}, {"k": "slots", "h": "Formation 1: W-Frage", "say": "Question word first. The verb is always player number 2.", "rows": [{"line": "Wo wohnst du?", "parts": [["Wo", "question word"], ["wohnst", "verb = position 2", "hi"], ["du", "subject"]]}, {"line": "Woher kommst du?", "parts": [["Woher", "question word"], ["kommst", "verb = position 2", "hi"], ["du", "subject"]]}, {"line": "Wer ist das?", "parts": [["Wer", "question word"], ["ist", "verb = position 2", "hi"], ["das", "subject"]]}]}, {"k": "slots", "h": "Formation 2: Ja/Nein-Frage", "say": "No question word. The verb jumps to position 1 and the answer is ja or nein.", "rows": [{"line": "Ist das dein Vater?", "parts": [["Ist", "verb = position 1", "hi"], ["das", "subject"], ["dein Vater?", "rest"]]}, {"line": "Kommst du aus dem Iran?", "parts": [["Kommst", "verb = position 1", "hi"], ["du", "subject"], ["aus dem Iran?", "rest"]]}]}, {"k": "dlg", "h": "Match tape: reporter", "say": "A short interview with questions of both types.", "lines": [["A", "Wer ist das?", "Who is that?"], ["B", "Das ist Jan.", "That is Jan."], ["A", "Wie viele Bücher hast du?", "How many books do you have?"], ["B", "Ich habe zwei Bücher.", "I have two books."], ["A", "Wie viel kostet das?", "How much does that cost?"]]}, {"k": "order", "h": "Build the play", "q": "Put the words in order: Where do you live?", "words": ["Wo", "wohnst", "du"], "why": "W-word first, then the verb in position 2, then the subject."}, {"k": "drill", "h": "Quick check", "q": "Which one is a Ja/Nein-Frage?", "opts": ["Wer ist das?", "Ist das dein Vater?", "Wo wohnst du?"], "a": 1, "why": "It starts with the verb, so the answer is ja or nein."}, {"k": "drill", "h": "Quick check", "q": "Where is the verb in a W-Frage?", "opts": ["Position 1", "Position 2", "Last"], "a": 1, "why": "Always position 2: Wo wohnst du?"}, {"k": "recap", "h": "Full time", "say": "You can now ask any question  you have children?"], ["B", "Ja, ich habe ein Kind.", "Yes, I have one child."], ["A", "Wo wohnst du?", "Where do you live?"], ["B", "Ich wohne in Hamburg. Ich lebe allein.", "I live in Hamburg. I live alone."]]}, {"k": "drill", "h": "Quick check", "q": "Which word means single (not married)?", "opts": ["ledig", "geschieden", "verlobt"], "a": 0, "why": "ledig = single. geschieden = divorced, verlobt = engaged."}, {"k": "drill", "h": "Quick check", "q": "Which is the form field for your job?", "opts": ["Wohnort", "Beruf", "Alter"], "a": 1, "why": "Beruf = profession. Wohnort is your place of residence."}, {"k": "recap", "h": "Full time", "say": "Your player card is ready. Train the personal details.", "subject": "Personal details"}]}, {"id": "countries", "md": 8, "tag": "Away fixtures", "title": "Countries", "de": "Länder", "sub": "Say where you come from and where you live: aus and in.", "subject": "Countries & languages", "boards": [{"k": "talk", "h": "Away fixtures", "say": "Where do you come from, and where do you play now? German uses two small words for that: aus for the origin, in for the present place.", "pts": ["aus = origin", "in = place where you are"]}, {"k": "words", "h": "The map", "say": "Most countries have no article.", "items": [["Deutschland", "Germany"], ["Österreich", "Austria"], ["Frankreich", "France"], ["Italien", "Italy"], ["Schweden", "Sweden"], ["Spanien", "Spain"], ["China", "China"], ["England", "England"], ["Russland", "Russia"], ["Polen", "Poland"], ["Eritrea", "Eritrea"]]}, {"k": "words", "h": "Countries with an article", "say": "These wear a shirt. After aus it changes: die → der, der → dem, plural → den.", "items": [["die Türkei", "Turkey"], ["die Schweiz", "Switzerland"], ["die USA", "the USA"], ["der Iran", "Iran"]]}, {"k": "slots", "h": "aus + country", "say": "Use aus with the origin. For countries with an article, take care of the shirt.", "rows": [{"line": "Ich komme aus Deutschland.", "parts": [["Ich komme", "I come"], ["aus" , "say": "The female form usually adds -in. Sometimes an umlaut appears too.", "items": [["der Lehrer", "teacher (m.)"], ["die Lehrerin", "teacher (f.)"], ["der Kellner", "waiter"], ["die Kellnerin", "waitress"], ["der Student", "student (m.)"], ["die Studentin", "student (f.)"], ["der Arzt", "doctor (m.)"], ["die Ärztin", "doctor (f.)"]]}, {"k": "words", "h": "More jobs", "say": "Same -in pattern.", "items": [["der Ingenieur", "engineer"], ["der Verkäufer", "salesperson"], ["der Journalist", "journalist"], ["der Architekt", "architect"], ["der Friseur", "hairdresser"], ["der Paketzusteller", "delivery driver"], ["die Krankenschwester", "nurse (f.)"], ["der Tierarzt", "vet"]]}, {"k": "talk", "h": "The -in rule", "say": "Male job + -in = female job. Student → Studentin. Kellner → Kellnerin. Arzt → Ärztin (with an umlaut).", "pts": ["+ -in", "sometimes + umlaut"]}, {"k": "words", "h": "Ask and answer", "say": "Two questions, three ways to answer.", "items": [["Was machst du beruflich?", "what do you do? (informal)"], ["Was machen Sie beruflich?", "what do you do? (formal)"], ["Ich bin ... von Beruf.", "my profession is ..."], ["Ich arbeite als ... bei ...", "I work as ... at ..."]]}, {"k": "slots", "h": "als and bei", "say": "als = the role. bei = the employer.", "rows": [{"line": "Er arbeitet als Friseurin.", "parts": [["Er arbeitet", "he works"], ["als", "as", "hi"], ["Friseurin", "role"]]}, {"line": "Sie arbeitet bei HotSped.", "parts": [["Sie arbeitet", "she works"], ["bei", "at", "hi"], ["HotSped", "employer"]]}]}, {"k": "words", "h": "Training and studying", "say": "Not working yet? Say it like this.", "items": [["die Ausbildung", "vocational training"], ["das Praktikum", "internship"], ["studieren", "to study (at university)"], ["arbeitslos", "unemployed"], ["der Schüler", "pupil"], ["die Rentnerin", "retiree (f.)"]]}, {"k": "dlg", "h": "Match tape: new teammate", "say": "Talking about jobs.", "lines": [["A", "Was machst du beruflich?", "What do you do for a living?"], ["B", "Ich bin Kellnerin. Und du?", "I am a waitress. And you?"], ["A", "Ich studiere Medizin.", "I study medicine."], ["B", "Wo arbeitest du?", "Where do you work?"], ["A", "Ich arbeite bei HotSped.", "I work at HotSped."]]}, {"k": "drill", "h": "Quick check", "q": "Which is the female form of der Student?", "opts": ["die Studentin", "die Student", "die Studenter"], "a": 0, "why": "Add -in: die Studentin."}, {"k": "drill", "h": "Quick check", "q": "Which word shows the employer?", "opts": ["als", "bei", "nicht"], "a": 1, "why": "bei HotSped = at HotSped. als is the role.", "de": "Sie arbeitet bei HotSped."}, {"k": "recap", "h": "Full time", "say": "Your career is clear. Train the job vocabulary.", "subject": "Jobs & work"}]}, {"id": "family", "md": 10, "tag": "The club family", "title": "Family", "de": "Familie", "sub": "Name your family members and say mein / meine.", "subject": "Family", "boards": [{"k": "talk", "h": "The club family", "say": "Every player has a family in the stands. Learn the family words, and the two small words mein and meine.", "pts": ["Family words", "mein / meine · dein / deine", "Name + s"]}, {"k": "words", "h": "Parents and grandparents", "say": "Informal words in a second line.", "items": [["der Vater", "father"], ["der Papa", "dad"], ["die Mutter", "mother"], ["die Mama", "mum"], ["die Eltern", "parents"], ["der Großvater", "grandfather"], ["der Opa", "grandpa"], ["die Großmutter", "grandmother"], ["die Oma", "grandma"], ["die Großeltern", "grandparents"]]}, {"k": "words", "h": "Brothers, sisters, children", "say": "The close family.", "items": [["der Bruder", "brother"], ["die Schwester", "sister"], ["die Geschwister", "siblings"], ["der Sohn", "son"], ["die Tochter", "daughter"], ["der Enkel", "grandson"], ["die Enkelin", "granddaughter"]]}, {"k": "words", "h": "The wider squad", "say": "Uncles, aunts and partners.", "items": [["der Onkel", "uncle"], ["die Tante", "aunt"], ["der Cousin", "cousin (m.)"], ["die Cousine", "cousin (f.)"], ["der Mann", "husband / man"], ["die Frau", "wife / woman"]]}, {"k": "table", "h": "mein / meine", "say": "mein for der and das. meine for die and every plural. dein works the same way.", "rows": [["der Vater", "mein Vater"], ["das Kind", "mein Kind"], ["die Mutter", "meine Mutter"], ["die Eltern", "meine Eltern"]], "hi": [0, 2]}, {"k": "slots", "h": "Whose is it? Add -s", "say": "To say whose it is, add -s to the name. No apostrophe.", "rows": [{"line": "Jans Mutter", "parts": [["Jan", "name"], ["+s", "add -s", "hi"], ["Mutter", "mother"]]}, {"line": "Dorotheas Mann", "parts": [["Dorothea", "name"], ["+s", "add -s", "hi"], ["Mann", "husband"]]}]}, {"k": "dlg", "h": "Match tape: the photo", "say": "Looking at family photos.", "lines": [["A", "Ist das dein Bruder?", "Is that your brother?"], ["B", "Nein, das ist mein Onkel Otto.", "No, that is my uncle Otto."], ["A", "Und das? Ist das deine Oma?", "And that? Is that your grandma?"], ["B", "Ja. Das ist meine Oma.", "Yes. That is my grandma."], ["A", "Wer ist das?", "Who is that?"], ["B", "Das ist meine Schwester Line.", "That is my sister Line."]]}, {"k": "drill", "h": "Quick check", "q": "Complete: Das ist ___ Schwester.", "opts": ["mein", "meine", "meines"], "a": 1, "why": "die Schwester → meine Schwester.", "de": "Das ist meine Schwester."}, {"k": "drill", "h": "Quick check", "q": "Complete: Das ist ___ Vater.", "opts": ["mein", "meine", "deine"], "a": 0, "why": "der Vater → mein Vater."}, {"k": "recap", "h": "Full time", "say": "The family is in the stands. Train the family words.", "subject": "Family"}]}, {"id": "doch", "md": 11, "tag": "VAR check", "title": "Answering: ja / nein / doch", "de": "Antworten", "sub": "The tricky little word doch.", "subject": "Questions & answers", "boards": [{"k": "talk", "h": "The VAR check", "say": "With a normal question you say ja or nein. With a negative question German has a special word: doch. Think of it as a VAR override: the question says no, the truth is yes.", "pts": ["Positive question: ja / nein", "Negative question: doch / nein"]}, {"k": "table", "h": "Positive question", "say": "No nicht in the question. Ja means yes, nein means no.", "rows": [["Ist das dein Bruder?", "Ja, das ist mein Bruder."], ["Ist das dein Bruder?", "Nein, das ist mein Onkel."]], "hi": []}, {"k": "table", "h": "Negative question", "say": "The question has nicht, kein or oder? at the end. Doch means: yes, it IS so. Nein means: no, it is NOT so.", "rows": [["Wohnen deine Eltern nicht in Hamburg?", "Doch, sie wohnen in Hamburg."], ["Wohnen deine Eltern nicht in Hamburg?", "Nein, sie wohnen in Berlin."]], "hi": []}, {"k": "talk", "h": "Remember", "say": "Doch only answers a negative question and always means yes. Think: doch = 'on the contrary, yes'.", "pts": ["+ question: ja / nein", "- question: doch / nein"]}, {"k": "dlg", "h": "Match tape: the doubt", "say": "Ja, nein and doch in one chat.", "lines": [["A", "Ist das deine Schwester?", "Is that your sister?"], ["B", "Nein, das ist meine Tante.", "No, that is my aunt."], ["A", "Wohnen deine Eltern nicht in Hamburg?", "Don't your parents live in Hamburg?"], ["B", "Doch, sie wohnen in Hamburg.", "Yes, they do."], ["A", "Leben Georg und Angela zusammen?", "Do Georg and Angela live together?"], ["B", "Ja, sie leben zusammen.", "Yes, they do."]]}, {"k": "drill", "h": "Quick check", "q": "Ist Maren nicht geschieden? She IS divorced. Answer:", "opts": ["Ja", "Doch", "Nein"], "a": 1, "why": "A negative question and the answer is yes: Doch.", "de": "Doch, sie ist geschieden."}, {"k": "drill", "h": "Quick check", "q": "Ist das dein Bruder? He is NOT your brother. Answer:", "opts": ["Doch", "Ja", "Nein"], "a": 2, "why": "A positive question and the answer is no: Nein."}, {"k": "recap", "h": "Full time", "say": "VAR approved. Train the questions and answers.", "subject": "Questions & answers"}]}, {"id": "genders", "md": 12, "tag": "Tactics board", "title": "Noun genders", "de": "Genus-Regeln", "sub": "Rules to guess der, die or das from the word.", "subject": "Noun genders", "boards": [{"k": "talk", "h": "The tactics board", "say": "Most nouns have no logic. But many follow rules by ending or by category. These rules guess most of the squad correctly.", "pts": ["der: categories", "die: endings", "das: endings"]}, {"k": "table", "h": "der: by category", "say": "Alcohol, car brands, times and weather are usually der.", "rows": [["Alcohol", "der Gin, der Wodka (exception: das Bier)"], ["Cars", "der BMW, der Honda (exception: das Auto)"], ["Time", "der Tag, der Monat, der Januar, der Mittwoch, der Frühling"], ["Weather", "der Regen, der Schnee"]], "hi": []}, {"k": "table", "h": "die: by ending", "say": "These endings are almost always die.", "rows": [["-eit", "die Krankheit"], ["-ung", "die Ausbildung"], ["-ion", "die Information"], ["-in", "die Lehrerin"], ["-e", "die Tasche, die Batterie"], ["Motorbikes", "die Kawasaki"]], "hi": []}, {"k": "table", "h": "das: by ending", "say": "These are das.", "rows": [["-chen", "das Mädchen, das Brötchen"], ["-lein", "das Äuglein"], ["-o", "das Kino"], ["Ge-", "das Gemüse, das Gesicht"]], "hi": []}, {"k": "talk", "h": "Exceptions", "say": "Every rule has exceptions. Times: die Woche, die Nacht, das Jahr. Weather: das Gewitter, die Sonne. Nouns in -e: der Name, der Buchstabe, das Auge, das Ende. -o: die Disko. Ge-: die Gesundheit, die Gebühr.", "pts": ["Learn exceptions as separate words"]}, {"k": "drill", "h": "Quick check", "q": "Which article: ___ Krankheit?", "opts": ["der", "die", "das"], "a": 1, "why": "-eit is always die: die Krankheit."}, {"k": "drill", "h": "Quick check", "q": "Which article: ___ Mädchen?", "opts": ["der", "die", "das"], "a": 2, "why": "-chen is always das, even for a girl: das Mädchen."}, {"k": "drill", "h": "Quick check", "q": "Which article: ___ Wodka?", "opts": ["der", "die", "das"], "a": 0, "why": "Alcohol is usually der: der Wodka."}, {"k": "recap", "h": "Full time", "say": "You can guess most genders now. Train them for real.", "subject": "Noun genders"}]}, {"id": "furniture", "md": 13, "tag": "Dressing room", "title": "Furniture & home", "de": "Möbel", "sub": "Name the things in your home and the shop.", "subject": "Furniture & home", "boards": [{"k": "talk", "h": "The dressing room", "say": "Look around the dressing room: table, chairs, lamp. These are the home words. Remember: learn each one with its article.", "pts": ["der / die / das", "Das ist ein ... / eine ..."]}, {"k": "words", "h": "Things at home", "say": "Tap each and look at its shirt.", "items": [["das Sofa", "sofa"], ["der Tisch", "table"], ["der Stuhl", "chair"], ["der Sessel", "armchair"], ["der Schrank", "cupboard"], ["das Regal", "shelf"], ["das Bett", "bed"], ["der Teppich", "carpet"]]}, {"k": "words", "h": "More", "say": "On the wall and in the room.", "items": [["das Bild", "picture"], ["die Lampe", "lamp"], ["die Uhr", "clock"], ["die Tür", "door"], ["das Fenster", "window"], ["im Möbelgeschäft", "in the furniture shop"]]}, {"k": "dlg", "h": "Match tape: what is that?", "say": "Name things in the room.", "lines": [["A", "Was ist das?", "What is that?"], ["B", "Das ist ein Tisch.", "That is a table."], ["A", "Und das?", "And that?"], ["B", "Das ist eine Lampe.", "That is a lamp."], ["A", "Das Fenster ist groß.", "The window is big."]]}, {"k": "drill", "h": "Quick check", "q": "Which article: ___ Stuhl?", "opts": ["der", "die", "das"], "a": 0, "why": "der Stuhl."}, {"k": "drill", "h": "Quick check", "q": "Which article: ___ Lampe?", "opts": ["der", "die", "das"], "a": 1, "why": "die Lampe: nouns in -e are mostly die."}, {"k": "recap", "h": "Full time", "say": "The dressing room is furnished. Train the furniture words.", "subject": "Furniture & home"}]}, {"id": "describe", "md": 14, "tag": "Transfer market", "title": "Describing & prices", "de": "Beschreiben", "sub": "Adjectives, opinions, and asking the price.", "subject": "Describing & prices", "boards": [{"k": "talk", "h": "The transfer market", "say": "At the transfer market you describe the player and ask the price. In a shop it is the same: adjectives, opinion and price.", "pts": ["Adjectives come in opposites", "Er / sie / es for things", "Wie viel kostet ...?"]}, {"k": "words", "h": "Opposites", "say": "Learn them in pairs.", "items": [["schön", "beautiful"], ["hässlich", "ugly"], ["teuer", "expensive"], ["günstig", "cheap"], ["groß", "big"], ["klein", "small"], ["alt", "old"], ["modern", "modern"], ["lang", "long"], ["kurz", "short"]]}, {"k": "table", "h": "er / sie / es for things", "say": "A thing is replaced by the pronoun that matches its article.", "rows": [["der Stuhl", "er"], ["die Lampe", "sie"], ["das Bett", "es"]], "hi": [0, 1, 2]}, {"k": "words", "h": "Give an opinion", "say": "Wie findest du ...? asks what you think. Ich finde ... gives your opinion.", "items": [["Wie findest du das Bild?", "what do you think of the picture?"], ["Ich finde, das Bild ist teuer.", "I think the picture is expensive."], ["Das finde ich auch.", "I agree."], ["Das finde ich nicht.", "I disagree."]]}, {"k": "words", "h": "Ask the price", "say": "Prices in euros.", "items": [["Wie viel kostet er?", "how much does it cost? (der)"], ["Wie viel kostet sie?", "(die)"], ["Wie viel kostet es?", "(das)"], ["der Euro", "euro"], ["das Sonderangebot", "special offer"]]}, {"k": "dlg", "h": "Match tape: in the shop", "say": "The whole shopping conversation.", "lines": [["A", "Wir sind im Möbelgeschäft. Wie findest du das Bild?", "We are in the furniture shop. What do you think of the picture?"], ["B", "Ich finde, das Bild ist teuer.", "I think the picture is expensive."], ["A", "Das finde ich auch. Der Stuhl ist schön.", "I agree. The chair is beautiful."], ["B", "Wie viel kostet er?", "How much does it cost?"], ["A", "Der Stuhl kostet nur 59 Euro.", "The chair costs only 59 euros."], ["B", "Oh, das ist aber günstig! Das ist ein Sonderangebot.", "Oh, that is really cheap! That is a special offer."]]}, {"k": "drill", "h": "Quick check", "q": "Which pronoun replaces die Lampe?", "opts": ["er", "sie", "es"], "a": 1, "why": "die → sie: Die Lampe ist schön. Sie ist schön."}, {"k": "drill", "h": "Quick check", "q": "What is the opposite of teuer?", "opts": ["günstig", "groß", "alt"], "a": 0, "why": "teuer ↔ günstig / billig."}, {"k": "recap", "h": "Full time", "say": "Deal signed. Train the describing words.", "subject": "Describing & prices"}]}, {"id": "vowel", "md": 15, "tag": "Advanced tactics", "title": "Verbs with vowel change", "de": "Verben mit Vokalwechsel", "sub": "Verbs that change their vowel with du and er/sie/es.", "subject": "Verbs with vowel change", "boards": [{"k": "talk", "h": "Advanced tactics", "say": "Some verbs swap their vowel in the du and er/sie/es forms. The other forms stay normal. Think of it as a player changing position in the middle.", "pts": ["e → i", "e → ie", "a → ä"]}, {"k": "table", "h": "sprechen (e → i)", "say": "Only du and er/sie/es change.", "rows": [["ich", "spreche"], ["du", "sprichst"], ["er/sie/es", "spricht"], ["wir", "sprechen"], ["ihr", "sprecht"], ["sie/Sie", "sprechen"]], "hi": [1, 2], "sp": "v"}, {"k": "table", "h": "nehmen (e → i, double m)", "say": "nehmen also doubles the m: nimmst, nimmt.", "rows": [["ich", "nehme"], ["du", "nimmst"], ["er/sie/es", "nimmt"], ["wir", "nehmen"], ["ihr", "nehmt"], ["sie/Sie", "nehmen"]], "hi": [1, 2], "sp": "v"}, {"k": "table", "h": "lesen (e → ie)", "say": "lesen and sehen change to ie.", "rows": [["du", "liest"], ["er/sie/es", "liest"]], "hi": [0, 1], "sp": "v"}, {"k": "table", "h": "schlafen (a → ä)", "say": "a becomes ä.", "rows": [["ich", "schlafe"], ["du", "schläfst"], ["er/sie/es", "schläft"], ["wir", "schlafen"]], "hi": [1, 2], "sp": "v"}, {"k": "words", "h": "The squad of verbs", "say": "Learn them with their changing forms.", "items": [["essen (du isst)", "to eat"], ["geben (du gibst)", "to give"], ["helfen (er hilft)", "to help"], ["sehen (du siehst)", "to see"], ["fahren (du fährst)", "to drive"], ["tragen (er trägt)", "to carry / to wear"], ["gehen", "does NOT change"]]}, {"k": "words", "h": "In sentences", "say": "See them in action.", "items": [["Du sprichst Englisch.", "You speak English."], ["Er nimmt den Stuhl.", "He takes the chair."], ["Du liest ein Buch.", "You read a book."], ["Du schläfst lange.", "You sleep for a long time."], ["Er hilft mir.", "He helps me."]]}, {"k": "drill", "h": "Quick check", "q": "Complete: Du ___ Englisch.", "opts": ["sprechst", "sprichst", "sprecht"], "a": 1, "why": "sprechen: du sprichst.", "de": "Du sprichst Englisch."}, {"k": "drill", "h": "Quick check", "q": "Complete: Er ___ lange.", "opts": ["schlafet", "schläft", "schlaft"], "a": 1, "why": "schlafen: er schläft (a → ä)."}, {"k": "recap", "h": "Full time", "say": "You have the full tactics board. Train the changing verbs.", "subject": "Verbs with vowel change"}]}, {"id": "languages", "md": 16, "tag": "Semi-final", "title": "Languages", "de": "Sprachen", "sub": "Say which languages you speak and how well.", "subject": "Countries & languages", "boards": [{"k": "talk", "h": "The final", "say": "The last match of the season: languages. You can already say where you are from. Now say what you speak and how well.", "pts": ["Ich spreche ...", "Ich lerne ..."]}, {"k": "words", "h": "Languages", "say": "Language = country + -isch (mostly).", "items": [["Deutsch", "German"], ["Englisch", "English"], ["Französisch", "French"], ["Italienisch", "Italian"], ["Spanisch", "Spanish"], ["Schwedisch", "Swedish"], ["Chinesisch", "Chinese"], ["Russisch", "Russian"], ["Polnisch", "Polish"], ["Türkisch", "Turkish"], ["Persisch", "Persian"], ["Aserbaidschanisch", "Azerbaijani"]]}, {"k": "words", "h": "How well?", "say": "From best to worst.", "items": [["sehr gut", "very well"], ["gut", "well"], ["ein bisschen", "a little bit"], ["gar nicht", "not at all"]]}, {"k": "slots", "h": "Speak, learn, ask", "say": "Verb in position 2 again. Sprechen changes its vowel with du: du sprichst.", "rows": [{"line": "Ich spreche ein bisschen Türkisch.", "parts": [["Ich", "subject"], ["spreche", "verb = position 2", "hi"], ["ein bisschen Türkisch", "rest"]]}, {"line": "Welche Sprachen sprichst du?", "parts": [["Welche Sprachen", "question word"], ["sprichst", "verb = position 2", "hi"], ["du", "subject"]]}]}, {"k": "dlg", "h": "Match tape: the press room", "say": "Two players, many languages.", "lines": [["A", "Welche Sprachen sprichst du?", "Which languages do you speak?"], ["B", "Ich spreche sehr gut Deutsch und ein bisschen Türkisch.", "I speak German very well and a little Turkish."], ["A", "Sprichst du Persisch?", "Do you speak Persian?"], ["B", "Ja. Und ich lerne Deutsch.", "Yes. And I am learning German."], ["A", "Ich spreche gar nicht Chinesisch.", "I do not speak Chinese at all."]]}, {"k": "drill", "h": "Quick check", "q": "How do you say: I speak a little German?", "opts": ["Ich spreche ein bisschen Deutsch.", "Ich spreche gar nicht Deutsch.", "Ich spreche sehr gut Deutsch."], "a": 0, "why": "ein bisschen = a little bit.", "de": "Ich spreche ein bisschen Deutsch."}, {"k": "drill", "h": "Quick check", "q": "Complete: Welche Sprachen ___ du?", "opts": ["sprechen", "sprichst", "spreche"], "a": 1, "why": "du sprichst: e → i."}, {"k": "recap", "h": "Full time", "say": "Full time! That was the last of the early lessons. Train the languages and keep the streak.", "subject": "Countries & languages"}]}, {"id": "bignum", "md": 17, "tag": "Attendance figures", "title": "Big numbers & prices", "de": "Große Zahlen & Preise", "sub": "Count to a million and read prices aloud.", "subject": "Big numbers & prices", "boards": [{"k": "talk", "h": "Attendance figures", "say": "A stadium announcer reads out big crowds. In German a big number is one long word, built from small blocks.", "pts": ["hundert, tausend, Million", "Units before tens, like in einundzwanzig"]}, {"k": "table", "h": "Hundreds", "say": "Say the digit, then hundert. All in one word.", "rows": [["100", "(ein)hundert"], ["200", "zweihundert"], ["300", "dreihundert"], ["450", "vierhundertfünfzig"]], "hi": [3]}, {"k": "table", "h": "Build 451", "say": "Take the blocks one by one. The last digit comes before the tens: ein-und-fünfzig.", "rows": [["4", "vier"], ["100", "hundert"], ["1", "ein"], ["50", "fünfzig"], ["451", "vierhunderteinundfünfzig"]], "hi": [4]}, {"k": "words", "h": "Thousands and a million", "say": "tausend works like hundert. Million is a noun with a capital letter.", "items": [["(ein)tausend", "1.000"], ["zehntausend", "10.000"], ["einhunderttausend", "100.000"], ["zweihundertzehntausend", "210.000"], ["dreihundertzwanzigtausend", "320.000"], ["vierhundertdreißigtausend", "430.000"], ["eine Million", "1.000.000"]]}, {"k": "words", "h": "Reading prices", "say": "Say the euros first, then the cents. The comma is not spoken.", "items": [["Neun Euro neunundneunzig", "9,99 €"]]}, {"k": "drill", "h": "Quick check", "q": "How do you read 9,99 €?", "opts": ["Neun Euro neunundneunzig", "Neunundneunzig Euro neun", "Neun neunundneunzig"], "a": 0, "why": "Euros first, then the cents.", "de": "Neun Euro neunundneunzig"}, {"k": "drill", "h": "Quick check", "q": "Which number is vierhundertfünfzig?", "opts": ["405", "450", "540"], "a": 1, "why": "vier + hundert + fünfzig = 450."}, {"k": "order", "h": "Build the play", "q": "Build the price: 9,99 €.", "words": ["Neun", "Euro", "neunundneunzig"], "why": "Euro first, then the cents."}, {"k": "recap", "h": "Full time", "say": "Final whistle! Big numbers are just blocks. Train them now.", "subject": "Big numbers & prices"}]}, {"id": "einkein", "md": 18, "tag": "Starting eleven", "title": "ein / eine / kein / keine", "de": "Indefinit- & Negativartikel", "sub": "Say 'a' and 'not a' for der, das and die nouns.", "subject": "Articles: ein / kein", "boards": [{"k": "talk", "h": "Starting eleven", "say": "Introduce a player for the first time with a, not the. In German: ein or eine. To say not a, use kein or keine.", "pts": ["der and das → ein / kein", "die → eine / keine"]}, {"k": "slots", "h": "Three forms for each noun", "say": "The word before the noun changes with the noun's gender.", "rows": [{"line": "der Tisch (m.)", "parts": [["ein Tisch", "indefinite", "hi"], ["kein Tisch", "negative"]]}, {"line": "das Buch (n.)", "parts": [["ein Buch", "indefinite", "hi"], ["kein Buch", "negative"]]}, {"line": "die Uhr (f.)", "parts": [["eine Uhr", "indefinite", "hi"], ["keine Uhr", "negative"]]}]}, {"k": "dlg", "h": "Match tape: what is it?", "say": "Introduce a thing, then replace it with er, es or sie.", "lines": [["A", "Das ist ein Tisch.", "That is a table."], ["B", "Ist er aus Holz?", "Is it made of wood?"], ["A", "Ja.", "Yes."], ["B", "Das ist kein Buch.", "That is not a book."], ["A", "Es ist eine Uhr.", "It is a clock."]]}, {"k": "drill", "h": "Quick check", "q": "Complete: Das ist ___ Uhr.", "opts": ["ein", "eine", "kein"], "a": 1, "why": "die Uhr is feminine: eine Uhr."}, {"k": "drill", "h": "Quick check", "q": "Complete: Das ist ___ Buch. (not a book)", "opts": ["kein", "keine", "eine"], "a": 0, "why": "das Buch is neuter: kein Buch."}, {"k": "order", "h": "Build the play", "q": "Build: That is not a clock.", "words": ["Das", "ist", "keine", "Uhr"], "why": "die Uhr → keine Uhr."}, {"k": "recap", "h": "Full time", "say": "Final whistle! You can name things and say what they are not. Train the articles now.", "subject": "Articles: ein / kein"}]}, {"id": "colours", "md": 19, "tag": "Kit room", "title": "Colours & materials", "de": "Farben & Materialien", "sub": "What colour is it, and what is it made of?", "subject": "Colours", "covers": ["Materials"], "boards": [{"k": "talk", "h": "The kit room", "say": "Home kit, away kit, third kit. Every team knows its colours, and what the kit is made of.", "pts": ["Colours: rot, blau, grün ...", "Materials: das Holz, das Glas ..."]}, {"k": "words", "h": "Colours", "say": "Say the colours of the kit.", "items": [["weiß", "white"], ["gelb", "yellow"  you very much."], ["Bitte schön.", "You are welcome."], ["Bitte. Sehr gern.", "You are welcome. My pleasure."], ["Kein Problem.", "No problem."], ["Gern geschehen.", "You are welcome."]]}, {"k": "dlg", "h": "Match tape: partner exercise", "say": "Two partners practise with a picture.", "lines": [["A", "Wie heißt das auf Deutsch?", "What is that called in German?"], ["B", "Ich weiß nicht.", "I do not know."], ["A", "Das ist eine Jacke.", "That is a jacket."], ["B", "Wie bitte? Noch einmal, bitte.", "Pardon? Once more, please."], ["A", "Das ist eine Jacke.", "That is a jacket."], ["B", "Danke schön.", "Thank you very much."], ["A", "Bitte schön.", "You are welcome."]]}, {"k": "words", "h": "man and Mann", "say": "man with a small letter means one / you. der Mann with a capital letter is the man.", "items": [["Wie schreibt man das?", "How do you write that?"], ["der Mann", "the man / the husband"]]}, {"k": "words", "h": "Everyday expressions", "say": "Small phrases that make you sound natural.", "items": [["Schau mal!", "Look!"], ["Egal.", "Whatever."], ["Mir ist egal.", "I do not care."], ["Keine Ahnung.", "No idea."], ["Hier, bitte!", "Here you go!"], ["Freut mich.", "Nice to meet you."], ["Das ist ja interessant.", "That is really interesting."]]}, {"k": "drill", "h": "Quick check", "q": "You did not catch the word. What do you say?", "opts": ["Noch einmal, bitte.", "Kein Problem.", "Freut mich."], "a": 0, "why": "Noch einmal, bitte = once more, please."}, {"k": "drill", "h": "Quick check", "q": "Someone says: Danke schön. What do you answer?", "opts": ["Bitte schön.", "Keine Ahnung.", "Egal."], "a": 0, "why": "Bitte schön = you are welcome."}, {"k": "recap", "h": "Full time", "say": "Final whistle! You can ask, thank and react. Train these phrases.", "subject": "Asking & thanking"}]}, {"id": "office", "md": 24, "tag": "Press box", "title": "Office & technology", "de": "Büro & Technik", "sub": "Things on your desk and what you say at work.", "subject": "Office & technology", "covers": ["Office expressions"], "boards": [{"k": "talk", "h": "The press box", "say": "Laptop, screen, keyboard: the press box is an office. Learn the things on the desk and the words you say when something goes wrong.", "pts": ["Nouns with their articles", "Office exclamations"]}, {"k": "words", "h": "On the desk", "say": "Say each noun with its article.", "items": [["der Laptop", "laptop"], ["der Computer", "computer"], ["der Bildschirm", "screen / monitor"], ["die Tastatur", "keyboard"], ["die Maus", "mouse"], ["der Drucker", "printer"], ["das Tablet", "tablet"], ["der Stift", "pen / marker"], ["der Kalender", "calendar"], ["die Visitenkarte", "business card"]]}, {"k": "words", "h": "Messages and appointments", "say": "Words for work life.", "items": [["die E-Mail", "email"], ["die Nachricht", "message"], ["das Passwort", "password"], ["der Termin", "appointment"]]}, {"k": "dlg", "h": "Match tape: a bad Monday", "say": "Two colleagues at work.", "lines": [["A", "Oh Gott! So viel Arbeit!", "Oh God! So much work!"], ["B", "Hilfe! Mein Passwort ist falsch.", "Help! My password is wrong."], ["A", "Ein Albtraum!", "A nightmare!"], ["B", "Ich komme nicht ins WLAN.", "I cannot get on the Wi-Fi."], ["A", "Morgen leider kein Yoga. Ich habe keine Zeit.", "Unfortunately no yoga tomorrow. I have no time."]]}, {"k": "words", "h": "What are they doing?", "say": "Short office notes.", "items": [["hat Hunger", "is hungry"], ["braucht einen Kaffee", "needs a coffee"], ["telefoniert mit ...", "is on the phone with ..."], ["hat keinen Stift", "does not have a pen"]]}, {"k": "drill", "h": "Quick check", "q": "Your password does not work. What do you say?", "opts": ["Hilfe! Mein Passwort ist falsch.", "Freut mich.", "Wie bitte?"], "a": 0, "why": "Hilfe! Mein Passwort ist falsch."}, {"k": "drill", "h": "Quick check", "q": "What is der Drucker?", "opts": ["printer", "keyboard", "mouse"], "a": 0, "why": "der Drucker = printer."}, {"k": "recap", "h": "Full time", "say": "Final whistle! You can talk about your desk. Train the office words.", "subject": "Office & technology"}]}, {"id": "plurals", "md": 25, "tag": "Squad depth", "title": "Plurals", "de": "Pluralformen", "sub": "The five plural patterns and plural articles.", "subject": "Plurals", "boards": [{"k": "talk", "h": "Squad depth", "say": "One player is a person, a full squad is a team. For nouns, one thing is singular, many things are plural. German has five plural patterns, and every plural noun takes die.", "pts": ["-(e)n · -s · -e · -er · no ending", "The plural article is always die"]}, {"k": "table", "h": "The five patterns", "say": "Learn each noun with its plural.", "rows": [["-(e)n", "die Nachricht → die Nachrichten"], ["-s", "der Laptop → die Laptops"], ["-e / -¨e", "der Termin → die Termine"], ["-¨e", "die Maus → die Mäuse"], ["-er / -¨er", "das Passwort → die Passwörter"], ["— / -¨", "der Drucker → die Drucker"]], "hi": [1]}, {"k": "slots", "h": "ein, kein and the plural", "say": "The plural has no ein. Only the negative form keine exists.", "rows": [{"line": "Singular", "parts": [["der Termin", "definite"], ["ein Termin", "indefinite"], ["kein Termin", "negative"]]}, {"line": "Plural", "parts": [["die Termine", "definite", "hi"], ["Termine", "no article"], ["keine Termine", "negative", "hi"]]}]}, {"k": "words", "h": "In a sentence", "say": "Use the plural with keine.", "items": [["Ich habe Zeit. Ich habe keine Termine.", "I have time. I have no appointments."]]}, {"k": "drill", "h": "Quick check", "q": "What is the plural of der Laptop?", "opts": ["die Laptops", "die Laptope", "die Laptopen"], "a": 0, "why": "Laptop → Laptops (-s)."}, {"k": "drill", "h": "Quick check", "q": "What is the plural of die Maus?", "opts": ["die Mause", "die Mäuse", "die Mausen"], "a": 1, "why": "Maus → Mäuse (-¨e)."}, {"k": "order", "h": "Build the play", "q": "Build: I have no appointments.", "words": ["Ich", "habe", "keine", "Termine"], "why": "Plural: keine, never ein."}, {"k": "recap", "h": "Full time", "say": "Final whistle! Always learn a noun with its plural. Train the plural patterns.", "subject": "Plurals"}]}, {"id": "online", "md": 26, "tag": "Fan shop", "title": "Ordering online", "de": "Online bestellen", "sub": "Read an order form and an email address aloud.", "subject": "Ordering online", "boards": [{"k": "talk", "h": "The fan shop", "say": "Order a shirt online: choose it, check the price, put it in the basket. And give your email address clearly.", "pts": ["Order words", "Reading symbols: _ @ ."]}, {"k": "words", "h": "The order form", "say": "Fields on a shop page.", "items": [["die Sonnenbrille", "sunglasses"], ["die Bestellnummer", "order number"], ["die Menge", "quantity"], ["der Preis", "price"], ["der Warenkorb", "shopping basket"]]}, {"k": "table", "h": "Symbols in an email address", "say": "Say the symbols out loud.", "rows": [["_", "Unterstrich"], ["@", "ät"], [".", "Punkt"]], "hi": [0, 1, 2]}, {"k": "words", "h": "An email address aloud", "say": "Say each symbol as a word.", "items": [["Maria Unterstrich 87 ät gmail Punkt com", "Maria_87@gmail.com"]]}, {"k": "drill", "h": "Quick check", "q": "How do you say the @ sign?", "opts": ["ät", "Punkt", "Unterstrich"], "a": 0, "why": "@ = ät."}, {"k": "drill", "h": "Quick check", "q": "How do you say the dot in an email address?", "opts": ["Punkt", "ät", "Menge"], "a": 0, "why": ". = Punkt."}, {"k": "recap", "h": "Full time", "say": "Order placed! Train the shop words.", "subject": "Ordering online"}]}, {"id": "akk", "md": 27, "tag": "Direct play", "title": "The accusative", "de": "Der Akkusativ", "sub": "Who or what gets the action: only der changes.", "subject": "Accusative verbs", "covers": ["Accusative: bag and desk", "Accusative: sentences"], "boards": [{"k": "talk", "h": "Direct play", "say": "In a match the ball goes to a player. In a sentence the action goes to an object. That direct object takes the accusative. Good news: only the masculine article changes.", "pts": ["Direct function tch(){const st=S.stats;if(!st.teach||typeof st.teach!=='object')st.teach={};const t=st.teach;if(!t.done)t.done={};if(!t.seen)t.seen={};return t}

/* ---- audio: one line after another (dialogues) ---- */
window.onKobelSpeakDone=id=>{const f=TRCB[id];if(f){delete TRCB[id];f()}};
function speakLine(text,rate,pitch){
  return new Promise(res=>{
    let fin=false;const done=()=>{if(fin)return;fin=true;clearTimeout(tm);res()};
    const est=Math.max(900,text.length*(rate<.75?135:95)+500);
    const tm=setTimeout(done,NATIVE&&NATIVE.speakLine?est*2+2000:est);
    try{
      if(NATIVE){
        if(NATIVE.speakLine){const id='t'+(++TRCN);TRCB[id]=done;NATIVE.speakLine(String(text),rate,pitch,id)}
        else NATIVE.speak(String(text),rate);
      }else if(deVoice){
        const u=new SpeechSynthesisUtterance(text);u.lang=deVoice.lang;u.voice=deVoice;u.rate=rate;u.pitch=pitch;u.onend=done;u.onerror=done;speechSynthesis.speak(u);
      }else done();
    }catch(e){done()}
  });
}
function trStop(){TRSEQ++;TR.play=-1;stopSpeak();trMarkPlay()}
function trMarkPlay(){document.querySelectorAll('#tr .tl').forEach(e=>e.classList.toggle('on',+e.dataset.i===TR.play));const b=$('#tr [data-a="tchplay"]');if(b)b.classList.toggle('stop',TR.play>=0)}
async function trPlay(from){
  const b=trUnit().boards[TR.i];if(!b||b.k!=='dlg')return;
  if(!canSpeak()){toast(noVoiceMsg());return}
  if(TR.play>=0&&from==null){trStop();return}
  const tok=++TRSEQ;stopSpeak();
  const rate=TR.slow?.62:.9;
  const list=from!=null?[from]:b.lines.map((_,i)=>i);
  for(const i of list){
    if(tok!==TRSEQ)return;
    TR.play=i;trMarkPlay();
    const el=document.querySelector('#tr .tl[data-i="'+i+'"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',behavior:'smooth'});
    await speakLine(b.lines[i][1],rate,b.lines[i][0]==='A'?1:1.18);
    if(tok!==TRSEQ)return;
    await new Promise(r=>setTimeout(r,from!=null?0:380));
  }
  if(tok===TRSEQ){TR.play=-1;trMarkPlay()}
}

  }

const dLabel=k=>{try{return new Date(k+'T12:00:00').toLocaleDateString(isDe()?'de-DE':'en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return k}};
function recordsData(){
  const st=S.stats,days=Object.entries(st.days||{});
  let bestDay=['',0],busy=['',0];const wk={};
  days.forEach(([k,v])=>{const x=v.xp||0,n=v.n||0;if(x>bestDay[1])bestDay=[k,x];if(n>busy[1])busy=[k,n];const w=dkey(weekStart(new Date(k+'T12:00:00').getTime()));wk[w]=(wk[w]||0)+x});
  let bestWeek=['',0];Object.entries(wk).forEach(([k,v])=>{if(v>bestWeek[1])bestWeek=[k,v]});
  const first=days.map(d=>d[0]).sort()[0]||'',L=LS();
  const plays=Object.entries(S.games||{}).sort((a,b)=>(b[1].plays||0)-(a[1].plays||0))[0];
  const bestG=Object.entries(S.games||{}).filter(([id,g])=>GAMES[id]&&g.best>0).sort((a,b)=>b[1].stars-a[1].stars||b[1].best-a[1].best)[0];
  const seen=WALL().filter(c=>c.srs.seen>0).sort((a,b)=>b.de.length-a.de.length)[0];
  const tw=tricky()[0],m=mp();
  const top=Math.max(L.i,...(L.seasons||[]).map(s=>s.lg));
  return{bestDay,busy,bestWeek,first,activeDays:days.filter(([k,v])=>v.xp>0).length,plays,bestG,longest:seen,tw,m,top,known:knownN(),mastered:masteredN(),trophies:(L.tr||[]).length,seasons:(L.seasons||[]).length,stars:starTotal(),talks:nTeach(),badges:Object.keys(st.badges||{}).length};
}

function soClaim(d){
  const m=mp();if(!d.result||d.result.winner===null||m.ids.includes(d.id))return;
  const w=d.result.winner;if(w==='them'&&!d.my.done&&false)return;

  else if(w==='draw'){m.d++;addXP(12,0);toast(tx('Draw. +12 XP','Unentschieden. +12 XP'))}
  else{m.l++;m.streak=0;if(d.my.done)addXP(8,0)}
  save();
}
